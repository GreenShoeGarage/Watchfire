      this.onClose('the radio dropped the bluetooth link ' + elapsed + ' s after connect' +
        (sinceWrite === null ? '' : ', ' + sinceWrite + ' s after the last thing we sent it'));
    };
    this.device.addEventListener('gattserverdisconnected', this._onDrop);

    this._note('connect', 'requesting GATT, giving it ' + (BLE_CONNECT_TIMEOUT_MS / 1000) + ' s');
    try {
      this.server = await this._connectWithTimeout(BLE_CONNECT_TIMEOUT_MS);
    } catch (err) {
      this._detach();
      throw err;
    }
    /* Pairing happens somewhere in here if it is going to. Give it a moment
       rather than racing it into service discovery, because a refused bond
       surfaces later as a disconnected server and looks like a dead radio. */
    await sleep(600);
    if (!this.device.gatt.connected) {
      this._detach();
      throw new Error('the radio accepted the connection then dropped it, which is the pairing handshake failing. Pair it in your operating system bluetooth settings first, using the passkey shown on the radio.');
    }
    this._note('paired', 'still connected after the pairing window');
    let svc;
    try {
      svc = await this.server.getPrimaryService(BLE_SERVICE);
    } catch (err) {
      this._detach();
      throw err;
    }
    this._note('services', 'found the Meshtastic service');
    this.chars.toRadio = await svc.getCharacteristic(BLE_TORADIO);
    this.chars.fromRadio = await svc.getCharacteristic(BLE_FROMRADIO);
    this.chars.fromNum = await svc.getCharacteristic(BLE_FROMNUM);
    this._open = true;

    /* Subscribe to FromNum only. Firmware carries an explicit warning that
       adding NOTIFY to FromRadio breaks things and is not backwards
       compatible, so FromRadio is polled, never subscribed to. */
    this.chars.fromNum.addEventListener('characteristicvaluechanged', () => {
      this.stats.notifies++;
      this.drain();
    });
    await this.chars.fromNum.startNotifications();
    this._note('subscribe', 'FromNum notifications on');

    /* The debug lane survives over BLE on its own characteristic. Optional:
       older firmware exposes it under a different id, and some builds not at
       all, so a missing one is not an error. */
    if (this.enableLog) {
      for (const id of [BLE_LOGRADIO, BLE_LOGRADIO_LEGACY]) {
        try {
          const ch = await svc.getCharacteristic(id);
          ch.addEventListener('characteristicvaluechanged', (e) => this._onLogValue(e.target.value));
          await ch.startNotifications();
          this.chars.logRadio = ch;
          this._note('subscribe', 'log characteristic on, which is a lot of traffic');
          break;
        } catch (e) { /* not present on this build */ }
      }
    } else {
      this._note('skip', 'log characteristic left alone to keep the link quiet');
    }
    this.drain();
  }

  _onLogValue(view) {
    if (!view || !view.byteLength) return;
    const bytes = new Uint8Array(view.buffer.slice(view.byteOffset, view.byteOffset + view.byteLength));
    /* Newer firmware sends a LogRecord protobuf here, older sends plain text.
       Try the structured form and fall back rather than guessing from the
       characteristic id, which has been reused across firmware generations. */
    let line = null;
    try {
      const rec = decode('LogRecord', bytes);
      if (rec.message && !rec.$partial) line = rec.message;
    } catch (e) { /* not a LogRecord */ }
    if (line === null) line = utf8Decode(bytes);
    this.stats.logLines++;
    this.onLog(line);
  }

  /* Read FromRadio until it comes back empty. A notify only says there is
     something waiting, not how much, so the only honest end condition is a
     zero length read. */
  drain() {
    if (this._draining) { this._again = true; return; }
    this._draining = true;
    const step = async () => {
      try {
        while (this._open) {
          const view = await this._gatt(() => this.chars.fromRadio.readValue());
          this.stats.reads++;
          this.lastReadAt = Date.now();
          if (!view || !view.byteLength) { this.stats.empties++; break; }
          const bytes = new Uint8Array(view.buffer.slice(view.byteOffset, view.byteOffset + view.byteLength));
          this.stats.messages++;
          this.onMessage(bytes);
        }
      } catch (err) {
        if (this._open) {
          this._open = false;
          this._note('error', 'read failed: ' + (err && err.message ? err.message : err));
          this.onClose('read failed: ' + (err && err.message ? err.message : err));
        }
      }
      this._draining = false;
      if (this._again && this._open) { this._again = false; this.drain(); }
    };
    step();
  }

  async write(bytes) {
    if (!this._open) throw new Error('the bluetooth link is not open');
    if (bytes.length > MAX_TO_FROM_RADIO_SIZE) {
      throw new Error('a ToRadio of ' + bytes.length + ' bytes exceeds the 512 byte limit');
    }
    await this._gatt(() => this.chars.toRadio.writeValue(bytes));
    this.stats.writes++;
    this.lastWriteAt = Date.now();
    this._note('write', bytes.length + ' bytes out');
    /* A write usually produces an answer, and a notify for it can arrive
       before the write settles, so drain unconditionally afterwards. */
    this.drain();
  }

  async close() {
    this._open = false;
    this._note('close', 'closed by the operator');
    this._detach();
    try { if (this.chars.fromNum) await this.chars.fromNum.stopNotifications(); } catch (e) {}
    try { if (this.device.gatt.connected) this.device.gatt.disconnect(); } catch (e) {}
  }
}

/* --------------------------------------------------------------------------
   A simulated GATT device, so the bluetooth path is exercised without
   hardware in exactly the way the serial path is. It presents the same
   surface Web Bluetooth does and is driven by the same synthetic radio, in
   unframed mode.
   -------------------------------------------------------------------------- */
class SimBleDevice {
  constructor(opts) {
    this.name = 'Meshtastic_sim';
    this.id = 'simulated-device';
    this.radio = new SimTransport(Object.assign({ framed: false }, opts || {}));
    this.queue = [];
    this.listeners = { gattserverdisconnected: [] };
    this.charListeners = {};
    this.connected = false;
    this.radio.onMessage = (bytes) => {
      this.queue.push(bytes);
      this._notify(BLE_FROMNUM, new Uint8Array([this.queue.length & 0xff, 0, 0, 0]));
    };
    this.radio.onLogLine = (text) => this._notify(BLE_LOGRADIO, utf8Encode(text));
    const self = this;
    this.gatt = {
      get connected() { return self.connected; },
      connect: async () => {
        /* A radio that is not advertising yet leaves this promise hanging
           forever, which is exactly the case the timeout exists for. */
        if (self.stall) return new Promise(function () {});
        self.connected = true;
        await self.radio.open();
        return self._server();
      },
      disconnect: () => { self.connected = false; self._fire('gattserverdisconnected'); }
    };
  }

  addEventListener(type, fn) { (this.listeners[type] || (this.listeners[type] = [])).push(fn); }
  removeEventListener(type, fn) {
    const l = this.listeners[type] || [];
    const i = l.indexOf(fn);
    if (i >= 0) l.splice(i, 1);
  }
  _fire(type) { (this.listeners[type] || []).forEach(fn => fn({ type: type })); }

  _notify(uuid, bytes) {
    const listeners = this.charListeners[uuid] || [];
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    listeners.forEach(fn => fn({ target: { value: view } }));
  }

  _char(uuid) {
    const self = this;
    return {
      uuid: uuid,
      addEventListener: (type, fn) => { (self.charListeners[uuid] || (self.charListeners[uuid] = [])).push(fn); },
      startNotifications: async () => {},
      stopNotifications: async () => {},
      readValue: async () => {
        if (uuid !== BLE_FROMRADIO) return new DataView(new ArrayBuffer(0));
        const next = self.queue.shift();
        if (!next) return new DataView(new ArrayBuffer(0));
        return new DataView(next.buffer, next.byteOffset, next.byteLength);
      },
      writeValue: async (bytes) => {
        if (uuid !== BLE_TORADIO) throw new Error('not writable');
        await self.radio.write(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
      }
    };
  }

  _server() {
    const self = this;
    return {
      get connected() { return self.connected; },
      getPrimaryService: async (uuid) => {
        if (uuid !== BLE_SERVICE) throw new Error('service not found');
        return {
          getCharacteristic: async (cid) => {
            if ([BLE_TORADIO, BLE_FROMRADIO, BLE_FROMNUM, BLE_LOGRADIO].indexOf(cid) < 0) {
              const e = new Error('characteristic not found'); e.name = 'NotFoundError'; throw e;
            }
            return self._char(cid);
          }
        };
      }
    };
  }

  /* Reproduce the failure a real radio produces when nobody enters the
     passkey: accept the connection, then drop it. */
  dropAfter(ms) { setTimeout(() => this.gatt.disconnect(), ms); }
}

/* ==========================================================================
   WATCHFIRE :: radio session
   Owns the conversation with one radio: the config handshake, the node
   database, the admin path with its session passkey, and the outbound queue.
   Everything it believes carries the frame that told it so.
   ========================================================================== */

const HEARTBEAT_MS = 300000;   // meshtastic/python mesh_interface.py _startHeartbeat, interval 300
const CONFIG_TIMEOUT_MS = 20000;
const ACK_TIMEOUT_MS = 45000;

class RadioSession {
  constructor() {
    this.transport = null;
    this.state = 'idle';         // idle | opening | handshake | ready | closed | error
    this.listeners = Object.create(null);
    this.deframer = null;
    this.myNodeNum = null;
    this.myInfo = null;
    this.metadata = null;
    this.nodes = new Map();
    this.channels = [];
    this.config = new Map();        // variant name -> Config message
    this.moduleConfig = new Map();  // variant name -> ModuleConfig message
    this.packets = [];              // newest last, capped
    this.packetCap = 2000;
    this.debugLines = [];
    this.debugCap = 800;
    this.messages = [];
    this.telemetry = new Map();   // node number -> samples, oldest first
    this.telemetryCap = 900;
    this.routes = [];             // traceroute results, newest last
    this.neighbors = new Map();   // node number -> its last NeighborInfo report
    this.pendingRoutes = new Map();
    this.pending = new Map();       // packet id -> {resolve, entry}
    this.sessionPasskey = null;
    this.passkeyAt = 0;
    this.configNonce = null;
    this.heartbeatTimer = null;
    this.configTimer = null;
    this.txSeq = Math.floor(Math.random() * 0x7fffffff);
    this.stats = { rx: 0, tx: 0, txBytes: 0 };
    this.capture = { started: 0, events: [], bytes: 0, truncated: false };
    this.capturing = false;
    this.captureCap = 40000;      // events, then recording stops rather than eating the tab
    this.notes = [];
    this.partialTypes = new Set();
    this.startedAt = 0;
  }

  on(evt, fn) { (this.listeners[evt] || (this.listeners[evt] = [])).push(fn); return this; }
  emit(evt, arg) { (this.listeners[evt] || []).forEach(fn => { try { fn(arg); } catch (e) { console.error(e); } }); }

  setState(s, detail) {
    this.state = s;
    this.emit('state', { state: s, detail: detail });
  }

  /* ---- connection ---- */
  async connect(transport) {
    this.transport = transport;
    this.deframer = new Deframer({
      onFrame: (f) => this._onFrame(f),
      onStray: (s) => this._onStray(s)
    });
    /* A framed transport delivers a byte lane that has to be reassembled. An
       unframed one delivers whole messages, because GATT already did that
       work, so the deframer is bypassed rather than fed invented headers. */
    this.framed = transport.framed !== false;
    transport.onData = (chunk) => {
      if (this.capturing) this._captureEvent('in', chunk);
      this.deframer.push(chunk);
    };
    transport.onMessage = (payload) => {
      if (this.capturing) this._captureEvent('in', payload);
      this._onFrame(payload);
    };
    transport.onLog = (line) => this._pushDebug(line);
    transport.onClose = (reason) => this._onClose(reason);
    this.oneWay = !!transport.oneWay;
    this.setState('opening');
    this.startedAt = Date.now();
    await transport.open();
    if (!this.framed) {
      /* No wake run over BLE. The wake bytes exist to make a sleeping serial
         device hunt for a frame header, and there is no header here. */
      this.setState('handshake');
      await this._startConfig();
      return;
    }
    if (this.oneWay) {
      /* A recording cannot be asked for anything. Everything this session
         learns has to arrive from the stream, so state is left alone and the
         handshake is watched for rather than started. */
      this.configNonce = null;
      this.setState('handshake');
      clearTimeout(this.configTimer);
      this.configTimer = setTimeout(() => {
        if (this.state === 'handshake') {
          this.setState('error', 'this recording carries no config_complete_id, so the session never completes. ' +
            this.deframer.stats.frames + ' frames were read from it.');
        }
      }, CONFIG_TIMEOUT_MS);
      if (transport.start) transport.start();
      return;
    }
    // Wake a sleeping device, then give it a moment before the first packet.
    await this._raw(WAKE_BYTES);
    await sleep(120);
    this.setState('handshake');
    await this._startConfig();
  }

  async _startConfig() {
    this.configNonce = (Math.floor(Math.random() * 0xfffffffe) + 1) >>> 0;
    if (this.configNonce === 69420) this.configNonce++;   // reserved nodeless id upstream
    this.nodes.clear(); this.channels = []; this.config.clear(); this.moduleConfig.clear();
    await this.send({ $type: 'ToRadio', want_config_id: this.configNonce, $payload_variant: 'want_config_id' });
    clearTimeout(this.configTimer);
    this.configTimer = setTimeout(() => {
      if (this.state === 'handshake') {
        this.setState('error', 'no config_complete_id after ' + (CONFIG_TIMEOUT_MS / 1000) + ' s. The radio answered ' +
          this.deframer.stats.frames + ' frames and ' + this.deframer.stats.strayBytes + ' stray bytes.');
      }
    }, CONFIG_TIMEOUT_MS);
  }

  async disconnect() {
    clearInterval(this.heartbeatTimer);
    clearTimeout(this.configTimer);
    try { if (this.state === 'ready' && !this.oneWay) await this.send({ $type: 'ToRadio', disconnect: true, $payload_variant: 'disconnect' }); } catch (e) {}
    try { if (this.transport) await this.transport.close(); } catch (e) {}
    this.setState('closed', 'disconnected by operator');
  }

  _onClose(reason) {
    clearInterval(this.heartbeatTimer);
    this.setState('closed', reason);
  }

  async _raw(bytes) {
    if (this.capturing) this._captureEvent('out', bytes);
    await this.transport.write(bytes);
  }

  _captureEvent(dir, bytes) {
    if (this.capture.events.length >= this.captureCap) {
      if (!this.capture.truncated) {
        this.capture.truncated = true;
        this.capturing = false;
        this.emit('capture', { state: 'truncated', events: this.capture.events.length });
      }
      return;
    }
    this.capture.events.push({ t: Date.now() - this.capture.started, dir: dir, hex: bytesToHex(bytes) });
    this.capture.bytes += bytes.length;
  }

  startCapture() {
    this.capture = { started: Date.now(), events: [], bytes: 0, truncated: false };
    this.capturing = true;
    this.emit('capture', { state: 'recording' });
  }

  stopCapture() {
    this.capturing = false;
    this.emit('capture', { state: 'stopped', events: this.capture.events.length });
  }

  /* Notes are struck through rather than deleted, so a record of the session
     keeps the correction as well as the correction's target. */
  addNote(text) {
    if (!text || !String(text).trim()) return null;
    const note = { id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1000), t: Date.now(), text: String(text).trim(), struck: false };
    this.notes.push(note);
    this.emit('note', note);
    return note;
  }

  strikeNote(id, struck) {
    const n = this.notes.filter(x => x.id === id)[0];
    if (n) { n.struck = struck === undefined ? true : !!struck; this.emit('note', n); }
    return n;
  }

  async send(toRadio) {
    const body = encode('ToRadio', toRadio);
    const framed = this.framed ? frameEncode(body) : body;
    this.stats.tx++; this.stats.txBytes += framed.length;
    await this._raw(framed);
    this.emit('tx', toRadio);
    return toRadio;
  }

  /* ---- inbound ---- */
  /* Debug text arrives in whatever fragments the wire produces, so lines are
     assembled here rather than split per chunk. A chunk boundary is not a
     line break, and treating it as one is how you get "IN" and "FO |". */
  _onStray(bytes) {
    if (!this._strayDec) {
      this._strayDec = (typeof TextDecoder !== 'undefined') ? new TextDecoder('utf-8', { fatal: false }) : null;
      this._strayBuf = '';
    }
    this._strayBuf += this._strayDec ? this._strayDec.decode(bytes, { stream: true }) : utf8Decode(bytes);
    let idx;
    while ((idx = this._strayBuf.indexOf('\n')) >= 0) {
      const line = this._strayBuf.slice(0, idx).replace(/\r/g, '').trim();
      this._strayBuf = this._strayBuf.slice(idx + 1);
      this._pushDebug(line);
    }
    if (this._strayBuf.length > 2048) { this._pushDebug(this._strayBuf); this._strayBuf = ''; }
  }

  _pushDebug(line) {
    if (!line) return;
    this.debugLines.push({ t: Date.now(), line: line });
    if (this.debugLines.length > this.debugCap) this.debugLines.splice(0, this.debugLines.length - this.debugCap);
    this.emit('debug', line);
  }

  _onFrame(payload) {
    let msg;
    try {
      msg = decode('FromRadio', payload);
    } catch (err) {
      this.emit('debug', 'undecodable frame of ' + payload.length + ' bytes: ' + err.message);
      return;
    }
    this.stats.rx++;
    if (msg.$partial) {
      const where = unknownReport(msg).map(u => u.path + '#' + u.num);
      where.forEach(w => this.partialTypes.add(w));
    }
    this.emit('frame', msg);

    if (msg.my_info) { this.myInfo = msg.my_info; this.myNodeNum = msg.my_info.my_node_num; this.emit('myinfo', msg.my_info); return; }
    if (msg.metadata) { this.metadata = msg.metadata; this.emit('metadata', msg.metadata); return; }
    if (msg.node_info) { this._mergeNode(msg.node_info); return; }
    if (msg.channel) { this._mergeChannel(msg.channel); return; }
    if (msg.config) { this.config.set(msg.config.$payload_variant, msg.config); this.emit('config', msg.config); return; }
    if (msg.moduleConfig) { this.moduleConfig.set(msg.moduleConfig.$payload_variant, msg.moduleConfig); this.emit('moduleconfig', msg.moduleConfig); return; }
    if (msg.config_complete_id !== undefined) {
      clearTimeout(this.configTimer);
      if (!this.oneWay && msg.config_complete_id !== this.configNonce) {
        this.emit('debug', 'config_complete_id ' + msg.config_complete_id + ' does not match the nonce we sent (' + this.configNonce + ')');
      }
      this.setState('ready');
      this._startHeartbeat();
      return;
    }
    if (msg.queueStatus) { this.emit('queue', msg.queueStatus); return; }
    if (msg.log_record) { this._onStray(utf8Encode(msg.log_record.message || '')); return; }
    if (msg.clientNotification) { this.emit('notice', msg.clientNotification); return; }
    if (msg.rebooted) { this.emit('notice', { message: 'The radio reported a reboot. Re-reading config.' }); this._startConfig(); return; }
    if (msg.packet) { this._onPacket(msg.packet); return; }
  }

  /* Flatten a Telemetry message into one dated sample of named readings.
     Only fields the radio actually sent are recorded, so a gap in a chart is a
     gap in the evidence rather than a zero. */
  recordTelemetry(nodeNum, whenMs, telemetryMsg, origin) {
    const groups = ['device_metrics', 'environment_metrics', 'air_quality_metrics', 'power_metrics'];
    const readings = {};
    let found = false;
    groups.forEach(g => {
      const m = telemetryMsg[g];
      if (!m || typeof m !== 'object') return;
      for (const k in m) {
        if (k.charAt(0) === '$') continue;
        const v = m[k];
        if (typeof v !== 'number') continue;
        readings[k] = v;
        found = true;
      }
    });
    if (!found) return null;
    const series = this.telemetry.get(nodeNum) || [];
    const sample = { t: whenMs, readings: readings, origin: origin || 'packet' };
    /* Samples can arrive out of order after a store and forward burst, so the
       series is kept sorted by the reading's own time rather than by arrival. */
    if (series.length && whenMs < series[series.length - 1].t) {
      let i = series.length;
      while (i > 0 && series[i - 1].t > whenMs) i--;
      series.splice(i, 0, sample);
    } else {
      series.push(sample);
    }
    if (series.length > this.telemetryCap) series.splice(0, series.length - this.telemetryCap);
    this.telemetry.set(nodeNum, series);
    this.emit('telemetrysample', { node: nodeNum, sample: sample });
    return sample;
  }

  _mergeNode(n) {
    const prev = this.nodes.get(n.num);
    if (prev) {
      // Keep what we already knew when a partial update arrives.
      const merged = Object.assign({}, prev, n);
      if (!n.user && prev.user) merged.user = prev.user;
      if (!n.position && prev.position) merged.position = prev.position;
      this.nodes.set(n.num, merged);
    } else {
      this.nodes.set(n.num, n);
    }
    /* A NodeInfo often carries device metrics. That is a reading the radio
       reported, so it belongs in the record alongside the telemetry packets. */
    if (n.device_metrics) {
      const when = (n.last_heard || Math.floor(Date.now() / 1000)) * 1000;
      const series = this.telemetry.get(n.num);
      const last = series && series.length ? series[series.length - 1] : null;
      if (!last || Math.abs(last.t - when) > 1000) {
        this.recordTelemetry(n.num, when, { device_metrics: n.device_metrics }, 'node_info');
      }
    }
    this.emit('node', this.nodes.get(n.num));
  }

  _mergeChannel(c) {
    this.channels[c.index || 0] = c;
    this.emit('channel', c);
  }

  _onPacket(p) {
    const entry = {
      t: Date.now(), dir: 'rx', packet: p, id: p.id,
      portnum: p.decoded ? p.decoded.portnum : null,
      port: p.decoded ? enumName('PortNum', p.decoded.portnum) : 'ENCRYPTED',
      decodedPayload: null, note: ''
    };
    if (p.decoded) {
      try { entry.decodedPayload = decodePortPayload(p.decoded.portnum, p.decoded.payload); }
      catch (e) { entry.note = 'payload did not decode: ' + e.message; }
    }
    this._record(entry);

    if (p.decoded) {
      const pn = p.decoded.portnum;
      if (pn === ENUMS.PortNum.byName.TEXT_MESSAGE_APP) {
        const text = utf8Decode(p.decoded.payload || new Uint8Array(0));
        const m = { t: Date.now(), from: p.from, to: p.to, channel: p.channel || 0, text: text, id: p.id, snr: p.rx_snr, rssi: p.rx_rssi, hops: hopsUsed(p), dir: 'in' };
        this.messages.push(m);
        this.emit('message', m);
      } else if (pn === ENUMS.PortNum.byName.ROUTING_APP) {
        this._resolveAck(p, entry);
      } else if (pn === ENUMS.PortNum.byName.ADMIN_APP) {
        this._onAdminReply(p, entry);
      } else if (pn === ENUMS.PortNum.byName.NODEINFO_APP && entry.decodedPayload) {
        this._mergeNode({ $type: 'NodeInfo', num: p.from, user: entry.decodedPayload, last_heard: Math.floor(Date.now() / 1000), snr: p.rx_snr });
      } else if (pn === ENUMS.PortNum.byName.POSITION_APP && entry.decodedPayload) {
        const prev = this.nodes.get(p.from);
        if (prev) { prev.position = entry.decodedPayload; prev.last_heard = Math.floor(Date.now() / 1000); this.emit('node', prev); }
      } else if (pn === ENUMS.PortNum.byName.TRACEROUTE_APP && entry.decodedPayload) {
        this._onTraceroute(p, entry);
      } else if (pn === ENUMS.PortNum.byName.NEIGHBORINFO_APP && entry.decodedPayload) {
        const ni = entry.decodedPayload;
        const owner = ni.node_id || p.from;
        this.neighbors.set(owner, {
          t: Date.now(), owner: owner, report: ni,
          intervalSecs: ni.node_broadcast_interval_secs,
          list: (ni.neighbors || []).map(n => ({ node: n.node_id, snr: n.snr, lastRx: n.last_rx_time }))
        });
        this.emit('neighbors', this.neighbors.get(owner));
      } else if (pn === ENUMS.PortNum.byName.TELEMETRY_APP && entry.decodedPayload) {
        const tm = entry.decodedPayload;
        /* Prefer the radio's own timestamp over our arrival time. A store and
           forward delivery can arrive long after the reading was taken, and
           charting it at the wrong moment would be an invented history. */
        const when = (tm.time || p.rx_time || Math.floor(Date.now() / 1000)) * 1000;
        this.recordTelemetry(p.from, when, tm, 'packet');
        this.emit('telemetry', { from: p.from, telemetry: tm });
        const prev = this.nodes.get(p.from);
        if (prev && tm.device_metrics) { prev.device_metrics = tm.device_metrics; prev.last_heard = Math.floor(Date.now() / 1000); this.emit('node', prev); }
      }
    }
    // Any packet is evidence the node was heard.
    const known = this.nodes.get(p.from);
    if (known && p.rx_time) { known.last_heard = p.rx_time; if (p.rx_snr !== undefined) known.snr = p.rx_snr; this.emit('node', known); }
  }

  _onTraceroute(p, entry) {
    const rd = entry.decodedPayload;
    const reqId = p.decoded.request_id;
    const pending = reqId ? this.pendingRoutes.get(reqId) : null;
    const target = pending ? pending.target : p.from;
    if (pending) { clearTimeout(pending.timer); this.pendingRoutes.delete(reqId); }
    const legs = tracerouteLegs(rd, this.myNodeNum, target);
    const result = {
      t: Date.now(), target: target, requestId: reqId || null,
      elapsedMs: pending ? Date.now() - pending.sentAt : null,
      discovery: rd, forward: legs.forward, back: legs.back,
      forwardNodes: legs.forwardNodes, backNodes: legs.backNodes,
      complete: !!pending
    };
    this.routes.push(result);
    if (this.routes.length > 80) this.routes.shift();
    this.emit('route', result);
  }

  _record(entry) {
    this.packets.push(entry);
    if (this.packets.length > this.packetCap) this.packets.splice(0, this.packets.length - this.packetCap);
    this.emit('packet', entry);
  }

  _resolveAck(p, entry) {
    const reqId = p.decoded.request_id;
    if (!reqId) return;
    const waiting = this.pending.get(reqId);
    const routing = entry.decodedPayload;
    const err = routing && routing.error_reason !== undefined ? routing.error_reason : 0;
    const errName = enumName('RoutingError', err || 0);
    if (waiting) {
      /* An ack whose sender is the node we addressed is a real end to end ack.
         Anything else is a neighbour telling us it rebroadcast the packet,
         which is weaker evidence and is labelled as such. */
      const target = waiting.entry.packet ? waiting.entry.packet.to : null;
      const implicit = (target === null || target === BROADCAST_NUM) ? true : (p.from !== target);
      clearTimeout(waiting.timer);
      this.pending.delete(reqId);
      waiting.entry.ack = {
        ok: !err, error: err, errorName: errName, at: Date.now(),
        from: p.from, implicit: implicit, hops: hopsUsed(p), snr: p.rx_snr
      };
      this.emit('ack', waiting.entry);
    }
    this.emit('routing', { requestId: reqId, error: err, errorName: errName, from: p.from });
  }

  /* ---- outbound messages ---- */
  nextPacketId() { this.txSeq = (this.txSeq + 1) >>> 0 || 1; return this.txSeq; }

  async sendText(text, opts) {
    opts = opts || {};
    const to = opts.to === undefined ? BROADCAST_NUM : opts.to;
    const wantAck = opts.wantAck === undefined ? (to !== BROADCAST_NUM) : opts.wantAck;
    const id = this.nextPacketId();
    const packet = {
      $type: 'MeshPacket', from: this.myNodeNum || 0, to: to, id: id,
      channel: opts.channel || 0, hop_limit: opts.hopLimit === undefined ? 3 : opts.hopLimit,
      want_ack: wantAck, $payload_variant: 'decoded',
      decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.TEXT_MESSAGE_APP, payload: utf8Encode(text) }
    };
    const entry = {
      t: Date.now(), dir: 'tx', packet: packet, id: id, portnum: 1, port: 'TEXT_MESSAGE_APP',
      decodedPayload: text, ack: null, note: ''
    };
    this._record(entry);
    const m = { t: Date.now(), from: this.myNodeNum, to: to, channel: opts.channel || 0, text: text, id: id, dir: 'out', entry: entry };
    this.messages.push(m);
    await this.send({ $type: 'ToRadio', packet: packet, $payload_variant: 'packet' });
    this.emit('message', m);
    if (wantAck) {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        entry.ack = { ok: false, error: -1, errorName: 'no answer inside ' + (ACK_TIMEOUT_MS / 1000) + ' s', at: Date.now() };
        this.emit('ack', entry);
      }, ACK_TIMEOUT_MS);
      this.pending.set(id, { entry: entry, timer: timer });
    }
    return entry;
  }

  async sendTraceroute(to, opts) {
    opts = opts || {};
    const id = this.nextPacketId();
    const packet = {
      $type: 'MeshPacket', from: this.myNodeNum || 0, to: to, id: id, want_ack: true,
      hop_limit: opts.hopLimit === undefined ? 3 : opts.hopLimit,
      $payload_variant: 'decoded',
      decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.TRACEROUTE_APP, payload: encode('RouteDiscovery', { $type: 'RouteDiscovery' }), want_response: true }
    };
    this._record({ t: Date.now(), dir: 'tx', packet: packet, id: id, portnum: 70, port: 'TRACEROUTE_APP', decodedPayload: null });
    await this.send({ $type: 'ToRadio', packet: packet, $payload_variant: 'packet' });
    const timer = setTimeout(() => {
      this.pendingRoutes.delete(id);
      this.emit('route', { t: Date.now(), target: to, requestId: id, timedOut: true, forward: [], back: [], forwardNodes: [], backNodes: [] });
    }, 60000);
    this.pendingRoutes.set(id, { target: to, sentAt: Date.now(), timer: timer });
    return id;
  }

  /* ---- admin path ----
     Firmware 2.x wants a session passkey on any admin write. We get one from a
     read, hold it, and surface its age, because a silently expired passkey
     looks exactly like a dead radio. */
  get passkeyAgeMs() { return this.sessionPasskey ? Date.now() - this.passkeyAt : Infinity; }
  get passkeyState() {
    if (!this.sessionPasskey) return 'none';
    return this.passkeyAgeMs > 280000 ? 'stale' : 'held';
  }

  _onAdminReply(p, entry) {
    const admin = entry.decodedPayload;
    if (!admin) return;
    if (admin.session_passkey && admin.session_passkey.length) {
      this.sessionPasskey = admin.session_passkey;
      this.passkeyAt = Date.now();
      this.emit('passkey', { state: this.passkeyState });
    }
    if (admin.get_config_response) { this.config.set(admin.get_config_response.$payload_variant, admin.get_config_response); this.emit('config', admin.get_config_response); }
    if (admin.get_module_config_response) { this.moduleConfig.set(admin.get_module_config_response.$payload_variant, admin.get_module_config_response); this.emit('moduleconfig', admin.get_module_config_response); }
    if (admin.get_channel_response) this._mergeChannel(admin.get_channel_response);
    if (admin.get_device_metadata_response) { this.metadata = admin.get_device_metadata_response; this.emit('metadata', this.metadata); }
    this.emit('admin', admin);
  }

  async sendAdmin(adminObj, opts) {
    opts = opts || {};
    adminObj.$type = 'AdminMessage';
    if (opts.withPasskey) {
      if (!this.sessionPasskey) throw new Error('no session passkey held. Read something from the radio first.');
      adminObj.session_passkey = this.sessionPasskey;
    }
    const id = this.nextPacketId();
    const packet = {
      $type: 'MeshPacket', from: this.myNodeNum || 0, to: opts.to === undefined ? this.myNodeNum : opts.to,
      id: id, channel: 0, want_ack: true, priority: ENUMS.Priority.byName.RELIABLE, $payload_variant: 'decoded',
      decoded: {
        $type: 'Data', portnum: ENUMS.PortNum.byName.ADMIN_APP,
        payload: encode('AdminMessage', adminObj), want_response: !!opts.wantResponse
      }
    };
    this._record({ t: Date.now(), dir: 'tx', packet: packet, id: id, portnum: 6, port: 'ADMIN_APP', decodedPayload: adminObj });
    await this.send({ $type: 'ToRadio', packet: packet, $payload_variant: 'packet' });
    return id;
  }

  /* Ask for something small; the reply carries a fresh session passkey. */
  async refreshPasskey() {
    await this.sendAdmin({ get_device_metadata_request: true, $payload_variant: 'get_device_metadata_request' }, { wantResponse: true });
    const deadline = Date.now() + 6000;
    while (Date.now() < deadline) {
      if (this.passkeyState === 'held' && this.passkeyAgeMs < 6000) return true;
      await sleep(120);
    }
    return false;
  }

  async writeConfig(configMsg) {
    if (configMsg.$partial || unknownReport(configMsg).length) {
      throw new Error('this config holds fields WATCHFIRE does not understand, so it is write blocked');
    }
    if (this.passkeyState !== 'held') await this.refreshPasskey();
    await this.sendAdmin({ begin_edit_settings: true, $payload_variant: 'begin_edit_settings' }, { withPasskey: true });
    await sleep(120);
    await this.sendAdmin({ set_config: configMsg, $payload_variant: 'set_config' }, { withPasskey: true });
    await sleep(120);
    await this.sendAdmin({ commit_edit_settings: true, $payload_variant: 'commit_edit_settings' }, { withPasskey: true });
  }

  async writeChannel(channelMsg) {
    if (channelMsg.$partial || unknownReport(channelMsg).length) {
      throw new Error('this channel holds fields WATCHFIRE does not understand, so it is write blocked');
    }
    if (this.passkeyState !== 'held') await this.refreshPasskey();
    await this.sendAdmin({ begin_edit_settings: true, $payload_variant: 'begin_edit_settings' }, { withPasskey: true });
    await sleep(120);
    await this.sendAdmin({ set_channel: channelMsg, $payload_variant: 'set_channel' }, { withPasskey: true });
    await sleep(120);
    await this.sendAdmin({ commit_edit_settings: true, $payload_variant: 'commit_edit_settings' }, { withPasskey: true });
  }

  _startHeartbeat() {
    clearInterval(this.heartbeatTimer);
    if (this.oneWay) return;
    const beat = async () => {
      if (this.state !== 'ready') return;
      try { await this.send({ $type: 'ToRadio', heartbeat: { $type: 'Heartbeat' }, $payload_variant: 'heartbeat' }); }
      catch (e) { this.emit('debug', 'heartbeat failed: ' + e.message); }
    };
    /* An idle BLE client gets dropped by the radio, so the bluetooth link is
       kept warm far more often than the serial one needs. */
    this.heartbeatTimer = setInterval(beat, this.framed ? HEARTBEAT_MS : BLE_HEARTBEAT_MS);
    beat();
  }
}

/* Decode the payload sitting inside a Data message, by port. Anything we have
   no decoder for stays as bytes and is shown as hex, never guessed at. */
function decodePortPayload(portnum, payload) {
  if (!payload || !payload.length) return null;
  const P = ENUMS.PortNum.byName;
  switch (portnum) {
    case P.TEXT_MESSAGE_APP: case P.ALERT_APP: case P.RANGE_TEST_APP: return utf8Decode(payload);
    case P.POSITION_APP: return decode('Position', payload);
    case P.NODEINFO_APP: return decode('User', payload);
    case P.ROUTING_APP: return decode('Routing', payload);
    case P.ADMIN_APP: return decode('AdminMessage', payload);
    case P.TELEMETRY_APP: return decode('Telemetry', payload);
    case P.TRACEROUTE_APP: return decode('RouteDiscovery', payload);
    case P.NEIGHBORINFO_APP: return decode('NeighborInfo', payload);
    case P.WAYPOINT_APP: return decode('Waypoint', payload);
    default: return null;
  }
}

function hopsUsed(p) {
  if (p.hop_start === undefined || p.hop_limit === undefined) return null;
  if (!p.hop_start) return null;
  return p.hop_start - p.hop_limit;
}

/* --------------------------------------------------------------------------
   Channel payload decryption.
   AES-CTR under the channel PSK. Nonce is the packet id as a little endian
   64 bit value, then the sending node number as 32 bits, then zero padding.
   Only useful for traffic on channels whose key you already hold: over serial
   the radio has already decrypted anything it has keys for.
   -------------------------------------------------------------------------- */
function expandPsk(psk) {
  if (!psk || psk.length === 0) return null;
  if (psk.length === 1) {
    if (psk[0] === 0) return null;                 // no encryption
    const key = DEFAULT_PSK.slice();
    key[key.length - 1] = (key[key.length - 1] + psk[0] - 1) & 0xff;
    return key;
  }
  return psk;
}

function ctrNonce(packetId, fromNode) {
  const n = new Uint8Array(16);
  const dv = new DataView(n.buffer);
  dv.setUint32(0, packetId >>> 0, true);
  dv.setUint32(8, fromNode >>> 0, true);
  return n;
}

async function decryptPayload(psk, packetId, fromNode, cipherBytes) {
  const key = expandPsk(psk);
  if (!key) throw new Error('channel has no usable key');
  if (typeof crypto === 'undefined' || !crypto.subtle) throw new Error('WebCrypto is not available here');
  const ck = await crypto.subtle.importKey('raw', key, { name: 'AES-CTR' }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: ctrNonce(packetId, fromNode), length: 128 }, ck, cipherBytes);
  return new Uint8Array(plain);
}

function el(tag, attrs) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;                 // static chrome only
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (k === 'data') { for (const d in v) n.dataset[d] = v[d]; }
    else n.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kid = arguments[i];
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) { kid.forEach(k2 => { if (k2 !== null && k2 !== undefined && k2 !== false) n.append(k2 && k2.nodeType ? k2 : document.createTextNode(String(k2))); }); }
    else n.append(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function toast(message, kind) {
  const box = $('#toasts');

  box.append(t);
  if (!APP.muted && kind === 'bad') beep(220, 0.12);

  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 5200);

let audioCtx = null;
function beep(freq, dur) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) { /* audio is a courtesy, never load bearing */ }
}
