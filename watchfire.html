    ', capped at six. Real meshes are kinder than this: firmware suppresses a rebroadcast when it has already heard the packet relayed, roles like CLIENT_MUTE do not rebroadcast at all, and nodes out of range of each other do not double up. Use it to compare hop limits against each other, not to predict a number.'));
  p5.inner.append(el('div', { class: 'note' },
    'The trade in one line: each extra hop multiplies the channel time one packet costs, and buys reach only if there is actually a node out there to relay it. A hop limit higher than the diameter of your mesh spends airtime on nothing.'));
  wrap.append(p5);

  /* ---- provenance ---- */
  const p6 = panel('Where these numbers come from');
  const ul = el('ul');
  [
    'Time on air: RadioLib src/modules/SX126x/SX126x.cpp calculateTimeOnAir, which is the function meshtastic firmware calls through SX126xInterface. The integer truncation is kept so the answer matches the radio rather than the textbook.',
    'Packet configuration: meshtastic/firmware src/mesh/RadioLibInterface.h getPacketConfig. Explicit header, CRC on, preamble 16 symbols, low data rate optimize on when symbol time reaches 16 ms.',
    'Header length: meshtastic/firmware src/mesh/RadioInterface.h, MESHTASTIC_HEADER_LENGTH 16.',
    'Preset parameters: meshtastic/firmware src/mesh/MeshRadio.h, modemPresetToParams.',
    'Region limits: meshtastic/firmware src/mesh/RadioInterface.cpp, the RDEF region table.',
    'Maximum payload: meshtastic/protobufs mesh.proto, Constants.DATA_PAYLOAD_LEN 233.'
  ].forEach(line => ul.append(el('li', { style: 'font-family:var(--sans);font-size:12.5px;margin-bottom:6px' }, line)));
  p6.inner.append(ul);
  p6.inner.append(el('p', { class: 'note' },
    'All read on 2026-08-11. The duty cycle figures are what firmware enforces, not legal advice, and the regional power limits are the firmware table rather than your national regulator. If you are operating close to a limit, read the regulation, not this panel.'));
  wrap.append(p6);
  return wrap;
}

function fmtMs(us) {
  const ms = us / 1000;
  if (ms < 10) return ms.toFixed(2) + ' ms';
  if (ms < 1000) return ms.toFixed(1) + ' ms';
  return (ms / 1000).toFixed(2) + ' s';
}

function latestAirUtil(session) {
  for (let i = session.packets.length - 1; i >= 0; i--) {
    const e = session.packets[i];
    if (e.portnum === ENUMS.PortNum.byName.TELEMETRY_APP && e.decodedPayload && e.decodedPayload.device_metrics) {
      const m = e.decodedPayload.device_metrics;
      if (m.air_util_tx !== undefined) return m.air_util_tx;
    }
  }
  const me = session.nodes.get(session.myNodeNum);
  if (me && me.device_metrics && me.device_metrics.air_util_tx !== undefined) return me.device_metrics.air_util_tx;
  return null;
}

/* ==========================================================================
   WATCHFIRE :: station 08, TELEMETRY
   Readings the radio reported, kept for the length of the session and drawn
   by hand. No charting library is fetched, because nothing here is fetched.
   A gap in a line is a gap in the evidence. Nothing is interpolated across a
   silence and no reading is invented to make a chart look continuous.
   ========================================================================== */

/* Units and sensible precision per reading. A reading absent from this table
   is still charted, with no unit claimed for it. */
const METRIC_INFO = {
  battery_level: { unit: '%', dp: 0, label: 'battery', max: 100 },
  voltage: { unit: 'V', dp: 2, label: 'voltage' },
  channel_utilization: { unit: '%', dp: 2, label: 'channel utilisation' },
  air_util_tx: { unit: '%', dp: 2, label: 'air utilisation, transmit' },
  uptime_seconds: { unit: 's', dp: 0, label: 'uptime' },
  temperature: { unit: '\u00b0C', dp: 2, label: 'temperature' },
  relative_humidity: { unit: '%', dp: 1, label: 'relative humidity' },
  barometric_pressure: { unit: 'hPa', dp: 1, label: 'barometric pressure' },
  gas_resistance: { unit: 'MOhm', dp: 2, label: 'gas resistance' },
  current: { unit: 'mA', dp: 2, label: 'current' },
  iaq: { unit: '', dp: 0, label: 'air quality index' },
  distance: { unit: 'mm', dp: 0, label: 'distance' },
  lux: { unit: 'lx', dp: 0, label: 'illuminance' },
  white_lux: { unit: 'lx', dp: 0, label: 'illuminance, white' },
  ir_lux: { unit: 'lx', dp: 0, label: 'illuminance, infrared' },
  uv_lux: { unit: 'lx', dp: 0, label: 'illuminance, ultraviolet' },
  wind_speed: { unit: 'm/s', dp: 1, label: 'wind speed' },
  wind_gust: { unit: 'm/s', dp: 1, label: 'wind gust' },
  wind_direction: { unit: '\u00b0', dp: 0, label: 'wind direction' },
  weight: { unit: 'kg', dp: 2, label: 'weight' },
  radiation: { unit: '\u00b5R/h', dp: 2, label: 'radiation' },
  rainfall_1h: { unit: 'mm', dp: 1, label: 'rainfall, 1 h' },
  rainfall_24h: { unit: 'mm', dp: 1, label: 'rainfall, 24 h' },
  soil_moisture: { unit: '%', dp: 0, label: 'soil moisture' },
  soil_temperature: { unit: '\u00b0C', dp: 2, label: 'soil temperature' },
  ch1_voltage: { unit: 'V', dp: 2, label: 'channel 1 voltage' },
  ch1_current: { unit: 'mA', dp: 2, label: 'channel 1 current' },
  ch2_voltage: { unit: 'V', dp: 2, label: 'channel 2 voltage' },
  ch2_current: { unit: 'mA', dp: 2, label: 'channel 2 current' },
  ch3_voltage: { unit: 'V', dp: 2, label: 'channel 3 voltage' },
  ch3_current: { unit: 'mA', dp: 2, label: 'channel 3 current' }
};

function metricInfo(key) {
  return METRIC_INFO[key] || { unit: '', dp: 2, label: key.replace(/_/g, ' ') };
}

function fmtReading(key, v) {
  const info = metricInfo(key);
  if (key === 'uptime_seconds') return fmtDuration(v);
  const n = v.toFixed(info.dp);
  return info.unit ? n + ' ' + info.unit : n;
}

function fmtDuration(secs) {
  if (secs < 60) return Math.round(secs) + ' s';
  if (secs < 3600) return Math.floor(secs / 60) + ' min';
  if (secs < 86400) return (secs / 3600).toFixed(1) + ' h';
  return (secs / 86400).toFixed(1) + ' d';
}

/* Chart geometry as a pure function, so it can be asserted without a DOM.
   Returns plot coordinates, the path, the axis ticks and the summary. A run of
   samples separated by more than gapMs is broken rather than joined, because a
   straight line across an outage is a claim nobody made. */
function chartGeometry(points, opts) {
  opts = opts || {};
  const w = opts.w || 720, h = opts.h || 190;
  const padL = opts.padL === undefined ? 62 : opts.padL;
  const padR = 12, padT = 12, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const valid = points.filter(p => typeof p.v === 'number' && isFinite(p.v));
  if (!valid.length) return null;

  let min = Infinity, max = -Infinity, sum = 0;
  valid.forEach(p => { if (p.v < min) min = p.v; if (p.v > max) max = p.v; sum += p.v; });
  const mean = sum / valid.length;
  let lo = min, hi = max;
  if (hi - lo < 1e-9) { lo = min - (Math.abs(min) * 0.05 + 1); hi = max + (Math.abs(max) * 0.05 + 1); }
  else { const pad = (hi - lo) * 0.08; lo -= pad; hi += pad; }
  if (opts.zeroFloor && lo < 0 && min >= 0) lo = 0;
  if (opts.max !== undefined && hi > opts.max) hi = opts.max;

  const t0 = valid[0].t, t1 = valid[valid.length - 1].t;
  const span = Math.max(1, t1 - t0);
  const x = (t) => padL + ((t - t0) / span) * plotW;
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * plotH;

  const gapMs = opts.gapMs || 0;
  const segments = [];
  let cur = [];
  valid.forEach((p, i) => {
    if (i > 0 && gapMs && (p.t - valid[i - 1].t) > gapMs) { segments.push(cur); cur = []; }
    cur.push({ x: x(p.t), y: y(p.v), t: p.t, v: p.v });
  });
  if (cur.length) segments.push(cur);

  const path = segments.map(seg =>
    seg.map((pt, i) => (i === 0 ? 'M' : 'L') + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1)).join(' ')
  ).join(' ');

  const yTicks = [];
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * (i / 3);
    yTicks.push({ y: y(v), v: v });
  }
  const xTicks = [];
  const nx = Math.min(4, Math.max(2, valid.length));
  for (let i = 0; i < nx; i++) {
    const t = t0 + span * (i / (nx - 1));
    xTicks.push({ x: x(t), t: t });
  }

  return {
    w: w, h: h, padL: padL, padT: padT, plotW: plotW, plotH: plotH,
    path: path, segments: segments, lo: lo, hi: hi,
    min: min, max: max, mean: mean, first: valid[0], last: valid[valid.length - 1],
    count: valid.length, yTicks: yTicks, xTicks: xTicks, breaks: segments.length - 1
  };
}

function chartSvg(geo, key, color) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + geo.w + ' ' + geo.h);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', metricInfo(key).label + ', ' + geo.count + ' readings, from ' +
    fmtReading(key, geo.min) + ' to ' + fmtReading(key, geo.max));
  svg.style.width = '100%';
  svg.style.height = 'auto';

  const line = (x1, y1, x2, y2, stroke, dash) => {
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', stroke); l.setAttribute('stroke-width', '1');
    if (dash) l.setAttribute('stroke-dasharray', dash);
    svg.appendChild(l);
  };
  const text = (x, y, str, anchor, fill) => {
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', anchor || 'start');
    t.setAttribute('fill', fill || 'var(--faint)');
    t.setAttribute('font-size', '10');
    t.setAttribute('font-family', 'var(--mono)');
    t.textContent = str;
    svg.appendChild(t);
  };

  geo.yTicks.forEach(tk => {
    line(geo.padL, tk.y, geo.padL + geo.plotW, tk.y, 'var(--line-soft)');
    text(geo.padL - 8, tk.y + 3, fmtShort(key, tk.v), 'end');
  });
  geo.xTicks.forEach(tk => {
    line(tk.x, geo.padT, tk.x, geo.padT + geo.plotH, 'var(--line-soft)', '2 4');
    text(tk.x, geo.h - 8, clockTime(tk.t), tk.x === geo.padL ? 'start' : 'middle');
  });

  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', geo.path);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', color || 'var(--signal)');
  p.setAttribute('stroke-width', '1.6');
  p.setAttribute('stroke-linejoin', 'round');
  p.setAttribute('stroke-linecap', 'round');
  svg.appendChild(p);

  geo.segments.forEach(seg => {
    if (seg.length !== 1) return;
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', seg[0].x); c.setAttribute('cy', seg[0].y); c.setAttribute('r', '2.2');
    c.setAttribute('fill', color || 'var(--signal)');
    svg.appendChild(c);
  });

  const lastPt = geo.segments[geo.segments.length - 1];
  const dot = document.createElementNS(ns, 'circle');
  dot.setAttribute('cx', lastPt[lastPt.length - 1].x);
  dot.setAttribute('cy', lastPt[lastPt.length - 1].y);
  dot.setAttribute('r', '3');
  dot.setAttribute('fill', 'var(--ember)');
  svg.appendChild(dot);
  return svg;
}

function fmtShort(key, v) {
  const info = metricInfo(key);
  if (key === 'uptime_seconds') return fmtDuration(v);
  const abs = Math.abs(v);
  const dp = abs >= 100 ? 0 : (abs >= 10 ? 1 : info.dp);
  return v.toFixed(dp);
}

const TELEMETRY_WINDOWS = [
  { label: '15 min', ms: 15 * 60000 },
  { label: '1 hour', ms: 3600000 },
  { label: '6 hours', ms: 6 * 3600000 },
  { label: 'everything', ms: 0 }
];
let telemetryNode = null;
let telemetryWindow = 3600000;
let telemetryPicked = null;

function stationTelemetry() {
  const s = APP.session;
  const wrap = stationHead('08 :: Telemetry',
    'Readings the radio reported, kept for the length of this session and drawn here. Charts break where the readings stop rather than drawing a line through a silence.');

  if (!s || !s.telemetry.size) {
    const p = panel('Nothing recorded yet');
    p.inner.append(emptyState('No readings',
      s ? 'The link is up but no telemetry has arrived. Nodes report on their own schedule, often every half hour, so this fills slowly. Station 12 can deliver a backlog if you want something to look at now.'
        : 'Connect a radio or start the simulator from station 01.'));
    wrap.append(p);
    return wrap;
  }

  /* Order by how much record each node has, so the default selection lands on
     a node with something to look at rather than whichever one happened to
     report first. A node with one reading is not a chart. */
  const nodesWith = Array.from(s.telemetry.keys())
    .sort((a, b) => s.telemetry.get(b).length - s.telemetry.get(a).length);
  if (telemetryNode === null || !s.telemetry.has(telemetryNode)) telemetryNode = nodesWith[0];

  /* ---- latest across the mesh ---- */
  const p0 = panel('Latest reading from each node', nodesWith.length + ' reporting');
  const t0 = el('table');
  t0.append(el('thead', null, el('tr', null, ['Node', 'When', 'Readings', 'Samples'].map(h => el('th', null, h)))));
  const b0 = el('tbody');
  nodesWith.forEach(num => {
    const series = s.telemetry.get(num);
    const last = series[series.length - 1];
    const chips = el('div', { class: 'row', style: 'gap:6px' });
    Object.keys(last.readings).forEach(k => {
      chips.append(el('span', { class: 'tagline' }, metricInfo(k).label + ' ' + fmtReading(k, last.readings[k])));
    });
    b0.append(el('tr', {
      style: 'cursor:pointer', onclick: () => { telemetryNode = num; telemetryPicked = null; paint(); }
    },
      el('td', { class: 'mono' }, nodeLabel(s, num) + (num === telemetryNode ? '  (shown)' : '')),
      el('td', { class: 'num', title: absTime(Math.floor(last.t / 1000)) }, relTime(Math.floor(last.t / 1000))),
      el('td', null, chips),
      el('td', { class: 'num' }, String(series.length))));
  });
  t0.append(b0);
  p0.inner.append(el('div', { class: 'scroll' }, t0));
  wrap.append(p0);

  /* ---- controls ---- */
  const series = s.telemetry.get(telemetryNode) || [];
  const cutoff = telemetryWindow ? Date.now() - telemetryWindow : 0;
  const windowed = series.filter(x => x.t >= cutoff);
  const available = [];
  windowed.forEach(x => Object.keys(x.readings).forEach(k => { if (available.indexOf(k) < 0) available.push(k); }));
  if (!telemetryPicked) telemetryPicked = available.slice(0, 4);

  const p1 = panel('Charting', nodeLabel(s, telemetryNode) + ', ' + windowed.length + ' samples in window');
  p1.inner.append(el('div', { class: 'row' },
    el('label', { class: 'field', style: 'width:240px;margin:0' }, el('span', null, 'Node'),
      el('select', { onchange: e => { telemetryNode = parseInt(e.target.value, 10); telemetryPicked = null; paint(); } },
        nodesWith.map(n => el('option', { value: String(n), selected: n === telemetryNode }, nodeLabel(s, n) + '  ' + nodeIdHex(n))))),
    el('label', { class: 'field', style: 'width:200px;margin:0' }, el('span', null, 'Window'),
      el('select', { onchange: e => { telemetryWindow = parseInt(e.target.value, 10); paint(); } },
        TELEMETRY_WINDOWS.map(wnd => el('option', { value: String(wnd.ms), selected: wnd.ms === telemetryWindow }, wnd.label))))
  ));
  const picker = el('div', { class: 'row', style: 'margin-top:10px' });
  available.forEach(k => {
    picker.append(el('label', { class: 'check', style: 'margin-right:12px' },
      el('input', {
        type: 'checkbox', checked: telemetryPicked.indexOf(k) >= 0,
        onchange: e => {
          if (e.target.checked) telemetryPicked.push(k);
          else telemetryPicked = telemetryPicked.filter(x => x !== k);
          paint();
        }
      }), metricInfo(k).label));
  });
  p1.inner.append(picker);
  wrap.append(p1);

  if (!windowed.length) {
    const p = panel('Nothing in this window');
    p.inner.append(emptyState('No samples', 'That node has readings, but none inside the chosen window. Widen it above.'));
    wrap.append(p);
    return wrap;
  }

  /* ---- one chart per chosen reading ---- */
  telemetryPicked.forEach(key => {
    const pts = windowed.filter(x => x.readings[key] !== undefined).map(x => ({ t: x.t, v: x.readings[key] }));
    if (!pts.length) return;
    const info = metricInfo(key);
    /* Break the line where a run of samples is more than four times the usual
       spacing apart, so an outage reads as an outage. */
    const gap = typicalGap(pts) * 4;
    const geo = chartGeometry(pts, { gapMs: gap, zeroFloor: key === 'battery_level' || key === 'lux', max: info.max });
    if (!geo) return;
    const p = panel(info.label, info.unit ? 'in ' + info.unit : '');
    p.inner.append(el('div', { class: 'tally', style: 'padding-top:0' },
      el('div', { class: 'ok' }, el('b', null, fmtReading(key, geo.last.v)), el('span', null, 'latest')),
      el('div', null, el('b', null, fmtShort(key, geo.min)), el('span', null, 'lowest')),
      el('div', null, el('b', null, fmtShort(key, geo.max)), el('span', null, 'highest')),
      el('div', null, el('b', null, fmtShort(key, geo.mean)), el('span', null, 'mean')),
      el('div', null, el('b', null, String(geo.count)), el('span', null, 'readings'))));
    p.inner.append(chartSvg(geo, key));
    const spanMin = (geo.last.t - geo.first.t) / 60000;
    p.inner.append(el('p', { class: 'note' },
      'From ' + absTime(Math.floor(geo.first.t / 1000)) + ' to ' + absTime(Math.floor(geo.last.t / 1000)) +
      ', ' + (spanMin < 60 ? spanMin.toFixed(0) + ' minutes' : (spanMin / 60).toFixed(1) + ' hours') + ' of record' +
      (geo.breaks ? ', with ' + geo.breaks + ' break' + (geo.breaks > 1 ? 's' : '') + ' where the readings stopped.' : '. No gaps.')));
    wrap.append(p);
  });

  /* ---- export ---- */
  const p9 = panel('Export');
  p9.inner.append(el('p', { class: 'note' },
    'Readings are held for this session only, capped at ' + s.telemetryCap + ' samples per node, then the oldest roll off. Export before you need the older end of it. Each row carries the reading\u2019s own timestamp as the radio reported it, not the moment WATCHFIRE happened to hear it.'));
  p9.inner.append(el('div', { class: 'row' },
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-telemetry-' + stamp() + '.csv', telemetryCsv(s)) }, 'Export all nodes as CSV'),
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-telemetry-' + stamp() + '.json', JSON.stringify(telemetryDoc(s), null, 2)) }, 'Export all nodes as JSON'),
    el('button', { class: 'btn danger', onclick: () => { s.telemetry.clear(); telemetryPicked = null; paint(); } }, 'Clear the record')));
  wrap.append(p9);
  return wrap;
}

function typicalGap(pts) {
  if (pts.length < 3) return 0;
  const gaps = [];
  for (let i = 1; i < pts.length; i++) gaps.push(pts[i].t - pts[i - 1].t);
  gaps.sort((a, b) => a - b);
  return gaps[Math.floor(gaps.length / 2)] || 0;
}

function telemetryCsv(s) {
  const keys = [];
  s.telemetry.forEach(series => series.forEach(x => Object.keys(x.readings).forEach(k => { if (keys.indexOf(k) < 0) keys.push(k); })));
  keys.sort();
  const lines = [['node_id', 'node_name', 'reading_time_utc', 'origin'].concat(keys).join(',')];
  s.telemetry.forEach((series, num) => {
    series.forEach(x => {
      const row = [nodeIdHex(num), csv(nodeLabel(s, num)), absTime(Math.floor(x.t / 1000)), x.origin];
      keys.forEach(k => row.push(x.readings[k] === undefined ? '' : x.readings[k]));
      lines.push(row.join(','));
    });
  });
  return lines.join('\n');
}

function telemetryDoc(s) {
  const doc = {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'telemetry-record',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    note: 'Timestamps are the reading times the radio reported, not arrival times. Session only, oldest samples roll off at ' + s.telemetryCap + ' per node.',
    nodes: []
  };
  s.telemetry.forEach((series, num) => {
    doc.nodes.push({
      node_id: nodeIdHex(num), name: nodeLabel(s, num),
      samples: series.map(x => ({ time_utc: absTime(Math.floor(x.t / 1000)), origin: x.origin, readings: x.readings }))
    });
  });
  return doc;
}

/* ==========================================================================
   WATCHFIRE :: station 09, PATHFINDER
   Observed topology. Every edge on the graph carries the evidence that put it
   there and when that evidence was collected. Nothing here is authoritative:
   a mesh has no routing table to read, so this is a picture of what this radio
   has been told, which is not the same as a picture of the mesh.
   ========================================================================== */

/* meshtastic/firmware src/modules/TraceRouteModule.cpp, read 2026-08-11.
   SNR values in RouteDiscovery are stored as dB multiplied by 4, and INT8_MIN
   is the sentinel for "this hop did not report an SNR". Firmware skips those
   when it prints a route, so they are held as unknown here rather than being
   read as a very bad link. */
const TRACEROUTE_SNR_SCALE = 4;
const TRACEROUTE_SNR_UNKNOWN = -128;

function tracerouteSnr(arr, i) {
  if (!arr || i >= arr.length || i < 0) return null;
  const v = arr[i];
  if (v === TRACEROUTE_SNR_UNKNOWN) return null;
  return v / TRACEROUTE_SNR_SCALE;
}

/* Reconstruct both legs of a traceroute exactly the way firmware prints them.
   Forward path is [us, ...route, target] and snr_towards[i] belongs to the
   link arriving at the i-th step. Return path is [target, route_back reversed,
   us], and firmware walks route_back backwards while indexing snr_back
   forwards, so the mapping is not a simple reversal. */
function tracerouteLegs(rd, myNum, target) {
  rd = rd || {};
  const route = rd.route || [], st = rd.snr_towards || [];
  const rb = rd.route_back || [], sb = rd.snr_back || [];
  const forwardNodes = [myNum].concat(route, [target]);
  const forward = [];
  for (let i = 0; i < forwardNodes.length - 1; i++) {
    forward.push({ from: forwardNodes[i], to: forwardNodes[i + 1], snr: tracerouteSnr(st, i) });
  }
  const n = rb.length;
  const backNodes = [target].concat(rb.slice().reverse(), [myNum]);
  const back = [];
  for (let j = 0; j < backNodes.length - 1; j++) {
    const idx = (j < n) ? (n - 1 - j) : n;
    back.push({ from: backNodes[j], to: backNodes[j + 1], snr: tracerouteSnr(sb, idx) });
  }
  return { forward: forward, back: back, forwardNodes: forwardNodes, backNodes: backNodes };
}

/* Build the observed link graph from three kinds of evidence, each of which
   means something different and is kept labelled rather than merged into one
   confident line. A pure function so the graph can be asserted without a DOM. */
function buildLinkGraph(session) {
  const edges = new Map();
  const me = session.myNodeNum;
  const nodeSet = new Set();
  if (me !== null && me !== undefined) nodeSet.add(me);

  const addEdge = (a, b, snr, kind, at, note) => {
    if (a === undefined || b === undefined || a === null || b === null) return;
    if (a === b || a === BROADCAST_NUM || b === BROADCAST_NUM) return;
    nodeSet.add(a); nodeSet.add(b);
    const key = a < b ? a + ':' + b : b + ':' + a;
    const e = edges.get(key) || { a: Math.min(a, b), b: Math.max(a, b), evidence: [], lastAt: 0, bestSnr: null };
    e.evidence.push({ kind: kind, snr: snr, at: at, from: a, to: b, note: note || '' });
    if (at > e.lastAt) e.lastAt = at;
    if (snr !== null && snr !== undefined && (e.bestSnr === null || snr > e.bestSnr)) e.bestSnr = snr;
    edges.set(key, e);
  };

  /* 1. We heard it ourselves, zero hops used. That is a direct link between
        this radio and the sender, and the SNR is ours, in one direction. */
  session.packets.forEach(entry => {
    if (entry.dir !== 'rx') return;
    const p = entry.packet;
    if (!p || p.from === undefined || p.from === me) return;
    if (p.via_mqtt) return;                       // arrived over the internet, not the air
    if (hopsUsed(p) !== 0) return;
    addEdge(me, p.from, p.rx_snr === undefined ? null : p.rx_snr, 'heard', entry.t);
  });

  /* 2. A node told us who it hears. That is a link between two other nodes,
        reported by one of them, and we are taking its word for it. */
  session.neighbors.forEach(rep => {
    rep.list.forEach(n => addEdge(rep.owner, n.node, n.snr === undefined ? null : n.snr, 'reported', rep.t));
  });

  /* 3. A traceroute walked the path. Strongest evidence of the three, because
        the packet actually made the trip. */
  session.routes.forEach(r => {
    (r.forward || []).forEach(leg => addEdge(leg.from, leg.to, leg.snr, 'traceroute', r.t, 'toward ' + nodeIdHex(r.target)));
    (r.back || []).forEach(leg => addEdge(leg.from, leg.to, leg.snr, 'traceroute', r.t, 'return'));
  });

  const edgeList = Array.from(edges.values());
  edgeList.forEach(e => {
    const kinds = {};
    e.evidence.forEach(ev => { kinds[ev.kind] = (kinds[ev.kind] || 0) + 1; });
    e.kinds = Object.keys(kinds).sort();
    e.strength = e.kinds.indexOf('traceroute') >= 0 ? 3 : (e.kinds.indexOf('heard') >= 0 ? 2 : 1);
  });

  /* Depth by breadth first search over observed links. A node with no path of
     evidence back to this radio has no depth, and says so. */
  const adj = new Map();
  edgeList.forEach(e => {
    (adj.get(e.a) || adj.set(e.a, []).get(e.a)).push(e.b);
    (adj.get(e.b) || adj.set(e.b, []).get(e.b)).push(e.a);
  });
  const depth = new Map();
  if (me !== null && me !== undefined) {
    depth.set(me, 0);
    let frontier = [me];
    while (frontier.length) {
      const next = [];
      frontier.forEach(n => {
        (adj.get(n) || []).forEach(m => {
          if (!depth.has(m)) { depth.set(m, depth.get(n) + 1); next.push(m); }
        });
      });
      frontier = next;
    }
  }

  const nodes = Array.from(nodeSet).sort((a, b) => a - b).map(num => ({
    num: num, depth: depth.has(num) ? depth.get(num) : null,
    degree: (adj.get(num) || []).length
  }));

  return { nodes: nodes, edges: edgeList.sort((x, y) => y.strength - x.strength || x.a - y.a) };
}

/* Deterministic radial layout: this radio at the centre, one ring per observed
   hop, nodes ordered by number inside a ring so the picture does not reshuffle
   itself every repaint. No physics, no randomness, no animation loop. */
function graphLayout(graph, opts) {
  opts = opts || {};
  const w = opts.w || 720, h = opts.h || 460;
  const cx = w / 2, cy = h / 2;
  const ringStep = opts.ringStep || 88;
  const byDepth = new Map();
  graph.nodes.forEach(n => {
    const d = n.depth === null ? -1 : n.depth;
    (byDepth.get(d) || byDepth.set(d, []).get(d)).push(n);
  });
  const maxDepth = Math.max.apply(null, graph.nodes.map(n => (n.depth === null ? 0 : n.depth)).concat([0]));
  const pos = new Map();
  byDepth.forEach((list, d) => {
    list.sort((a, b) => a.num - b.num);
    if (d === 0) { list.forEach(n => pos.set(n.num, { x: cx, y: cy, depth: 0 })); return; }
    const unlinked = d === -1;
    const ring = unlinked ? (maxDepth + 1) : d;
    const r = ringStep * ring * (opts.scale || 1);
    list.forEach((n, i) => {
      /* Offset alternate rings by half a step so nodes do not line up radially
         and hide each other's edges. */
      const angle = (i / list.length) * Math.PI * 2 + (ring % 2 ? Math.PI / list.length : 0) - Math.PI / 2;
      pos.set(n.num, {
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r * (opts.squash || 0.78),
        depth: n.depth, unlinked: unlinked
      });
    });
  });
  return { positions: pos, w: w, h: h, maxDepth: maxDepth };
}

function graphSvg(session, graph, layout) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + layout.w + ' ' + layout.h);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Observed link graph, ' + graph.nodes.length + ' nodes and ' + graph.edges.length + ' links');
  svg.style.width = '100%';
  svg.style.height = 'auto';

  const mk = (tag, attrs) => {
    const n = document.createElementNS(ns, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* rings, so hop distance is readable without counting edges */
  for (let d = 1; d <= layout.maxDepth + 1; d++) {
    svg.appendChild(mk('ellipse', {
      cx: layout.w / 2, cy: layout.h / 2, rx: 88 * d, ry: 88 * d * 0.78,
      fill: 'none', stroke: 'var(--line-soft)', 'stroke-dasharray': '2 5'
    }));
  }

  const colorFor = (e) => e.kinds.indexOf('traceroute') >= 0 ? 'var(--ember)'
    : (e.kinds.indexOf('heard') >= 0 ? 'var(--signal)' : 'var(--dim)');

  graph.edges.forEach(e => {
    const pa = layout.positions.get(e.a), pb = layout.positions.get(e.b);
    if (!pa || !pb) return;
    svg.appendChild(mk('line', {
      x1: pa.x.toFixed(1), y1: pa.y.toFixed(1), x2: pb.x.toFixed(1), y2: pb.y.toFixed(1),
      stroke: colorFor(e), 'stroke-width': e.strength === 3 ? 2 : (e.strength === 2 ? 1.5 : 1),
      'stroke-dasharray': e.kinds.length === 1 && e.kinds[0] === 'reported' ? '4 4' : null,
      opacity: 0.85
    }));
    if (e.bestSnr !== null) {
      const t = mk('text', {
        x: ((pa.x + pb.x) / 2).toFixed(1), y: ((pa.y + pb.y) / 2 - 4).toFixed(1),
        'text-anchor': 'middle', 'font-size': '9', 'font-family': 'var(--mono)', fill: 'var(--faint)'
      });
      t.textContent = e.bestSnr.toFixed(1);
      svg.appendChild(t);
    }
  });

  graph.nodes.forEach(n => {
    const p = layout.positions.get(n.num);
    if (!p) return;
    const isMe = n.num === session.myNodeNum;
    svg.appendChild(mk('circle', {
      cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: isMe ? 9 : 6,
      fill: isMe ? 'var(--ember)' : (p.unlinked ? 'var(--panel-3)' : 'var(--signal)'),
      stroke: p.unlinked ? 'var(--line)' : 'none', 'stroke-width': 1
    }));
    const label = mk('text', {
      x: p.x.toFixed(1), y: (p.y + (isMe ? 22 : 18)).toFixed(1), 'text-anchor': 'middle',
      'font-size': '10', 'font-family': 'var(--mono)', fill: 'var(--text)'
    });
    label.textContent = nodeLabel(session, n.num);
    svg.appendChild(label);
  });
  return svg;
}

let pathfinderTarget = null;

function stationPathfinder() {
  const s = APP.session;
  const wrap = stationHead('09 :: Pathfinder',
    'Observed topology, never authoritative. A mesh has no routing table to read, so this is a picture of what this radio has been told, assembled from what it heard directly, what other nodes reported, and where traceroutes actually went.');

  if (!s) {
    wrap.append(panelWith(emptyState('No link', 'Connect a radio or start the simulator from station 01.')));
    return wrap;
  }

  /* ---- run a traceroute ---- */
  const p0 = panel('Traceroute');
  const candidates = Array.from(s.nodes.values()).filter(n => n.num !== s.myNodeNum);
  if (pathfinderTarget === null && candidates.length) pathfinderTarget = candidates[0].num;
  p0.inner.append(el('div', { class: 'row' },
    el('label', { class: 'field', style: 'flex:1;min-width:220px;margin:0' }, el('span', null, 'Trace to'),
      el('select', { onchange: e => { pathfinderTarget = parseInt(e.target.value, 10); } },
        candidates.map(n => el('option', { value: String(n.num), selected: n.num === pathfinderTarget },
          ((n.user && n.user.long_name) || nodeIdHex(n.num)) + '  ' + nodeIdHex(n.num))))),
    el('button', {
      class: 'btn primary', disabled: s.state !== 'ready' || !candidates.length,
      onclick: async () => {
        try {
          await s.sendTraceroute(pathfinderTarget);
          toast('Traceroute sent. A reply can take a while on a slow preset.');
          paint();
        } catch (err) { toast('Could not send: ' + (err.message || err), 'bad'); }
      }
    }, 'Send traceroute')
  ));
  p0.inner.append(el('p', { class: 'note' },
    'A traceroute is a real packet that floods the mesh and comes back, so it costs airtime in both directions. Station 07 will tell you how much. Nothing is retried automatically and a request that gets no answer is reported as unanswered rather than as a broken path.'));
  if (s.pendingRoutes.size) {
    p0.inner.append(el('div', { class: 'warnbox' }, s.pendingRoutes.size + ' traceroute(s) outstanding, waiting up to 60 s each.'));
  }
  wrap.append(p0);

  /* ---- results ---- */
  if (s.routes.length) {
    const p1 = panel('Traceroute results', s.routes.length + ' held');
    s.routes.slice().reverse().slice(0, 12).forEach(r => {
      const box = el('div', { style: 'margin-bottom:16px' });
      box.append(el('div', { class: 'row', style: 'gap:8px' },
        el('span', { class: 'tagline ' + (r.timedOut ? 'bad' : 'ok') }, r.timedOut ? 'no answer' : 'answered'),
        el('span', { class: 'tagline' }, 'to ' + nodeLabel(s, r.target)),
        el('span', { class: 'tagline' }, clockTime(r.t)),
        r.elapsedMs ? el('span', { class: 'tagline' }, (r.elapsedMs / 1000).toFixed(1) + ' s round trip') : null,
        !r.complete && !r.timedOut ? el('span', { class: 'tagline warn' }, 'unsolicited, this reply matched no request we sent') : null));
      if (r.timedOut) {
        box.append(el('p', { class: 'note' }, 'Nothing came back inside 60 s. That may mean no route, or a busy channel, or a node that is awake but not answering. WATCHFIRE cannot tell those apart and does not guess.'));
      } else {
        box.append(pathLine(s, 'toward', r.forward));
        box.append(pathLine(s, 'return', r.back));
        const asym = describeAsymmetry(r);
        if (asym) box.append(el('p', { class: 'note' }, asym));
      }
      p1.inner.append(box);
    });
    p1.inner.append(el('div', { class: 'row' },
      el('button', { class: 'btn', onclick: () => downloadText('watchfire-routes-' + stamp() + '.json', JSON.stringify(routesDoc(s), null, 2)) }, 'Export routes')));
    wrap.append(p1);
  }

  /* ---- neighbour reports ---- */
  if (s.neighbors.size) {
    const p2 = panel('Neighbour reports', s.neighbors.size + ' nodes reporting');
    const t = el('table');
    t.append(el('thead', null, el('tr', null, ['Reported by', 'Heard', 'Neighbour', 'SNR', 'Last heard by them'].map(h => el('th', null, h)))));
    const b = el('tbody');
    s.neighbors.forEach(rep => {
      rep.list.forEach((n, i) => {
        b.append(el('tr', null,
          el('td', { class: 'mono' }, i === 0 ? nodeLabel(s, rep.owner) : ''),
          el('td', { class: 'num' }, i === 0 ? relTime(Math.floor(rep.t / 1000)) : ''),
          el('td', { class: 'mono' }, nodeLabel(s, n.node) + '  ' + nodeIdHex(n.node)),
          el('td', { class: 'num' }, n.snr === undefined || n.snr === null ? '-' : n.snr.toFixed(2) + ' dB'),
          el('td', { class: 'num' }, n.lastRx ? relTime(n.lastRx) : '-')));
      });
    });
    t.append(b);
    p2.inner.append(el('div', { class: 'scroll' }, t));
    p2.inner.append(el('p', { class: 'note' },
      'These are second hand. Node A telling you it hears node B is A\u2019s claim about A\u2019s receiver, at A\u2019s antenna, at the moment A last heard it. It says nothing about whether B hears A, and radio links are often not symmetric.'));
    wrap.append(p2);
  }

  /* ---- the graph ---- */
  const graph = buildLinkGraph(s);
  const p3 = panel('Observed link graph', graph.nodes.length + ' nodes, ' + graph.edges.length + ' links');
  if (!graph.edges.length) {
    p3.inner.append(emptyState('No links observed yet',
      'Links appear when this radio hears a packet at zero hops, when a node reports its neighbours, or when a traceroute walks a path. None of that has happened yet this session.'));
  } else {
    p3.inner.append(graphSvg(s, graph, graphLayout(graph)));
    p3.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('span', { class: 'tagline' }, 'centre is this radio'),
      el('span', { class: 'tagline ok' }, 'solid teal: heard directly, zero hops'),
      el('span', { class: 'tagline warn' }, 'ember: walked by a traceroute'),
      el('span', { class: 'tagline' }, 'dashed: reported by another node only'),
      el('span', { class: 'tagline' }, 'rings are observed hop distance')));
    p3.inner.append(el('p', { class: 'note' },
      'Numbers on the links are the best SNR any single piece of evidence recorded for them, in dB. A link is drawn when something said it exists, which is not the same as it existing now: nodes move, batteries die, and a report from an hour ago is an hour old. Ring position is the shortest path of evidence back to this radio, not a claim about how a packet would actually be routed.'));
  }
  wrap.append(p3);

  /* ---- the evidence behind every edge ---- */
  if (graph.edges.length) {
    const p4 = panel('Evidence behind each link');
    const t = el('table');
    t.append(el('thead', null, el('tr', null, ['Link', 'Evidence', 'Best SNR', 'Last seen'].map(h => el('th', null, h)))));
    const b = el('tbody');
    graph.edges.forEach(e => {
      const chips = el('div', { class: 'row', style: 'gap:6px' });
      const counts = {};
      e.evidence.forEach(ev => { counts[ev.kind] = (counts[ev.kind] || 0) + 1; });
      Object.keys(counts).sort().forEach(k => {
        const cls = k === 'traceroute' ? 'warn' : (k === 'heard' ? 'ok' : '');
        chips.append(el('span', { class: 'tagline ' + cls }, k + ' x' + counts[k]));
      });
      b.append(el('tr', null,
        el('td', { class: 'mono' }, nodeLabel(s, e.a) + '  to  ' + nodeLabel(s, e.b)),
        el('td', null, chips),
        el('td', { class: 'num' }, e.bestSnr === null ? '-' : e.bestSnr.toFixed(2) + ' dB'),
        el('td', { class: 'num', title: absTime(Math.floor(e.lastAt / 1000)) }, relTime(Math.floor(e.lastAt / 1000)))));
    });
    t.append(b);
    p4.inner.append(el('div', { class: 'scroll' }, t));
    const orphans = graph.nodes.filter(n => n.depth === null);
    if (orphans.length) {
      p4.inner.append(el('div', { class: 'note' },
        orphans.length + ' node(s) appear in the evidence with no chain of links back to this radio, so they sit on the outer ring with no claimed hop distance.'));
    }
    p4.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', { class: 'btn', onclick: () => downloadText('watchfire-topology-' + stamp() + '.json', JSON.stringify(topologyDoc(s, graph), null, 2)) }, 'Export topology as JSON')));
    wrap.append(p4);
  }
  return wrap;
}

function pathLine(s, label, legs) {
  const row = el('div', { class: 'row', style: 'gap:6px;margin-top:6px;align-items:center' });
  row.append(el('span', { class: 'tagline' }, label));
  if (!legs || !legs.length) { row.append(el('span', { style: 'color:var(--faint)' }, 'no path reported')); return row; }
  row.append(el('span', { class: 'mono' }, nodeLabel(s, legs[0].from)));
  legs.forEach(leg => {
    row.append(el('span', { style: 'color:var(--faint)' }, leg.snr === null ? '>' : '>'));
    if (leg.snr !== null) row.append(el('span', { class: 'tagline' }, leg.snr.toFixed(1) + ' dB'));
    else row.append(el('span', { class: 'tagline' }, 'snr not reported'));
    row.append(el('span', { class: 'mono' }, nodeLabel(s, leg.to)));
  });
  return row;
}

function describeAsymmetry(r) {
  const f = (r.forward || []).length, b = (r.back || []).length;
  if (!f || !b) return null;
  if (f !== b) return 'The route out took ' + f + ' hop(s) and the route back took ' + b + '. That is normal on a mesh and is worth noticing: the path a packet takes to a node is not necessarily the path its answer takes home.';
  const same = (r.forwardNodes || []).slice().sort().join(',') === (r.backNodes || []).slice().sort().join(',');
  return same ? null : 'Both legs used ' + f + ' hop(s) but not the same nodes, so the outbound and return paths differ.';
}

function routesDoc(s) {
  return {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'traceroute-record',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    note: 'SNR values are decoded from the RouteDiscovery scale of dB times four. A hop that reported no SNR is null rather than zero.',
    routes: s.routes.map(r => ({
      time_utc: absTime(Math.floor(r.t / 1000)), target: nodeIdHex(r.target),
      answered: !r.timedOut, round_trip_ms: r.elapsedMs,
      toward: (r.forward || []).map(l => ({ from: nodeIdHex(l.from), to: nodeIdHex(l.to), snr_db: l.snr })),
      back: (r.back || []).map(l => ({ from: nodeIdHex(l.from), to: nodeIdHex(l.to), snr_db: l.snr }))
    }))
  };
}

function topologyDoc(s, graph) {
  return {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'observed-topology',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    note: 'Observed, not authoritative. Edges are claims made by evidence, each labelled with what made the claim and when. Hop depth is the shortest chain of evidence back to this radio and is not a routing decision.',
    nodes: graph.nodes.map(n => ({
      node_id: nodeIdHex(n.num), name: nodeLabel(s, n.num),
      observed_hops: n.depth, links: n.degree
    })),
    links: graph.edges.map(e => ({
      a: nodeIdHex(e.a), b: nodeIdHex(e.b), best_snr_db: e.bestSnr,
      last_seen_utc: absTime(Math.floor(e.lastAt / 1000)),
      evidence: e.evidence.map(ev => ({
        kind: ev.kind, snr_db: ev.snr, at_utc: absTime(Math.floor(ev.at / 1000)),
        direction: nodeIdHex(ev.from) + ' to ' + nodeIdHex(ev.to), note: ev.note
      }))
    }))
  };
}

/* ==========================================================================
   WATCHFIRE :: station 10, BEARING
   Where things are, relative to a reference you choose. No map tiles, no tile
   service, no network. A plot with a scale bar and a table of range and
   bearing, which is what you can honestly draw from the positions the mesh
   reported and nothing more.
   ========================================================================== */

/* meshtastic/firmware src/modules/PositionModule.cpp, read 2026-08-11.
   A node can broadcast a deliberately coarsened position:
     mask = UINT32_MAX << (32 - precisionBits)
     centre offset = 1 << (31 - precisionBits)
   so the reported point is the centre of a cell 2^(32 - bits) wide in the
   int32 coordinate, and the true position is anywhere inside it. That is a
   privacy feature working as intended, not bad GPS, and it is drawn as a box
   rather than hidden. */
function positionUncertainty(precisionBits, latDeg) {
  if (!precisionBits || precisionBits >= 32) return null;
  const halfCellUnits = Math.pow(2, 31 - precisionBits);   // in units of 1e-7 degrees
  const halfDeg = halfCellUnits / 1e7;
  return {
    bits: precisionBits,
    halfDeg: halfDeg,
    northM: halfDeg * 110540,
    eastM: halfDeg * 111320 * Math.cos(latDeg * Math.PI / 180)
  };
}

/* The plot is polar and is built from exactly the numbers in the table, so the
   picture and the figures can never disagree with each other. */
function plotPoint(rangeKm, bearing, mPerPx, cx, cy) {
  const r = (rangeKm * 1000) / mPerPx;
  const a = bearing * Math.PI / 180;
  return { x: cx + r * Math.sin(a), y: cy - r * Math.cos(a) };
}

/* Round a range up to something a person would write on a scale bar. */
function niceRange(km) {
  if (!(km > 0)) return 1;
  const steps = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  const exp = Math.pow(10, Math.floor(Math.log10(km)) - 1);
  for (const s of steps) {
    for (const m of [exp, exp * 10, exp * 100]) {
      if (s * m >= km) return s * m;
    }
  }
  return Math.ceil(km);
}

function bearingCardinal(deg) {
  const names = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return names[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

/* Everything the station needs about one node, computed once. */
function bearingRows(session, ref) {
  const rows = [];
  session.nodes.forEach(n => {
    const p = posLatLon(n.position);
    const row = {
      num: n.num, name: nodeLabel(session, n.num),
      longName: (n.user && n.user.long_name) || nodeIdHex(n.num),
      pos: p, position: n.position || null,
      fixAge: n.position && n.position.time ? n.position.time : null,
      lastHeard: n.last_heard || null,
      source: n.position && n.position.location_source !== undefined ? enumName('LocSource', n.position.location_source) : null,
      precision: n.position ? n.position.precision_bits : undefined,
      isRef: false, rangeKm: null, bearing: null, uncertainty: null
    };
    if (p && ref) {
      row.isRef = (Math.abs(p.lat - ref.lat) < 1e-9 && Math.abs(p.lon - ref.lon) < 1e-9);
      row.rangeKm = haversineKm(ref.lat, ref.lon, p.lat, p.lon);
      row.bearing = row.rangeKm < 0.0005 ? null : bearingDeg(ref.lat, ref.lon, p.lat, p.lon);
      row.uncertainty = positionUncertainty(n.position.precision_bits, p.lat);
    }
    rows.push(row);
  });
  return rows;
}

let bearingRefMode = 'me';
let bearingRefNode = null;
let bearingManual = { lat: '', lon: '' };
let bearingShowStale = true;

function stationBearing() {
  const s = APP.session;
  const wrap = stationHead('10 :: Bearing',
    'Range and bearing from a reference you choose, and a plot drawn from exactly those numbers. There are no map tiles here and nothing is fetched, so this works on a bench with no internet as readily as it does anywhere else.');

  if (!s || !s.nodes.size) {
    wrap.append(panelWith(emptyState('No roster', 'Connect a radio or start the simulator from station 01.')));
    return wrap;
  }

  /* ---- reference ---- */
  const positioned = Array.from(s.nodes.values()).filter(n => posLatLon(n.position));
  const me = s.nodes.get(s.myNodeNum);
  const myPos = me ? posLatLon(me.position) : null;
  /* Pick a default before resolving the reference, not after, or the first
     paint after switching mode reports a node with no position when what it
     actually has is no node chosen yet. */
  if (bearingRefNode === null && positioned.length) bearingRefNode = positioned[0].num;
  let ref = null, refLabel = '';
  if (bearingRefMode === 'me' && myPos) { ref = myPos; refLabel = 'this radio, ' + nodeLabel(s, s.myNodeNum); }
  else if (bearingRefMode === 'node' && bearingRefNode !== null) {
    const n = s.nodes.get(bearingRefNode);
    const p = n ? posLatLon(n.position) : null;
    if (p) { ref = p; refLabel = nodeLabel(s, bearingRefNode); }
  } else if (bearingRefMode === 'manual') {
    const lat = parseFloat(bearingManual.lat), lon = parseFloat(bearingManual.lon);
    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
      ref = { lat: lat, lon: lon }; refLabel = lat.toFixed(5) + ', ' + lon.toFixed(5);
    }
  }

  const p0 = panel('Reference point', ref ? refLabel : 'not set');
  const modeRow = el('div', { class: 'row' },
    el('label', { class: 'field', style: 'width:230px;margin:0' }, el('span', null, 'Measure from'),
      el('select', { onchange: e => { bearingRefMode = e.target.value; paint(); } },
        el('option', { value: 'me', selected: bearingRefMode === 'me' }, 'this radio'),
        el('option', { value: 'node', selected: bearingRefMode === 'node' }, 'another node'),
        el('option', { value: 'manual', selected: bearingRefMode === 'manual' }, 'a point I type in'))));
  if (bearingRefMode === 'node') {
    modeRow.append(el('label', { class: 'field', style: 'flex:1;min-width:220px;margin:0' }, el('span', null, 'Node'),
      el('select', { onchange: e => { bearingRefNode = parseInt(e.target.value, 10); paint(); } },
        positioned.map(n => el('option', { value: String(n.num), selected: n.num === bearingRefNode },
          ((n.user && n.user.long_name) || nodeIdHex(n.num)))))));
  } else if (bearingRefMode === 'manual') {
    modeRow.append(
      el('label', { class: 'field', style: 'width:180px;margin:0' }, el('span', null, 'Latitude'),
        el('input', { type: 'text', value: bearingManual.lat, placeholder: '39.65280', oninput: e => { bearingManual.lat = e.target.value; schedulePaint(); } })),
      el('label', { class: 'field', style: 'width:180px;margin:0' }, el('span', null, 'Longitude'),
        el('input', { type: 'text', value: bearingManual.lon, placeholder: '-78.76250', oninput: e => { bearingManual.lon = e.target.value; schedulePaint(); } })));
  }
  p0.inner.append(modeRow);

  if (!ref) {
    p0.inner.append(el('div', { class: 'warnbox' },
      bearingRefMode === 'me'
        ? 'This radio has not reported a position, so nothing can be measured from it. Pick another node or type a point in. No position is assumed on its behalf.'
        : bearingRefMode === 'manual'
          ? 'Type a latitude between -90 and 90 and a longitude between -180 and 180.'
          : 'That node has no position.'));
    wrap.append(p0);
    return wrap;
  }
  p0.inner.append(el('p', { class: 'note' },
    'Measuring from ' + refLabel + ' at ' + ref.lat.toFixed(5) + ', ' + ref.lon.toFixed(5) +
    '. Bearings are true, not magnetic, and no declination is applied. Ranges are great circle distances on a sphere, which is accurate to a few metres at mesh scale.'));
  wrap.append(p0);

  /* ---- rows ---- */
  const rows = bearingRows(s, ref).sort((a, b) => {
    if (a.rangeKm === null && b.rangeKm === null) return a.num - b.num;
    if (a.rangeKm === null) return 1;
    if (b.rangeKm === null) return -1;
    return a.rangeKm - b.rangeKm;
  });
  const plotted = rows.filter(r => r.rangeKm !== null);
  const unpositioned = rows.filter(r => r.rangeKm === null);

  if (!plotted.length) {
    wrap.append(panelWith(emptyState('No positions', 'No node in the roster has reported a position, so there is nothing to plot. Positions arrive on POSITION_APP packets and in NodeInfo.')));
    return wrap;
  }

  /* ---- the plot ---- */
  const maxKm = Math.max.apply(null, plotted.map(r => r.rangeKm));
  const outer = niceRange(Math.max(maxKm * 1.12, 0.05));
  const size = 520, cx = size / 2, cy = size / 2, radiusPx = size / 2 - 34;
  const mPerPx = (outer * 1000) / radiusPx;

  const p1 = panel('Relative plot', 'north up, ' + outer + ' km to the edge');
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Relative position plot, ' + plotted.length + ' nodes, ' + outer + ' km to the edge, north up');
  svg.style.width = '100%';
  svg.style.maxWidth = size + 'px';
  svg.style.height = 'auto';
  const mk = (tag, attrs) => { const n = document.createElementNS(ns, tag); for (const k in attrs) if (attrs[k] !== null) n.setAttribute(k, attrs[k]); return n; };
  const label = (x, y, str, anchor, fill, sizePx) => {
    const t = mk('text', { x: x, y: y, 'text-anchor': anchor || 'middle', fill: fill || 'var(--faint)', 'font-size': sizePx || 10, 'font-family': 'var(--mono)' });
    t.textContent = str;
    svg.appendChild(t);
  };

  for (let i = 1; i <= 4; i++) {
    const rKm = outer * i / 4;
    svg.appendChild(mk('circle', { cx: cx, cy: cy, r: radiusPx * i / 4, fill: 'none', stroke: 'var(--line-soft)', 'stroke-dasharray': i === 4 ? null : '2 5' }));
    label(cx + 3, cy - radiusPx * i / 4 - 3, rKm < 1 ? (rKm * 1000).toFixed(0) + ' m' : rKm.toFixed(rKm < 10 ? 1 : 0) + ' km', 'start');
  }
  svg.appendChild(mk('line', { x1: cx, y1: cy - radiusPx, x2: cx, y2: cy + radiusPx, stroke: 'var(--line-soft)' }));
  svg.appendChild(mk('line', { x1: cx - radiusPx, y1: cy, x2: cx + radiusPx, y2: cy, stroke: 'var(--line-soft)' }));
  label(cx, cy - radiusPx - 12, 'N', 'middle', 'var(--ember)', 12);
  label(cx + radiusPx + 10, cy + 4, 'E', 'middle');
  label(cx, cy + radiusPx + 18, 'S', 'middle');
  label(cx - radiusPx - 10, cy + 4, 'W', 'middle');

  const now = Math.floor(Date.now() / 1000);
  plotted.forEach(r => {
    if (r.rangeKm > outer) return;
    const pt = r.bearing === null ? { x: cx, y: cy } : plotPoint(r.rangeKm, r.bearing, mPerPx, cx, cy);
    if (r.uncertainty) {
      const wPx = (r.uncertainty.eastM * 2) / mPerPx, hPx = (r.uncertainty.northM * 2) / mPerPx;
      if (wPx > 2 || hPx > 2) {
        svg.appendChild(mk('rect', {
          x: (pt.x - wPx / 2).toFixed(1), y: (pt.y - hPx / 2).toFixed(1),
          width: Math.max(3, wPx).toFixed(1), height: Math.max(3, hPx).toFixed(1),
          fill: 'var(--ember)', 'fill-opacity': '0.12', stroke: 'var(--ember)', 'stroke-dasharray': '3 3'
        }));
      }
    }
    const stale = r.lastHeard && (now - r.lastHeard) > 3600;
    const isMe = r.num === s.myNodeNum;
    svg.appendChild(mk('circle', {
      cx: pt.x.toFixed(1), cy: pt.y.toFixed(1), r: isMe || r.isRef ? 7 : 5,
      fill: r.isRef ? 'var(--ember)' : (stale ? 'var(--panel-3)' : 'var(--signal)'),
      stroke: stale ? 'var(--line)' : 'none'
    }));
    label(pt.x, pt.y - 11, r.name, 'middle', stale ? 'var(--faint)' : 'var(--text)');
  });

  /* scale bar, drawn from the same metres per pixel the plot uses */
  const barKm = niceRange(outer / 3);
  const barPx = (barKm * 1000) / mPerPx;
  const bx = 20, by = size - 16;
  svg.appendChild(mk('line', { x1: bx, y1: by, x2: bx + barPx, y2: by, stroke: 'var(--text)', 'stroke-width': 2 }));
  svg.appendChild(mk('line', { x1: bx, y1: by - 4, x2: bx, y2: by + 4, stroke: 'var(--text)', 'stroke-width': 2 }));
  svg.appendChild(mk('line', { x1: bx + barPx, y1: by - 4, x2: bx + barPx, y2: by + 4, stroke: 'var(--text)', 'stroke-width': 2 }));
  label(bx + barPx / 2, by - 8, barKm < 1 ? (barKm * 1000).toFixed(0) + ' m' : barKm + ' km', 'middle', 'var(--text)');

  p1.inner.append(svg);
  const offscreen = plotted.filter(r => r.rangeKm > outer).length;
  p1.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('span', { class: 'tagline warn' }, 'ember: the reference'),
    el('span', { class: 'tagline ok' }, 'teal: heard within the hour'),
    el('span', { class: 'tagline' }, 'hollow: not heard for over an hour'),
    el('span', { class: 'tagline' }, 'dashed box: the node coarsened its own position')));
  p1.inner.append(el('p', { class: 'note' },
    'Positions are plotted at the range and bearing in the table below, so the picture and the figures cannot disagree. North is up and bearings are true. This is a relative plot, not a map: there is no terrain, no roads and no projection beyond the polar one, because none of that can be drawn without fetching something.' +
    (offscreen ? ' ' + offscreen + ' node(s) are beyond the edge and are listed in the table only.' : '')));
  wrap.append(p1);

  /* ---- the table ---- */
  const p2 = panel('Range and bearing', plotted.length + ' positioned, ' + unpositioned.length + ' without a position');
  const t = el('table');
  t.append(el('thead', null, el('tr', null, ['Node', 'Range', 'Bearing', 'Position', 'Fix age', 'Source', 'Precision'].map(h => el('th', null, h)))));
  const tb = el('tbody');
  plotted.forEach(r => {
    const stale = r.lastHeard && (now - r.lastHeard) > 3600;
    tb.append(el('tr', { data: { stale: stale ? '1' : '0' } },
      el('td', null, el('div', null, r.longName), el('div', { class: 'mono', style: 'color:var(--faint);font-size:11px' }, nodeIdHex(r.num) + (r.isRef ? '  (reference)' : ''))),
      el('td', { class: 'num' }, r.isRef ? '-' : (r.rangeKm < 1 ? (r.rangeKm * 1000).toFixed(0) + ' m' : r.rangeKm.toFixed(2) + ' km')),
      el('td', { class: 'num' }, r.bearing === null ? '-' : r.bearing.toFixed(1) + '\u00b0 ' + bearingCardinal(r.bearing)),
      el('td', { class: 'mono' }, r.pos.lat.toFixed(5) + ', ' + r.pos.lon.toFixed(5)),
      el('td', { class: 'num', title: r.fixAge ? absTime(r.fixAge) : '' }, r.fixAge ? relTime(r.fixAge) : 'not reported'),
      el('td', null, r.source || '-'),
      el('td', null, r.uncertainty
        ? el('span', { class: 'tagline warn' }, r.uncertainty.bits + ' bits, about ' + fmtMetres(r.uncertainty.northM) + ' either way)'.replace(')', ''))
        : (r.precision === undefined ? el('span', { style: 'color:var(--faint)' }, 'not stated') : 'full'))));
  });
  t.append(tb);
  p2.inner.append(el('div', { class: 'scroll' }, t));
  if (plotted.some(r => r.uncertainty)) {
    p2.inner.append(el('p', { class: 'note' },
      'A node reporting reduced precision has deliberately coarsened its own position before transmitting. Firmware masks the low bits of the coordinate and reports the centre of the remaining cell, so the true position is somewhere inside the box drawn on the plot. That is a privacy setting doing its job, not a bad fix, and WATCHFIRE will not sharpen it.'));
  }
  if (unpositioned.length) {
    p2.inner.append(el('h4', null, 'Heard, but no position reported'));
    const ul = el('div', { class: 'row', style: 'gap:8px' });
    unpositioned.forEach(r => ul.append(el('span', { class: 'tagline' }, r.longName + '  ' + (r.lastHeard ? relTime(r.lastHeard) : 'never heard'))));
    p2.inner.append(ul);
    p2.inner.append(el('p', { class: 'note' },
      'These nodes are on the roster and have never sent a position, or sent one this session that did not parse as a fix. They are absent from the plot rather than being placed at the reference or at zero.'));
  }
  p2.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-bearing-' + stamp() + '.csv', bearingCsv(rows, ref, refLabel)) }, 'Export as CSV'),
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-bearing-' + stamp() + '.json', JSON.stringify(bearingDoc(s, rows, ref, refLabel), null, 2)) }, 'Export as JSON')));
  wrap.append(p2);
  return wrap;
}

function fmtMetres(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' km';
}

function bearingCsv(rows, ref, refLabel) {
  const lines = ['# reference,' + csv(refLabel) + ',' + ref.lat.toFixed(7) + ',' + ref.lon.toFixed(7),
    'node_id,name,range_km,bearing_deg_true,latitude,longitude,fix_time_utc,location_source,precision_bits,uncertainty_m'];
  rows.forEach(r => {
    lines.push([
      nodeIdHex(r.num), csv(r.longName),
      r.rangeKm === null ? '' : r.rangeKm.toFixed(4),
      r.bearing === null ? '' : r.bearing.toFixed(2),
      r.pos ? r.pos.lat.toFixed(7) : '', r.pos ? r.pos.lon.toFixed(7) : '',
      r.fixAge ? absTime(r.fixAge) : '', r.source || '',
      r.precision === undefined ? '' : r.precision,
      r.uncertainty ? Math.round(r.uncertainty.northM) : ''
    ].join(','));
  });
  return lines.join('\n');
}

function bearingDoc(s, rows, ref, refLabel) {
  return {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'bearing-record',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    reference: { label: refLabel, latitude: ref.lat, longitude: ref.lon },
    note: 'Bearings are true, not magnetic, and no declination is applied. Ranges are great circle distances. Where a node reported reduced precision, uncertainty_m is the half cell its firmware quantised to, and the true position is somewhere inside it.',
    nodes: rows.map(r => ({
      node_id: nodeIdHex(r.num), name: r.longName,
      range_km: r.rangeKm, bearing_deg_true: r.bearing,
      latitude: r.pos ? r.pos.lat : null, longitude: r.pos ? r.pos.lon : null,
      fix_time_utc: r.fixAge ? absTime(r.fixAge) : null,
      location_source: r.source, precision_bits: r.precision === undefined ? null : r.precision,
      uncertainty_m: r.uncertainty ? Math.round(r.uncertainty.northM) : null
    }))
  };
}

/* ==========================================================================
   WATCHFIRE :: station 11, LOGBOOK
   The session as a record: the raw lane captured with timestamps, notes taken
   while you were looking at it, and one bundle that carries everything the
   other stations know, with a note on each part saying what it does and does
   not claim. A bundle you cannot interpret six months later is not evidence.
   ========================================================================== */

let logbookInclude = {
  roster: true, config: true, channels: true, packets: true,
  telemetry: true, topology: true, notes: true, capture: false
};
let replaySpeed = 1;

function stationLogbook() {
  const s = APP.session;
  const wrap = stationHead('11 :: Logbook',
    'Record the session, annotate it while it is happening, and export one bundle that carries what every other station knows. Also replays a capture back through the same reader, so a fault you caught once can be caught again on the bench.');

  /* ---- recording ---- */
  const p0 = panel('Recording', s && s.capturing ? 'recording' : 'stopped');
  if (!s) {
    p0.inner.append(emptyState('No link', 'Recording needs a live link. Station 01.'));
  } else {
    const elapsed = s.capture.started ? (Date.now() - s.capture.started) / 1000 : 0;
    p0.inner.append(el('div', { class: 'tally', style: 'padding-top:0' },
      el('div', { class: s.capturing ? 'ok' : '' }, el('b', null, s.capturing ? 'ON' : 'off'), el('span', null, 'recorder')),
      el('div', null, el('b', null, String(s.capture.events.length)), el('span', null, 'lane events')),
      el('div', null, el('b', null, fmtBytes(s.capture.bytes)), el('span', null, 'raw bytes')),
      el('div', null, el('b', null, elapsed > 0 ? fmtDuration(elapsed) : '-'), el('span', null, 'elapsed'))));
    p0.inner.append(el('div', { class: 'row' },
      el('button', {
        class: 'btn primary', disabled: s.capturing,
        onclick: () => { s.startCapture(); toast('Recording the lane.', 'ok'); paint(); }
      }, s.capture.events.length ? 'Start a new recording' : 'Start recording'),
      el('button', { class: 'btn', disabled: !s.capturing, onclick: () => { s.stopCapture(); paint(); } }, 'Stop'),
      el('button', {
        class: 'btn', disabled: !s.capture.events.length,
        onclick: () => downloadText('watchfire-capture-' + stamp() + '.json', JSON.stringify(captureDoc(s), null, 2))
      }, 'Export the capture')
    ));
    if (s.capture.truncated) {
      p0.inner.append(el('div', { class: 'warnbox' },
        'Recording stopped at the ' + s.captureCap + ' event cap. What was captured is intact and exportable. Nothing was silently dropped from the middle.'));
    }
    p0.inner.append(el('div', { class: 'badbox' },
      'A raw capture is every byte in both directions. If you write a channel or a codeplug while recording, the capture contains the channel key and the admin session passkey in the clear. Treat an exported capture as key material and think before you attach it to a bug report.'));
    p0.inner.append(el('p', { class: 'note' },
      'Timestamps are milliseconds from the moment recording started, so a capture replays at the timing it was recorded at. The recorder starts a fresh file each time rather than appending, and it captures the lane, not the decode: a replay exercises the framer and the codec again from the original bytes.'));
  }
  wrap.append(p0);

  /* ---- notes ---- */
  const p1 = panel('Notes', s ? s.notes.length + ' entries' : '');
  if (!s) {
    p1.inner.append(emptyState('No session', 'Notes belong to a session.'));
  } else {
    const input = el('input', { type: 'text', id: 'noteinput', placeholder: 'what just happened, and what you think it means' });
    const add = () => {
      const n = s.addNote(input.value);
      if (n) { input.value = ''; paint(); }
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    p1.inner.append(el('label', { class: 'field' }, el('span', null, 'Add a note, timestamped now'), input));
    p1.inner.append(el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: add }, 'Add note')));
    if (s.notes.length) {
      const list = el('div', { style: 'margin-top:12px' });
      s.notes.slice().reverse().forEach(n => {
        list.append(el('div', { class: 'row', style: 'gap:10px;align-items:baseline;border-bottom:1px solid var(--line-soft);padding:6px 0' },
          el('span', { class: 'mono', style: 'color:var(--faint);font-size:11px' }, clockTime(n.t)),
          el('span', { style: n.struck ? 'text-decoration:line-through;color:var(--faint);flex:1' : 'flex:1' }, n.text),
          el('button', { class: 'btn', onclick: () => { s.strikeNote(n.id, !n.struck); paint(); } }, n.struck ? 'Restore' : 'Strike')));
      });
      p1.inner.append(list);
      p1.inner.append(el('p', { class: 'note' },
        'A struck note stays in the record and in the bundle, marked as struck. A note you took and later disagreed with is part of what happened, so it is not deleted.'));
    }
  }
  wrap.append(p1);

  /* ---- the bundle ---- */
  const p2 = panel('Evidence bundle');
  if (!s) {
    p2.inner.append(emptyState('No session', 'There is nothing to bundle yet.'));
  } else {
    const parts = [
      ['roster', 'Node roster snapshot', s.nodes.size + ' nodes'],
      ['config', 'Codeplug as read', s.config.size + ' sections'],
      ['channels', 'Channel set', s.channels.filter(Boolean).length + ' slots, keys included'],
      ['packets', 'Packet log', s.packets.length + ' packets'],
      ['telemetry', 'Telemetry record', s.telemetry.size + ' reporting nodes'],
      ['topology', 'Observed topology and traceroutes', s.routes.length + ' routes'],
      ['notes', 'Session notes', s.notes.length + ' entries'],
      ['capture', 'Raw lane capture', s.capture.events.length + ' events, ' + fmtBytes(s.capture.bytes)]
    ];
    parts.forEach(part => {
      p2.inner.append(el('label', { class: 'check' },
        el('input', {
          type: 'checkbox', checked: logbookInclude[part[0]],
          onchange: e => { logbookInclude[part[0]] = e.target.checked; schedulePaint(); }
        }),
        el('span', null, part[1]), el('span', { class: 'tagline' }, part[2]),
        part[0] === 'channels' || part[0] === 'capture' ? el('span', { class: 'tagline bad' }, 'key material') : null));
    });
    p2.inner.append(el('div', { class: 'row', style: 'margin-top:12px' },
      el('button', {
        class: 'btn primary',
        onclick: () => downloadText('watchfire-bundle-' + stamp() + '.json', JSON.stringify(evidenceBundle(s), null, 2))
      }, 'Export the bundle'),
      el('button', { class: 'btn', onclick: () => downloadText('watchfire-summary-' + stamp() + '.md', summaryMarkdown(s)) }, 'Export a summary'),
      el('button', { class: 'btn', onclick: () => printSummary(s) }, 'Printable summary')
    ));
    p2.inner.append(el('p', { class: 'note' },
      'The bundle is one JSON file. Every section carries a note saying what it claims, because a bundle you cannot interpret six months later is not evidence. Channels and captures are unticked or flagged where they carry key material, and it is on you to decide what leaves the machine.'));
  }
  wrap.append(p2);

  /* ---- replay ---- */
  const p3 = panel('Replay a capture');
  const file = el('input', { type: 'file', accept: '.json' });
  const status = el('div');
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      clear(status);
      let doc;
      try { doc = JSON.parse(rd.result); }
      catch (e) { status.append(el('div', { class: 'badbox' }, 'That file is not JSON.')); return; }
      const cap = doc && doc.capture ? doc.capture : doc;
      if (!cap || !Array.isArray(cap.events)) {
        status.append(el('div', { class: 'badbox' }, 'That file carries no capture events. A WATCHFIRE capture or a bundle exported with the capture included will work.'));
        return;
      }
      const inbound = cap.events.filter(e => e.dir === 'in').length;
      status.append(el('div', { class: 'okbox' },
        cap.events.length + ' events loaded, ' + inbound + ' of them inbound. Replay feeds the inbound bytes back through the same framer and codec at the timing they were recorded at.'));
      try {
        await beginSession(new ReplayTransport(cap, replaySpeed));
        toast('Replaying. The instrument cannot write to a replay, only read it.', 'ok');
        paint();
      } catch (err) {
        status.append(el('div', { class: 'badbox' }, 'Replay failed: ' + (err.message || err)));
      }
    };
    rd.readAsText(f);
  });
  p3.inner.append(el('div', { class: 'row' },
    el('label', { class: 'field', style: 'flex:1;min-width:220px;margin:0' }, el('span', null, 'Capture or bundle file'), file),
    el('label', { class: 'field', style: 'width:170px;margin:0' }, el('span', null, 'Speed'),
      el('select', { onchange: e => { replaySpeed = parseFloat(e.target.value); } },
        [['1', 'as recorded'], ['4', '4 times'], ['20', '20 times']].map(o =>
          el('option', { value: o[0], selected: String(replaySpeed) === o[0] }, o[1]))))));
  p3.inner.append(status);
  p3.inner.append(el('p', { class: 'note' },
    'A replay is a one way session: bytes flow in and nothing can be written back, because there is nothing on the other end. Every station works during a replay exactly as it does on a live radio, which is the point. Starting a replay ends the current link.'));
  wrap.append(p3);
  return wrap;
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' kB';
  return (n / 1048576).toFixed(2) + ' MB';
}

function captureDoc(s) {
  return {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'lane-capture',
    taken_utc: absTime(Math.floor((s.capture.started || Date.now()) / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    firmware: s.metadata ? s.metadata.firmware_version : null,
    transport: APP.transport ? APP.transport.kind : null,
    note: 'Raw serial lane, both directions, hex encoded, t is milliseconds from the start of recording. This may contain channel keys and admin session passkeys if anything was written while recording.',
    truncated_at_cap: !!s.capture.truncated,
    capture: { started_utc: absTime(Math.floor((s.capture.started || Date.now()) / 1000)), events: s.capture.events }
  };
}

/* One file, every section labelled with what it claims. The notes are as much
   a part of the bundle as the data, because they are the only part that says
   why any of it was collected. */
function evidenceBundle(s) {
  const doc = {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'evidence-bundle',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    session: {
      started_utc: s.startedAt ? absTime(Math.floor(s.startedAt / 1000)) : null,
      duration_s: s.startedAt ? Math.round((Date.now() - s.startedAt) / 1000) : null,
      transport: APP.transport ? APP.transport.kind : null,
      simulated: !!(APP.transport && APP.transport.kind !== 'serial'),
      state: s.state,
      radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
      firmware: s.metadata ? s.metadata.firmware_version : null,
      hardware: s.metadata ? enumName('HardwareModel', s.metadata.hw_model || 0) : null,
      proto_provenance: PROTO_PROVENANCE,
      frames_read: s.deframer ? s.deframer.stats.frames : null,
      stray_bytes: s.deframer ? s.deframer.stats.strayBytes : null,
      resyncs: s.deframer ? s.deframer.stats.resyncs : null,
      partially_understood: Array.from(s.partialTypes)
    },
    reading_this_later: [
      'Everything here is what one radio heard and sent during one session. It is not a survey of the mesh.',
      'Any section describing links or topology is observed, not authoritative. A mesh has no routing table to read.',
      'Telemetry timestamps are the reading times the radio reported, not arrival times.',
      'If session.simulated is true, none of this came from a physical radio.'
    ],
    sections: {}
  };
  if (logbookInclude.roster) {
    doc.sections.roster = {
      note: 'Node roster as the radio reported it at export time. last_heard is the radio\u2019s figure.',
      nodes: Array.from(s.nodes.values()).map(scrub)
    };
  }
  if (logbookInclude.config) {
    const cfg = {};
    s.config.forEach((v, k) => { cfg[k] = scrub(v); });
    const mod = {};
    s.moduleConfig.forEach((v, k) => { mod[k] = scrub(v); });
    doc.sections.codeplug = {
      note: 'Configuration as read. Fields this build does not know are preserved under unknown_fields with their raw bytes.',
      config: cfg, module_config: mod
    };
  }
  if (logbookInclude.channels) {
    doc.sections.channels = {
      note: 'Channel set including pre shared keys. This is key material.',
      channels: s.channels.filter(Boolean).map(scrub)
    };
  }
  if (logbookInclude.packets) {
    doc.sections.packets = {
      note: 'Every frame this session, in and out, decoded where a decoder exists and left as bytes where none does.',
      packets: s.packets.map(packetRecord)
    };
  }
  if (logbookInclude.telemetry && s.telemetry.size) doc.sections.telemetry = telemetryDoc(s);
  if (logbookInclude.topology) {
    doc.sections.topology = topologyDoc(s, buildLinkGraph(s));
    doc.sections.traceroutes = routesDoc(s);
  }
  if (logbookInclude.notes) {
    doc.sections.notes = {
      note: 'Operator notes taken during the session. A struck note was retracted and is kept marked rather than removed.',
      entries: s.notes.map(n => ({ time_utc: absTime(Math.floor(n.t / 1000)), text: n.text, struck: n.struck }))
    };
  }
  if (logbookInclude.capture && s.capture.events.length) doc.sections.capture = captureDoc(s);
  return doc;
}

function summaryLines(s) {
  const L = [];
  const simulated = !!(APP.transport && APP.transport.kind !== 'serial');
  L.push(['h1', 'WATCHFIRE session summary']);
  L.push(['p', absTime(Math.floor(Date.now() / 1000)) + ', WATCHFIRE v' + VERSION]);
  if (simulated) L.push(['warn', 'This session did not involve a physical radio. The transport was the ' + (APP.transport ? APP.transport.kind : 'unknown') + '.']);
  L.push(['h2', 'Session']);
  L.push(['kv', 'radio', s.myNodeNum ? nodeIdHex(s.myNodeNum) + '  ' + nodeLabel(s, s.myNodeNum) : 'not identified']);
  L.push(['kv', 'firmware', s.metadata ? (s.metadata.firmware_version || 'unreported') : 'not read']);
  L.push(['kv', 'hardware', s.metadata ? enumName('HardwareModel', s.metadata.hw_model || 0) : 'not read']);
  L.push(['kv', 'duration', s.startedAt ? fmtDuration((Date.now() - s.startedAt) / 1000) : 'unknown']);
  if (s.deframer) {
    L.push(['kv', 'frames read', String(s.deframer.stats.frames)]);
    L.push(['kv', 'stray bytes', String(s.deframer.stats.strayBytes)]);
    L.push(['kv', 'resyncs', String(s.deframer.stats.resyncs)]);
  }
  L.push(['kv', 'packets logged', String(s.packets.length)]);
  L.push(['kv', 'protobuf tables', PROTO_PROVENANCE]);
  if (s.partialTypes.size) L.push(['kv', 'partially understood', Array.from(s.partialTypes).join(', ')]);

  L.push(['h2', 'Roster, ' + s.nodes.size + ' nodes']);
  const me = s.nodes.get(s.myNodeNum);
  const home = me ? posLatLon(me.position) : null;
  Array.from(s.nodes.values())
    .sort((a, b) => (b.last_heard || 0) - (a.last_heard || 0))
    .forEach(n => {
      const p = posLatLon(n.position);
      const bits = [
        nodeIdHex(n.num),
        (n.user && n.user.long_name) || 'unnamed',
        'heard ' + relTime(n.last_heard),
        n.hops_away === undefined ? 'hops unknown' : n.hops_away + ' hops',
        n.snr === undefined ? 'snr unknown' : n.snr.toFixed(2) + ' dB'
      ];
      if (home && p) bits.push(haversineKm(home.lat, home.lon, p.lat, p.lon).toFixed(2) + ' km at ' + Math.round(bearingDeg(home.lat, home.lon, p.lat, p.lon)) + ' deg');
      L.push(['li', bits.join(', ')]);
    });

  const graph = buildLinkGraph(s);
  if (graph.edges.length) {
    L.push(['h2', 'Observed links, ' + graph.edges.length]);
    L.push(['p', 'Observed, not authoritative. Each link is a claim made by some evidence at some moment.']);
    graph.edges.forEach(e => {
      L.push(['li', nodeLabel(s, e.a) + ' to ' + nodeLabel(s, e.b) + ', evidence: ' + e.kinds.join(' and ') +
        (e.bestSnr === null ? ', no SNR reported' : ', best SNR ' + e.bestSnr.toFixed(2) + ' dB') +
        ', last seen ' + relTime(Math.floor(e.lastAt / 1000))]);
    });
  }

  if (s.telemetry.size) {
    L.push(['h2', 'Telemetry, ' + s.telemetry.size + ' reporting nodes']);
    s.telemetry.forEach((series, num) => {
      const last = series[series.length - 1];
      const readings = Object.keys(last.readings).map(k => metricInfo(k).label + ' ' + fmtReading(k, last.readings[k])).join(', ');
      L.push(['li', nodeLabel(s, num) + ', ' + series.length + ' samples, latest ' + relTime(Math.floor(last.t / 1000)) + ': ' + readings]);
    });
  }

  if (s.messages.length) {
    L.push(['h2', 'Messages, ' + s.messages.length]);
    s.messages.slice(-40).forEach(m => {
      const evidence = m.dir === 'out'
        ? (m.entry && m.entry.ack ? (m.entry.ack.ok ? (m.entry.ack.implicit ? 'implicit ack' : 'ack from the destination') : 'nak: ' + m.entry.ack.errorName) : 'no ack recorded')
        : 'received';
      L.push(['li', clockTime(m.t) + '  ' + (m.dir === 'out' ? 'to ' : 'from ') +
        (m.dir === 'out' ? (m.to === BROADCAST_NUM ? 'all' : nodeLabel(s, m.to)) : nodeLabel(s, m.from)) +
        ': ' + m.text + '  [' + evidence + ']']);
    });
  }

  L.push(['h2', 'Notes, ' + s.notes.length]);
  if (!s.notes.length) L.push(['p', 'None taken.']);
  s.notes.forEach(n => L.push(['li', clockTime(n.t) + '  ' + (n.struck ? '(struck) ' : '') + n.text]));
  return L;
}

function summaryMarkdown(s) {
  const out = [];
  summaryLines(s).forEach(row => {
    if (row[0] === 'h1') out.push('# ' + row[1], '');
    else if (row[0] === 'h2') out.push('', '## ' + row[1], '');
    else if (row[0] === 'kv') out.push('- **' + row[1] + ':** ' + row[2]);
    else if (row[0] === 'li') out.push('- ' + row[1]);
    else if (row[0] === 'warn') out.push('> ' + row[1], '');
    else out.push(row[1], '');
  });
  out.push('', 'Generated by WATCHFIRE v' + VERSION + '. Observed by one radio during one session, and not a survey of the mesh.');
  return out.join('\n');
}

/* The printable summary is the same content rendered into a print only region
   of this page. Nothing is opened, fetched or generated elsewhere. */
function printSummary(s) {
  let region = document.getElementById('printregion');
  if (region) region.remove();
  region = el('div', { id: 'printregion' });
  summaryLines(s).forEach(row => {
    if (row[0] === 'h1') region.append(el('h1', null, row[1]));
    else if (row[0] === 'h2') region.append(el('h2', null, row[1]));
    else if (row[0] === 'kv') region.append(el('div', null, el('b', null, row[1] + ': '), row[2]));
    else if (row[0] === 'li') region.append(el('div', { class: 'pli' }, row[1]));
    else if (row[0] === 'warn') region.append(el('div', { class: 'pwarn' }, row[1]));
    else region.append(el('p', null, row[1]));
  });
  region.append(el('p', { class: 'pfoot' },
    'Generated by WATCHFIRE v' + VERSION + '. Observed by one radio during one session, and not a survey of the mesh.'));
  document.body.append(region);
  document.documentElement.classList.add('printing');
  const done = () => {
    document.documentElement.classList.remove('printing');
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  if (window.print) window.print();
  setTimeout(done, 1500);
}

/* ==========================================================================
   WATCHFIRE :: self test
   The same assertions run from the button in the masthead and from the
   headless harness. Anything that has to be true before a release is here.
   ========================================================================== */

async function runSelfTest(report) {
  const results = [];
  let pass = 0, fail = 0;
  const say = (group, name, ok, detail) => {
    results.push({ group: group, name: name, ok: ok, detail: detail || '' });
    if (ok) pass++; else fail++;
    if (report) report(results[results.length - 1]);
  };
  const t = (group, name, fn) => {
    try { const d = fn(); say(group, name, true, d); }
    catch (e) { say(group, name, false, e && e.message ? e.message : String(e)); }
  };
  const ta = async (group, name, fn) => {
