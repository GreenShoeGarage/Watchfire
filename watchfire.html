/* ---- connection plumbing shared by LINK and SIMULATOR ---- */
/* A bluetooth link will drop. That is not an exceptional condition, it is
   Tuesday, so it is handled rather than reported and abandoned. Backoff is
   capped and attempts are finite: an instrument that reconnects forever in a
   background tab is a battery bug. */
/* The first step is not 1 s. After a disconnect the radio needs a moment to
   start advertising again, and asking too early just burns a connect timeout. */
const RECONNECT_BACKOFF_MS = [3000, 5000, 8000, 15000, 15000, 30000, 30000];
const RECONNECT = { enabled: true, attempt: 0, timer: null, deliberate: false, lastError: '' };

function cancelReconnect() {
  if (RECONNECT.timer) clearTimeout(RECONNECT.timer);
  RECONNECT.timer = null;
  RECONNECT.attempt = 0;
}

function scheduleReconnect(reason) {
  if (!RECONNECT.enabled || RECONNECT.deliberate) return false;
  const t = APP.transport;
  if (!t || t.kind !== 'ble' || !t.device) return false;
  if (RECONNECT.attempt >= RECONNECT_BACKOFF_MS.length) {
    toast('Gave up reconnecting after ' + RECONNECT.attempt + ' attempts.', 'bad');
    return false;
  }
  const wait = RECONNECT_BACKOFF_MS[RECONNECT.attempt];
  RECONNECT.attempt++;
  RECONNECT.lastError = reason || '';
  const device = t.device;
  const enableLog = !!t.enableLog;
  RECONNECT.timer = setTimeout(async () => {
    RECONNECT.timer = null;
    if (RECONNECT.deliberate) return;
    try {
      /* Same device object, so no chooser and no user gesture is needed. The
         browser already holds permission for this one. */
      await beginSession(new BleTransport(device, { enableLog: enableLog }), { reconnecting: true });
    } catch (err) {
      scheduleReconnect((err && err.message) ? err.message : String(err));
      paint();
    }
  }, wait);
  toast('Link lost. Reconnecting in ' + (wait / 1000) + ' s, attempt ' + RECONNECT.attempt + '.');
  return true;
}

let wireSampler = null;
let wireLast = { bytesIn: 0, frames: 0, strayBytes: 0, resyncs: 0, oversize: 0 };

function startWireSampler(session) {
  stopWireSampler();
  APP.wire = [];
  wireLast = { bytesIn: 0, frames: 0, strayBytes: 0, resyncs: 0, oversize: 0 };
  wireSampler = setInterval(() => {
    if (!session.deframer) return;
    const s = session.deframer.stats;
    const d = {
      bytesIn: s.bytesIn - wireLast.bytesIn, frames: s.frames - wireLast.frames,
      strayBytes: s.strayBytes - wireLast.strayBytes, resyncs: s.resyncs - wireLast.resyncs,
      oversize: s.oversize - wireLast.oversize
    };
    wireLast = { bytesIn: s.bytesIn, frames: s.frames, strayBytes: s.strayBytes, resyncs: s.resyncs, oversize: s.oversize };
    let kind = '';
    if (d.oversize > 0) kind = 'o';
    else if (d.resyncs > 0) kind = 'r';
    else if (d.frames > 0) kind = 'f';
    else if (d.strayBytes > 0) kind = 's';
    APP.wire.push({ bytes: d.bytesIn, kind: kind });
    if (APP.wire.length > APP.wireCap) APP.wire.shift();
    paintWire();
  }, 250);
}

function stopWireSampler() { if (wireSampler) clearInterval(wireSampler); wireSampler = null; }

function paintWire() {
  const w = document.getElementById('wire');
  if (!w) return;
  clear(w);
  const any = APP.wire.some(s => s.bytes > 0);
  if (!any) { w.append(el('span', { class: 'idle' }, 'the lane is quiet')); return; }
  APP.wire.forEach(s => {
    const h = s.bytes === 0 ? 2 : Math.min(52, 4 + Math.log2(s.bytes + 1) * 7);
    const bar = el('i', { class: s.kind });
    bar.style.height = h.toFixed(0) + 'px';
    w.append(bar);
  });
}

function wireSession(session) {
  session.on('state', (s) => {
    const overAir = APP.transport && APP.transport.kind === 'ble';
    const map = { idle: 'no radio', opening: overAir ? 'connecting' : 'opening port', handshake: 'reading config', ready: 'ready', closed: 'closed', error: 'fault' };
    setStatus(s.state, map[s.state] || s.state);
    if (s.state === 'ready') toast('Radio ready. ' + session.nodes.size + ' nodes, ' + session.channels.filter(Boolean).length + ' channels, ' + session.config.size + ' config sections read.', 'ok');
    if (s.state === 'error') toast(s.detail || 'link fault', 'bad');
    if (s.state === 'ready') { cancelReconnect(); }
    if (s.state === 'closed' && s.detail) {
      if (!scheduleReconnect(s.detail)) toast('Link closed: ' + s.detail);
    }
    if (s.state === 'error' && APP.transport && APP.transport.kind === 'ble') scheduleReconnect(s.detail);
    paint();
  });
  session.on('node', schedulePaint);
  session.on('packet', schedulePaint);
  session.on('debug', schedulePaint);
  session.on('config', schedulePaint);
  session.on('channel', schedulePaint);
  session.on('message', (m) => { if (m.dir === 'in' && !APP.muted) beep(880, 0.05); schedulePaint(); });
  session.on('ack', schedulePaint);
  session.on('route', schedulePaint);
  session.on('neighbors', schedulePaint);
  session.on('telemetrysample', schedulePaint);
  session.on('capture', schedulePaint);
  session.on('notice', (n) => toast(n.message || 'notice from the radio'));
}

async function connectSerial() {
  if (!SerialTransport.supported) {
    showDialog('Web Serial is not available', el('div', null,
      el('p', null, 'This browser does not expose navigator.serial, so WATCHFIRE cannot reach a radio here. Chromium based browsers on desktop do: Chrome, Edge, Brave, Arc, Opera.'),
      el('p', null, 'Everything except the serial link still works, including the whole simulator, so you can exercise the instrument in any browser.')
    ), [{ label: 'Use the simulator', primary: true, action: () => { go('simulator'); } }, { label: 'Close' }]);
    return;
  }
  let port;
  try {
    port = await navigator.serial.requestPort();
  } catch (e) {
    toast('No port chosen.');
    return;
  }
  const baud = parseInt(($('#baud') && $('#baud').value) || '115200', 10);
  await beginSession(new SerialTransport(port, baud));
}

async function beginSession(transport, opts) {
  opts = opts || {};
  RECONNECT.deliberate = false;
  if (!opts.reconnecting) cancelReconnect();
  if (APP.session && APP.session.state === 'ready') { try { await APP.session.disconnect(); } catch (e) {} }
  const s = new RadioSession();
  APP.session = s;
  APP.transport = transport;
  wireSession(s);
  startWireSampler(s);
  try {
    await s.connect(transport);
  } catch (err) {
    s.setState('error', err && err.message ? err.message : String(err));
    toast('Could not open the link: ' + (err && err.message ? err.message : err), 'bad');
  }
  paint();
}

async function endSession() {
  RECONNECT.deliberate = true;
  cancelReconnect();
  stopWireSampler();
  if (APP.session) await APP.session.disconnect();
  paint();
}

/* ==========================  01 LINK  ================================== */
function stationLink() {
  const s = APP.session;
  const wrap = stationHead('01 :: Link',
    'The port, the frame reader and the debug lane. Nothing else in this instrument works until this is boring and reliable, so it is the first thing you see and the first thing that tells you the truth.');

  /* connect controls */
  const p0 = panel('Connection');
  const connected = s && (s.state === 'ready' || s.state === 'handshake' || s.state === 'opening');
  if (s && (s.state === 'opening' || s.state === 'handshake')) {
    const waited = s.startedAt ? Math.round((Date.now() - s.startedAt) / 1000) : 0;
    p0.inner.append(el('div', { class: 'warnbox' },
      (s.state === 'opening' ? 'Opening the link' : 'Reading config') + ', ' + waited + ' s so far.' +
      (APP.transport && APP.transport.kind === 'ble'
        ? ' A bluetooth connect is given ' + (BLE_CONNECT_TIMEOUT_MS / 1000) + ' s before it is cancelled, because it will otherwise wait forever for a radio that is not advertising.'
        : ''),
      el('div', { class: 'row', style: 'margin-top:8px' },
        el('button', { class: 'btn', onclick: endSession }, 'Give up on this attempt'))));
    setTimeout(() => { if (APP.station === 'link') schedulePaint(); }, 1000);
  }
  p0.inner.append(el('div', { class: 'row' },
    el('button', { class: 'btn primary', disabled: connected, onclick: connectSerial }, 'Choose a serial port'),
    el('label', { class: 'field', style: 'width:150px;margin:0' }, el('span', null, 'Baud'),
      el('select', { id: 'baud' }, ['115200', '921600', '57600', '38400', '9600'].map(b => el('option', { value: b, selected: b === '115200' }, b)))),
    el('button', {
      class: 'btn', disabled: connected, onclick: async () => {
        if (!BleTransport.supported) {
          showDialog('Web Bluetooth is not available', el('div', null,
            el('p', null, 'This browser does not expose navigator.bluetooth. Chromium based browsers do, though some ship it switched off: Brave hides it behind brave://flags, Opera does not ship it on desktop, and some Linux builds gate it behind chrome://flags/#enable-experimental-web-platform-features.'),
            el('p', null, 'A file:// page is fine for bluetooth, same as it is for serial. The origin is not the problem.')
          ), [{ label: 'Close', primary: true }]);
          return;
        }
        try {
          const t = await BleTransport.request({ enableLog: APP.bleLog });
          await beginSession(t);
        } catch (err) {
          const msg = (err && err.message) ? err.message : String(err);
          if (/User cancelled|chooser/i.test(msg)) { toast('No radio chosen.'); return; }
          toast('Bluetooth: ' + msg, 'bad');
        }
      }
    }, 'Connect over bluetooth'),
    el('button', { class: 'btn', disabled: connected, onclick: () => beginSession(new SimTransport({ faults: APP.simFaults })) }, 'Start the simulator'),
    el('button', { class: 'btn danger', disabled: !connected, onclick: endSession }, 'Disconnect')
  ));
  if (!SerialTransport.supported) {
    p0.inner.append(el('div', { class: 'warnbox' }, 'Web Serial is not available in this browser, so only the simulator can run here. Chromium based desktop browsers expose it. A file:// page is a secure context, so no server is needed.'));
  }
  if (APP.transport && (APP.transport.kind === 'sim' || APP.transport.kind === 'simble')) {
    p0.inner.append(el('div', { class: 'warnbox' }, 'You are talking to the simulator, not a radio. Everything below is synthetic. Station 12 controls what it does to you.'));
  }
  if (RECONNECT.timer) {
    p0.inner.append(el('div', { class: 'warnbox' },
      'Reconnecting, attempt ' + RECONNECT.attempt + ' of ' + RECONNECT_BACKOFF_MS.length + '.' +
      (RECONNECT.lastError ? ' Last close: ' + RECONNECT.lastError : ''),
      el('div', { class: 'row', style: 'margin-top:8px' },
        el('button', { class: 'btn', onclick: () => { cancelReconnect(); paint(); } }, 'Stop trying'))));
  }
  if (APP.transport && APP.transport.kind === 'ble') {
    p0.inner.append(el('div', { class: 'okbox' },
      'Connected over bluetooth. The radio drops a client that goes quiet, so the keepalive runs every ' + (BLE_HEARTBEAT_MS / 1000) + ' s here rather than the ' + (HEARTBEAT_MS / 1000) + ' s a serial link needs. If the link drops anyway, reconnecting is manual in this release.'));
  }
  wrap.append(p0);

  /* the wire, or an honest account of why there is not one */
  const isBle = APP.transport && APP.transport.kind === 'ble';
  if (isBle) {
    const b = APP.transport.stats;
    const p1 = panel('The lane', 'bluetooth, no wire to watch');
    p1.inner.append(el('div', { class: 'warnbox' },
      'Over bluetooth there is no lane of bytes to show you. GATT delivers whole messages, so there is no framing to watch, nothing to resync, and no stray bytes to route. The wire display would have to invent something to draw, so it does not appear.'));
    p1.inner.append(el('div', { class: 'tally' },
      el('div', { class: 'ok' }, el('b', null, String(b.messages)), el('span', null, 'messages in')),
      el('div', null, el('b', null, String(b.reads)), el('span', null, 'gatt reads')),
      el('div', null, el('b', null, String(b.notifies)), el('span', null, 'notifies')),
      el('div', null, el('b', null, String(b.empties)), el('span', null, 'empty reads')),
      el('div', null, el('b', null, String(b.writes)), el('span', null, 'messages out')),
      el('div', null, el('b', null, String(b.logLines)), el('span', null, 'log lines'))));
    p1.inner.append(el('p', { class: 'note' },
      'A notify on FromNum says something is waiting but not how much, so FromRadio is read until it comes back empty. Those empty reads are the end of each drain and are counted rather than hidden. FromRadio is never subscribed to: firmware carries an explicit warning that adding notify to it breaks compatibility.'));
    wrap.append(p1);

    /* The link timeline. If the link keeps closing early, this is the panel
       that says what it was doing when it went, rather than leaving you to
       guess between an idle timeout, a busy link and a refused bond. */
    const p1b = panel('Link timeline', APP.transport.events.length + ' events');
    const con = el('div', { class: 'console' });
    APP.transport.events.slice(-40).forEach(ev => {
      con.append(el('div', null,
        el('span', { class: 't' }, (ev.at / 1000).toFixed(1) + ' s'),
        el('span', { class: 'tagline ' + (ev.kind === 'drop' || ev.kind === 'error' ? 'bad' : ev.kind === 'write' ? 'tx' : '') }, ev.kind),
        ' ' + ev.detail));
    });
    if (!APP.transport.events.length) con.append(el('div', { class: 't' }, 'nothing yet'));
    p1b.inner.append(con);
    p1b.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
      el('label', { class: 'check' },
        el('input', {
          type: 'checkbox', checked: !!APP.bleLog,
          onchange: e => { APP.bleLog = e.target.checked; toast('Applies on the next connection.'); }
        }), 'Listen to the log characteristic'),
      el('label', { class: 'check' },
        el('input', {
          type: 'checkbox', checked: RECONNECT.enabled,
          onchange: e => { RECONNECT.enabled = e.target.checked; if (!e.target.checked) cancelReconnect(); }
        }), 'Reconnect automatically')));
    p1b.inner.append(el('p', { class: 'note' },
      'The log characteristic notifies a line at a time while the drain loop is also reading. On a link negotiated for low power that is enough traffic to miss the six second supervision window, so it is off unless you ask for it. If the link survives with it off and dies with it on, that is your answer.'));
    wrap.append(p1b);
  } else {
    const p1 = panel('The wire', s ? (APP.transport && APP.transport.kind === 'sim' ? 'simulated lane' : 'serial lane') : '');
    p1.inner.append(el('div', { class: 'wire', id: 'wire' }, el('span', { class: 'idle' }, 'no link')));
    p1.inner.append(el('p', { class: 'note' },
      'Every 250 ms of the lane, newest at the right. Bar height is bytes. Teal where a frame was found, grey where the bytes were firmware log text, ember where the reader had to resync, red where a length field claimed more than 512 bytes.'));
    const st = s ? s.deframer.stats : { frames: 0, bytesIn: 0, strayBytes: 0, resyncs: 0, oversize: 0 };
    p1.inner.append(el('div', { class: 'tally' },
      el('div', { class: 'ok' }, el('b', null, String(st.frames)), el('span', null, 'good frames')),
      el('div', null, el('b', null, String(st.bytesIn)), el('span', null, 'bytes in')),
      el('div', null, el('b', null, String(st.strayBytes)), el('span', null, 'stray bytes')),
      el('div', { class: st.resyncs ? 'warn' : '' }, el('b', null, String(st.resyncs)), el('span', null, 'resyncs')),
      el('div', { class: st.oversize ? 'bad' : '' }, el('b', null, String(st.oversize)), el('span', null, 'oversize len')),
      el('div', null, el('b', null, s ? String(s.stats.tx) : '0'), el('span', null, 'frames out'))));
    wrap.append(p1);
    setTimeout(paintWire, 0);
  }

  /* identity */
  if (s && (s.myInfo || s.metadata)) {
    const p2 = panel('This radio');
    const kv = el('dl', { class: 'kv' });
    const add = (k, v) => { kv.append(el('dt', null, k), el('dd', null, v)); };
    if (s.myNodeNum !== null) add('node number', nodeIdHex(s.myNodeNum) + '  (' + s.myNodeNum + ')');
    const me = s.nodes.get(s.myNodeNum);
    if (me && me.user) add('name', (me.user.long_name || '') + '  [' + (me.user.short_name || '') + ']');
    if (s.metadata) {
      add('firmware', s.metadata.firmware_version || 'unreported');
      add('hardware', enumName('HardwareModel', s.metadata.hw_model || 0));
      add('role', enumName('Role', s.metadata.role || 0));
      add('radios', [s.metadata.hasWifi && 'wifi', s.metadata.hasBluetooth && 'bluetooth', s.metadata.hasEthernet && 'ethernet', s.metadata.hasPKC && 'PKC'].filter(Boolean).join(', ') || 'none reported');
    }
    if (s.myInfo) {
      if (s.myInfo.pio_env) add('build target', s.myInfo.pio_env);
      if (s.myInfo.reboot_count !== undefined) add('reboots', String(s.myInfo.reboot_count));
    }
    add('session passkey', s.passkeyState === 'none' ? 'not held' : s.passkeyState + ', ' + Math.round(s.passkeyAgeMs / 1000) + ' s old');
    add('heartbeat', s.state === 'ready' ? 'every ' + ((s.framed ? HEARTBEAT_MS : BLE_HEARTBEAT_MS) / 1000) + ' s' : 'not running');
    add('transport', APP.transport ? APP.transport.kind : 'none');
    p2.inner.append(kv);
    wrap.append(p2);
  }

  /* partial understanding */
  if (s && s.partialTypes.size) {
    const p3 = panel('Partially understood messages');
    p3.inner.append(el('div', { class: 'warnbox' },
      'The radio sent fields that are not in this build\u2019s schema tables. Nothing was lost: the bytes are held and would be written back untouched. Anything holding one of these is write blocked until you acknowledge it.'));
    const ul = el('ul');
    Array.from(s.partialTypes).slice(0, 40).forEach(t => ul.append(el('li', { class: 'mono' }, t)));
    p3.inner.append(ul);
    wrap.append(p3);
  }

  /* debug lane */
  const p4 = panel('Debug lane', s ? s.debugLines.length + ' lines' : '');
  const con = el('div', { class: 'console', id: 'debugcon' });
  if (!s || !s.debugLines.length) con.append(el('div', { class: 't' }, 'nothing yet'));
  else s.debugLines.slice(-260).forEach(d => con.append(el('div', null, el('span', { class: 't' }, clockTime(d.t)), d.line)));
  p4.inner.append(con);
  p4.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', disabled: !s, onclick: () => { if (APP.session) { APP.session.debugLines = []; paint(); } } }, 'Clear lane'),
    el('button', { class: 'btn', disabled: !s, onclick: () => downloadText('watchfire-debug-' + stamp() + '.txt', (APP.session.debugLines || []).map(d => absTime(Math.floor(d.t / 1000)) + '  ' + d.line).join('\n')) }, 'Export lane')
  ));
  wrap.append(p4);
  setTimeout(() => { const c = document.getElementById('debugcon'); if (c) c.scrollTop = c.scrollHeight; }, 0);
  return wrap;
}

/* ==========================  02 MUSTER  ================================ */
let musterSort = { key: 'last_heard', dir: -1 };

function stationMuster() {
  const s = APP.session;
  const wrap = stationHead('02 :: Muster',
    'The node roster as the radio reports it. Every row carries when it was last heard and how many hops away it was, because a name with no evidence behind it is not information.');
  if (!s || !s.nodes.size) {
    wrap.append(panelWith(emptyState('No roster', 'Connect a radio or start the simulator from station 01.')));
    return wrap;
  }
  const me = s.nodes.get(s.myNodeNum);
  const home = me ? posLatLon(me.position) : null;

  const rows = Array.from(s.nodes.values()).map(n => {
    const p = posLatLon(n.position);
    return {
      n: n,
      num: n.num,
      short: (n.user && n.user.short_name) || '',
      long: (n.user && n.user.long_name) || nodeIdHex(n.num),
      role: n.user ? enumName('Role', n.user.role || 0) : '',
      hw: n.user ? enumName('HardwareModel', n.user.hw_model || 0) : '',
      last_heard: n.last_heard || 0,
      hops: n.hops_away === undefined ? null : n.hops_away,
      snr: n.snr === undefined ? null : n.snr,
      batt: n.device_metrics ? n.device_metrics.battery_level : null,
      volt: n.device_metrics ? n.device_metrics.voltage : null,
      km: (home && p) ? haversineKm(home.lat, home.lon, p.lat, p.lon) : null,
      brg: (home && p) ? bearingDeg(home.lat, home.lon, p.lat, p.lon) : null,
      pos: p
    };
  });
  rows.sort((a, b) => {
    const k = musterSort.key;
    const av = a[k], bv = b[k];
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * musterSort.dir;
    return (av - bv) * musterSort.dir;
  });

  const p = panel('Roster', rows.length + ' nodes');
  const table = el('table');
  const cols = [
    ['short', 'Short'], ['long', 'Node'], ['role', 'Role'], ['last_heard', 'Heard'],
    ['hops', 'Hops'], ['snr', 'SNR'], ['batt', 'Batt'], ['km', 'Range'], ['hw', 'Hardware']
  ];
  const thead = el('thead'), htr = el('tr');
  cols.forEach(c => htr.append(el('th', null, el('button', {
    onclick: () => { if (musterSort.key === c[0]) musterSort.dir *= -1; else { musterSort.key = c[0]; musterSort.dir = c[0] === 'short' || c[0] === 'long' ? 1 : -1; } paint(); }
  }, c[1] + (musterSort.key === c[0] ? (musterSort.dir > 0 ? ' \u2191' : ' \u2193') : '')))));
  thead.append(htr);
  const tbody = el('tbody');
  const now = Math.floor(Date.now() / 1000);
  rows.forEach(r => {
    const stale = r.last_heard && (now - r.last_heard) > 3600;
    const tr = el('tr', { data: { stale: stale ? '1' : '0' } },
      el('td', { class: 'mono' }, r.short || '-'),
      el('td', null, el('div', null, r.long), el('div', { class: 'mono', style: 'color:var(--faint);font-size:11px' }, nodeIdHex(r.num) + (r.num === s.myNodeNum ? '  (this radio)' : ''))),
      el('td', null, r.role),
      el('td', { class: 'num', title: absTime(r.last_heard) }, relTime(r.last_heard)),
      el('td', { class: 'num' }, r.hops === null ? '-' : String(r.hops)),
      el('td', { class: 'num' }, r.snr === null ? '-' : r.snr.toFixed(2) + ' dB'),
      el('td', { class: 'num' }, r.batt === null ? '-' : (r.batt > 100 ? 'ext' : r.batt + ' %') + (r.volt ? ' / ' + r.volt.toFixed(2) + ' V' : '')),
      el('td', { class: 'num' }, r.km === null ? '-' : r.km.toFixed(2) + ' km ' + Math.round(r.brg) + '\u00b0'),
      el('td', { style: 'color:var(--faint)' }, r.hw)
    );
    tbody.append(tr);
  });
  table.append(thead, tbody);
  p.inner.append(el('div', { class: 'scroll' }, table));
  p.inner.append(el('p', { class: 'note' },
    home ? 'Range and bearing are computed from this radio\u2019s own reported position. A node with no position reported shows no range rather than a zero.'
         : 'This radio has not reported a position, so no ranges can be computed. Nothing is estimated in its place.'));
  p.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-roster-' + stamp() + '.csv', rosterCsv(rows)) }, 'Export roster CSV'),
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-roster-' + stamp() + '.json', JSON.stringify(rows.map(r => scrub(r.n)), null, 2)) }, 'Export roster JSON')
  ));
  wrap.append(p);
  return wrap;
}

function rosterCsv(rows) {
  const head = ['node_id', 'num', 'short_name', 'long_name', 'role', 'hardware', 'last_heard_utc', 'seconds_ago', 'hops_away', 'snr_db', 'battery_pct', 'voltage', 'lat', 'lon', 'range_km', 'bearing_deg'];
  const now = Math.floor(Date.now() / 1000);
  const lines = [head.join(',')];
  rows.forEach(r => {
    lines.push([
      nodeIdHex(r.num), r.num, csv(r.short), csv(r.long), csv(r.role), csv(r.hw),
      absTime(r.last_heard), r.last_heard ? now - r.last_heard : '',
      r.hops === null ? '' : r.hops, r.snr === null ? '' : r.snr,
      r.batt === null ? '' : r.batt, r.volt === null || r.volt === undefined ? '' : r.volt,
      r.pos ? r.pos.lat.toFixed(7) : '', r.pos ? r.pos.lon.toFixed(7) : '',
      r.km === null ? '' : r.km.toFixed(3), r.brg === null ? '' : r.brg.toFixed(1)
    ].join(','));
  });
  return lines.join('\n');
}
function csv(v) { const s = String(v === undefined || v === null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function panelWith(node) { const p = panel('-'); p.inner.append(node); return p; }

/* ==========================  03 TRAFFIC  =============================== */
function stationTraffic() {
  const s = APP.session;
  const wrap = stationHead('03 :: Traffic',
    'The flight recorder. Every frame in and out, decoded by port, with the raw bytes one click away. If a station above disagrees with this table, this table is right.');
  if (!s) { wrap.append(panelWith(emptyState('No link', 'Connect a radio or start the simulator from station 01.'))); return wrap; }

  const f = APP.filters;
  const ports = Array.from(new Set(s.packets.map(p => p.port))).sort();
  const nodes = Array.from(new Set(s.packets.map(p => p.packet.from).filter(v => v !== undefined)));

  const fp = panel('Filter', s.packets.length + ' packets held');
  fp.inner.append(el('div', { class: 'row' },
    el('label', { class: 'field', style: 'width:190px;margin:0' }, el('span', null, 'Port'),
      el('select', { onchange: e => { f.port = e.target.value; paint(); } },
        el('option', { value: '', selected: f.port === '' }, 'all ports'),
        ports.map(p => el('option', { value: p, selected: f.port === p }, p)))),
    el('label', { class: 'field', style: 'width:190px;margin:0' }, el('span', null, 'Node'),
      el('select', { onchange: e => { f.node = e.target.value; paint(); } },
        el('option', { value: '', selected: f.node === '' }, 'any node'),
        nodes.map(n => el('option', { value: String(n), selected: f.node === String(n) }, nodeLabel(s, n))))),
    el('label', { class: 'field', style: 'width:150px;margin:0' }, el('span', null, 'Direction'),
      el('select', { onchange: e => { f.dir = e.target.value; paint(); } },
        [['', 'both'], ['rx', 'received'], ['tx', 'sent']].map(o => el('option', { value: o[0], selected: f.dir === o[0] }, o[1])))),
    el('label', { class: 'field', style: 'flex:1;min-width:180px;margin:0' }, el('span', null, 'Text contains'),
      el('input', { type: 'search', value: f.text, oninput: e => { f.text = e.target.value; schedulePaint(); } }))
  ));
  wrap.append(fp);

  const list = s.packets.filter(p => {
    if (f.port && p.port !== f.port) return false;
    if (f.dir && p.dir !== f.dir) return false;
    if (f.node && String(p.packet.from) !== f.node && String(p.packet.to) !== f.node) return false;
    if (f.text) {
      const hay = (typeof p.decodedPayload === 'string' ? p.decodedPayload : JSON.stringify(scrub(p.decodedPayload || {}))) + ' ' + p.port;
      if (hay.toLowerCase().indexOf(f.text.toLowerCase()) < 0) return false;
    }
    return true;
  });

  const p = panel('Packets', list.length + ' shown, newest last');
  const table = el('table');
  table.append(el('thead', null, el('tr', null,
    ['Time', 'Dir', 'From', 'To', 'Ch', 'Port', 'Summary', 'Hops', 'SNR'].map(h => el('th', null, h)))));
  const tbody = el('tbody');
  list.slice(-400).forEach(entry => {
    const pk = entry.packet;
    const tr = el('tr', {
      style: 'cursor:pointer', onclick: () => { APP.selectedPacket = entry; paint(); }
    },
      el('td', { class: 'mono' }, clockTime(entry.t)),
      el('td', null, el('span', { class: 'tagline ' + (entry.dir === 'tx' ? 'tx' : '') }, entry.dir)),
      el('td', { class: 'mono' }, nodeLabel(s, pk.from)),
      el('td', { class: 'mono' }, pk.to === BROADCAST_NUM ? 'all' : nodeLabel(s, pk.to)),
      el('td', { class: 'num' }, String(pk.channel || 0)),
      el('td', null, entry.port),
      el('td', null, summarize(entry)),
      el('td', { class: 'num' }, hopsUsed(pk) === null ? '-' : String(hopsUsed(pk))),
      el('td', { class: 'num' }, pk.rx_snr === undefined ? '-' : pk.rx_snr.toFixed(2))
    );
    if (entry.ack) tr.style.borderLeft = '2px solid ' + (entry.ack.ok ? 'var(--signal)' : 'var(--alarm)');
    tbody.append(tr);
  });
  table.append(tbody);
  p.inner.append(el('div', { class: 'scroll' }, table));
  p.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-traffic-' + stamp() + '.json', JSON.stringify(list.map(packetRecord), null, 2)) }, 'Export shown as JSON'),
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-traffic-' + stamp() + '.csv', trafficCsv(s, list)) }, 'Export shown as CSV'),
    el('button', { class: 'btn danger', onclick: () => { s.packets = []; APP.selectedPacket = null; paint(); } }, 'Clear log')
  ));
  wrap.append(p);

  if (APP.selectedPacket) wrap.append(inspector(s, APP.selectedPacket));
  return wrap;
}

function nodeLabel(s, num) {
  if (num === undefined || num === null) return '-';
  if (num === BROADCAST_NUM) return 'all';
  const n = s.nodes.get(num);
  if (n && n.user && n.user.short_name) return n.user.short_name;
  return nodeIdHex(num);
}

function summarize(entry) {
  const pk = entry.packet;
  if (!pk.decoded) return 'encrypted, ' + ((pk.encrypted && pk.encrypted.length) || 0) + ' bytes on channel ' + (pk.channel || 0);
  const d = entry.decodedPayload;
  const P = ENUMS.PortNum.byName;
  switch (pk.decoded.portnum) {
    case P.TEXT_MESSAGE_APP: return typeof d === 'string' ? d.slice(0, 90) : '';
    case P.POSITION_APP: { const ll = posLatLon(d); return ll ? ll.lat.toFixed(5) + ', ' + ll.lon.toFixed(5) : 'position, no fix'; }
    case P.NODEINFO_APP: return d ? (d.long_name || '') + ' [' + (d.short_name || '') + ']' : '';
    case P.TELEMETRY_APP: {
      if (!d) return '';
      if (d.device_metrics) return 'batt ' + (d.device_metrics.battery_level || 0) + ' %, chan util ' + fmtNum(d.device_metrics.channel_utilization) + ' %';
      if (d.environment_metrics) return 'temp ' + fmtNum(d.environment_metrics.temperature) + ' C, RH ' + fmtNum(d.environment_metrics.relative_humidity) + ' %';
      return 'telemetry';
    }
    case P.ROUTING_APP: {
      if (!d) return 'routing';
      if (d.error_reason !== undefined) return (d.error_reason === 0 ? 'ack' : 'nak ' + enumName('RoutingError', d.error_reason)) + ' for ' + (pk.decoded.request_id ? '0x' + pk.decoded.request_id.toString(16) : '?');
      return 'route ' + (d.route ? d.route.length + ' hops' : 'discovery');
    }
    case P.ADMIN_APP: return 'admin: ' + (d ? (d.$payload_variant || 'passkey only') : 'unreadable');
    case P.TRACEROUTE_APP: return d && d.route ? 'route via ' + d.route.length + ' node(s)' : 'traceroute';
    case P.NEIGHBORINFO_APP: return d && d.neighbors ? d.neighbors.length + ' neighbours' : 'neighbour info';
    default: return (pk.decoded.payload && pk.decoded.payload.length ? pk.decoded.payload.length + ' bytes, not decoded' : '');
  }
}

function fmtNum(v) { return v === undefined || v === null ? '-' : (Math.round(v * 100) / 100).toString(); }

function trafficCsv(s, list) {
  const lines = ['time_utc,direction,from,to,channel,port,packet_id,hops_used,snr_db,rssi_dbm,summary'];
  list.forEach(e => {
    const pk = e.packet;
    lines.push([absTime(Math.floor(e.t / 1000)), e.dir, nodeIdHex(pk.from || 0), pk.to === BROADCAST_NUM ? 'broadcast' : nodeIdHex(pk.to || 0),
      pk.channel || 0, e.port, pk.id ? '0x' + pk.id.toString(16) : '', hopsUsed(pk) === null ? '' : hopsUsed(pk),
      pk.rx_snr === undefined ? '' : pk.rx_snr, pk.rx_rssi === undefined ? '' : pk.rx_rssi, csv(summarize(e))].join(','));
  });
  return lines.join('\n');
}

function packetRecord(e) {
  return {
    time_utc: absTime(Math.floor(e.t / 1000)), direction: e.dir, port: e.port,
    packet: scrub(e.packet), decoded_payload: scrub(e.decodedPayload), ack: e.ack || null, note: e.note || ''
  };
}

/* Turn a decoded message into something JSON can carry: bytes become hex,
   internal markers become plain keys, nothing is invented. */
function scrub(v) {
  if (v === null || v === undefined) return v;
  if (v instanceof Uint8Array) return { $bytes: bytesToHex(v) };
  if (Array.isArray(v)) return v.map(scrub);
  if (typeof v === 'object') {
    const out = {};
    for (const k in v) {
      if (k === '$unknown') { if (v[k].length) out.unknown_fields = v[k].map(u => ({ field: u.num, wire: u.wire, hex: bytesToHex(u.raw) })); continue; }
      if (k === '$partial') { if (v[k]) out.partially_understood = true; continue; }
      if (k.charAt(0) === '$') continue;
      out[k] = scrub(v[k]);
    }
    return out;
  }
  return v;
}

function inspector(s, entry) {
  const pk = entry.packet;
  const p = panel('Inspector', entry.port + '  id ' + (pk.id ? '0x' + pk.id.toString(16) : 'none'));
  const kv = el('dl', { class: 'kv' });
  const add = (k, v) => kv.append(el('dt', null, k), el('dd', null, v));
  add('time', absTime(Math.floor(entry.t / 1000)));
  add('from', nodeIdHex(pk.from || 0) + '  ' + nodeLabel(s, pk.from));
  add('to', pk.to === BROADCAST_NUM ? 'broadcast' : nodeIdHex(pk.to || 0) + '  ' + nodeLabel(s, pk.to));
  add('channel', String(pk.channel || 0));
  if (pk.hop_start !== undefined && pk.hop_limit !== undefined) add('hops', 'started ' + pk.hop_start + ', ' + pk.hop_limit + ' left, ' + (hopsUsed(pk) === null ? '?' : hopsUsed(pk)) + ' used');
  if (pk.rx_snr !== undefined) add('rx snr', pk.rx_snr.toFixed(2) + ' dB');
  if (pk.rx_rssi !== undefined) add('rx rssi', pk.rx_rssi + ' dBm');
  if (pk.via_mqtt) add('via mqtt', 'yes');
  if (pk.want_ack) add('want ack', 'yes');
  if (entry.ack) add('answer', (entry.ack.ok ? 'ack' : 'nak: ' + entry.ack.errorName) + (entry.ack.implicit ? ', implicit from ' + nodeLabel(s, entry.ack.from) : ''));
  if (entry.note) add('note', entry.note);
  p.inner.append(kv);

  if (entry.decodedPayload && typeof entry.decodedPayload === 'object') {
    p.inner.append(el('h4', null, 'Fields'));
    p.inner.append(fieldTree(entry.decodedPayload));
  } else if (typeof entry.decodedPayload === 'string') {
    p.inner.append(el('h4', null, 'Text'));
    p.inner.append(el('pre', { class: 'hex' }, entry.decodedPayload));
  }

  if (pk.encrypted && pk.encrypted.length) {
    p.inner.append(el('div', { class: 'warnbox' },
      'This packet arrived encrypted, which means the radio holds no key for channel ' + (pk.channel || 0) + '. If you hold the key, WATCHFIRE can try it locally.'));
    const keyIn = el('input', { type: 'text', placeholder: 'channel PSK, base64 or hex', id: 'pskin' });
    p.inner.append(el('label', { class: 'field' }, el('span', null, 'Key to try'), keyIn));
    const out = el('div');
    p.inner.append(el('button', {
      class: 'btn', onclick: async () => {
        clear(out);
        try {
          const raw = keyIn.value.trim();
          const psk = /^[0-9a-fA-F]+$/.test(raw) && raw.length % 2 === 0 ? hexToBytes(raw) : b64ToBytes(raw);
          const plain = await decryptPayload(psk, pk.id, pk.from, pk.encrypted);
          const data = decode('Data', plain);
          out.append(el('div', { class: 'okbox' }, 'Decrypted as ' + enumName('PortNum', data.portnum || 0) + '.'));
          out.append(fieldTree(data));
        } catch (err) {
          out.append(el('div', { class: 'badbox' }, 'That key did not produce a readable Data message: ' + (err.message || err) + '. A wrong key gives noise, not an error, so this is the honest test.'));
        }
      }
    }, 'Try this key'), out);
  }

  p.inner.append(el('h4', null, 'Raw'));
  const raw = pk.decoded ? (pk.decoded.payload || new Uint8Array(0)) : (pk.encrypted || new Uint8Array(0));
  p.inner.append(el('pre', { class: 'hex' }, hexDump(raw)));
  p.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => { APP.selectedPacket = null; paint(); } }, 'Close inspector')));
  return p;
}

function fieldTree(msg) {
  const root = el('div', { class: 'tree' });
  root.append(build(msg, msg.$type || ''));
  function build(obj, label) {
    const ul = el('ul');
    if (label) ul.append(el('li', null, el('span', { class: 'ty' }, label)));
    for (const k in obj) {
      if (k.charAt(0) === '$') continue;
      const v = obj[k];
      if (v === undefined || v === null) continue;
      if (v instanceof Uint8Array) {
        ul.append(el('li', null, el('span', { class: 'k' }, k), ': ', el('span', { class: 'v mono' }, bytesToHex(v) || '(empty)'), ' ', el('span', { class: 'ty' }, v.length + ' bytes')));
      } else if (Array.isArray(v)) {
        const li = el('li', null, el('span', { class: 'k' }, k), ' ', el('span', { class: 'ty' }, '[' + v.length + ']'));
        v.forEach((item, i) => {
          if (item && item.$type) li.append(build(item, item.$type + ' #' + i));
          else li.append(el('ul', null, el('li', null, el('span', { class: 'v mono' }, String(item)))));
        });
        ul.append(li);
      } else if (typeof v === 'object' && v.$type) {
        const li = el('li', null, el('span', { class: 'k' }, k));
        li.append(build(v, v.$type));
        ul.append(li);
      } else {
        ul.append(el('li', null, el('span', { class: 'k' }, k), ': ', el('span', { class: 'v mono' }, String(v))));
      }
    }
    (obj.$unknown || []).forEach(u => {
      ul.append(el('li', null, el('span', { class: 'unk' }, 'field ' + u.num + ' (wire ' + u.wire + ') not in this build\u2019s tables'), ' ',
        el('span', { class: 'v mono' }, bytesToHex(u.raw))));
    });
    return ul;
  }
  return root;
}

/* ==========================  04 DISPATCH  ============================== */
function stationDispatch() {
  const s = APP.session;
  const wrap = stationHead('04 :: Dispatch',
    'Text out and text in, with the whole delivery chain shown rather than a checkmark that means nothing. An ack from a neighbour is not the same as an ack from the node you addressed, so they are labelled differently.');
  if (!s || s.state !== 'ready') { wrap.append(panelWith(emptyState('No radio ready', 'Dispatch needs a live link. Station 01.'))); return wrap; }

  const send = panel('Send');
  const targets = [el('option', { value: 'broadcast', selected: APP.dispatchTo === 'broadcast' }, 'broadcast to the channel')];
  Array.from(s.nodes.values()).filter(n => n.num !== s.myNodeNum).forEach(n => {
    targets.push(el('option', { value: String(n.num), selected: APP.dispatchTo === String(n.num) },
      ((n.user && n.user.long_name) || nodeIdHex(n.num)) + '  (direct)'));
  });
  const chans = s.channels.filter(c => c && c.role !== 0).map(c =>
    el('option', { value: String(c.index || 0), selected: APP.dispatchChannel === (c.index || 0) },
      (c.index || 0) + ': ' + ((c.settings && c.settings.name) || (c.role === 1 ? 'primary' : 'unnamed'))));

  const text = el('textarea', { rows: '3', id: 'msgtext', placeholder: 'message', maxlength: '200' });
  const counter = el('span', { class: 'tagline' }, '0 / 200 bytes');
  text.addEventListener('input', () => {
    const b = utf8Encode(text.value).length;
    counter.textContent = b + ' / 200 bytes';
    counter.className = 'tagline' + (b > 200 ? ' bad' : b > 160 ? ' warn' : '');
  });

  send.inner.append(el('div', { class: 'row' },
    el('label', { class: 'field', style: 'flex:1;min-width:220px;margin:0' }, el('span', null, 'To'),
      el('select', { onchange: e => { APP.dispatchTo = e.target.value; } }, targets)),
    el('label', { class: 'field', style: 'width:220px;margin:0' }, el('span', null, 'Channel'),
      el('select', { onchange: e => { APP.dispatchChannel = parseInt(e.target.value, 10); } }, chans))
  ));
  send.inner.append(el('label', { class: 'field' }, el('span', null, 'Message'), text));
  send.inner.append(el('div', { class: 'row' },
    el('button', {
      class: 'btn primary', onclick: async () => {
        const body = text.value.trim();
        if (!body) { toast('Nothing to send.'); return; }
        const to = APP.dispatchTo === 'broadcast' ? BROADCAST_NUM : parseInt(APP.dispatchTo, 10);
        try {
          await s.sendText(body, { to: to, channel: APP.dispatchChannel, wantAck: to !== BROADCAST_NUM });
          text.value = ''; counter.textContent = '0 / 200 bytes';
          paint();
        } catch (err) { toast('Send failed: ' + (err.message || err), 'bad'); }
      }
    }, 'Send'),
    counter,
    el('span', { class: 'tagline' }, APP.dispatchTo === 'broadcast' ? 'no ack expected on a broadcast' : 'ack requested')
  ));
  wrap.append(send);

  const thread = panel('Thread', s.messages.length + ' messages this session');
  const box = el('div', { class: 'thread', id: 'thread' });
  if (!s.messages.length) box.append(emptyState('Nothing yet', 'Sent and received text will appear here with its delivery evidence.'));
  s.messages.slice(-120).forEach(m => {
    const item = el('div', { class: 'msg ' + (m.dir === 'out' ? 'out' : '') });
    const meta = el('div', { class: 'meta' },
      el('span', null, m.dir === 'out' ? 'to ' + (m.to === BROADCAST_NUM ? 'all' : nodeLabel(s, m.to)) : 'from ' + nodeLabel(s, m.from)),
      el('span', null, 'ch ' + m.channel),
      el('span', null, clockTime(m.t)));
    item.append(meta, el('div', { class: 'text' }, m.text));
    const ev = el('div', { class: 'evidence' });
    if (m.dir === 'out') {
      const e = m.entry;
      if (!e || !e.ack) ev.append(el('span', { class: 'tagline warn' }, m.to === BROADCAST_NUM ? 'sent, no ack asked for' : 'sent, waiting'));
      else if (e.ack.ok) ev.append(el('span', { class: 'tagline ok' }, e.ack.implicit ? 'implicit ack via ' + nodeLabel(s, e.ack.from) : 'ack from the destination'),
        e.ack.hops !== null && e.ack.hops !== undefined ? el('span', { class: 'tagline' }, e.ack.hops + ' hops back') : null,
        el('span', { class: 'tagline' }, Math.round((e.ack.at - m.t) / 100) / 10 + ' s'));
      else ev.append(el('span', { class: 'tagline bad' }, e.ack.errorName));
    } else {
      if (m.snr !== undefined && m.snr !== null) ev.append(el('span', { class: 'tagline' }, 'snr ' + m.snr.toFixed(2) + ' dB'));
      if (m.rssi !== undefined && m.rssi !== null) ev.append(el('span', { class: 'tagline' }, m.rssi + ' dBm'));
      if (m.hops !== null && m.hops !== undefined) ev.append(el('span', { class: 'tagline' }, m.hops + ' hops'));
    }
    item.append(ev);
    box.append(item);
  });
  thread.inner.append(box);
  thread.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => downloadText('watchfire-messages-' + stamp() + '.json', JSON.stringify(s.messages.map(m => ({ time_utc: absTime(Math.floor(m.t / 1000)), dir: m.dir, from: nodeIdHex(m.from || 0), to: m.to === BROADCAST_NUM ? 'broadcast' : nodeIdHex(m.to || 0), channel: m.channel, text: m.text, ack: m.entry && m.entry.ack ? m.entry.ack : null })), null, 2)) }, 'Export thread')));
  wrap.append(thread);
  setTimeout(() => { const t = document.getElementById('thread'); if (t) t.scrollTop = t.scrollHeight; }, 0);
  return wrap;
}

/* ---- download helper ---- */
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Wrote ' + filename, 'ok');
}

function stamp() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' +
    String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
}

/* ==========================================================================
   WATCHFIRE :: stations 05, 06, 12 and the roadmap stubs
   The rule both write stations share: back up, diff, then write. Never the
   other order, and never at all if the message holds a field this build
   could not read.
   ========================================================================== */

function cloneMsg(v) {
  if (v === null || v === undefined) return v;
  if (v instanceof Uint8Array) return v.slice();
  if (Array.isArray(v)) return v.map(cloneMsg);
  if (typeof v === 'object') {
    const out = {};
    for (const k in v) out[k] = k === '$unknown' ? v[k].map(u => ({ num: u.num, wire: u.wire, raw: u.raw.slice() })) : cloneMsg(v[k]);
    return out;
  }
  return v;
}

/* Flatten a decoded message to path -> printable value, for diffing. */
function flatten(msg, prefix, out) {
  out = out || {};
  prefix = prefix || '';
  for (const k in msg) {
    if (k.charAt(0) === '$') continue;
    const v = msg[k];
    if (v === undefined || v === null) continue;
    const path = prefix ? prefix + '.' + k : k;
    if (v instanceof Uint8Array) out[path] = bytesToHex(v) || '(empty)';
    else if (Array.isArray(v)) out[path] = v.map(x => (x && x.$type) ? '[msg]' : String(x)).join(', ');
    else if (typeof v === 'object' && v.$type) flatten(v, path, out);
    else out[path] = String(v);
  }
  (msg.$unknown || []).forEach(u => { out[(prefix ? prefix + '.' : '') + 'field#' + u.num] = bytesToHex(u.raw); });
  return out;
}

function diffTable(before, after, labelBefore, labelAfter) {
  const a = flatten(before), b = flatten(after);
  const keys = Array.from(new Set(Object.keys(a).concat(Object.keys(b)))).sort();
  const t = el('table', { class: 'diff' });
  t.append(el('thead', null, el('tr', null, el('th', null, 'Field'), el('th', null, labelBefore || 'on the radio'), el('th', null, labelAfter || 'to be written'))));
  const body = el('tbody');
  let changes = 0;
  keys.forEach(k => {
    const same = a[k] === b[k];
    if (!same) changes++;
    body.append(el('tr', { class: same ? 'same' : '' },
      el('td', { class: 'mono' }, k),
      el('td', { class: same ? '' : 'from' }, a[k] === undefined ? '-' : a[k]),
      el('td', { class: same ? '' : 'to' }, b[k] === undefined ? '-' : b[k])));
  });
  t.append(body);
  return { table: t, changes: changes };
}

/* Build an editor for one message from its schema table. Anything the table
   does not describe is shown but never edited. */
function messageEditor(typeName, obj, onChange) {
  const schema = SCHEMA[typeName];
  const box = el('div');
  if (!schema) { box.append(el('div', { class: 'badbox' }, 'No schema for ' + typeName)); return box; }
  schema.fields.forEach(f => {
    const spec = schema.byNum[f[0]];
    const t = spec.type;
    const cur = obj[spec.name];
    if (spec.opts.rep || t.slice(0, 4) === 'msg:') {
      if (t.slice(0, 4) === 'msg:' && cur && typeof cur === 'object') {
        box.append(el('h4', null, spec.name), messageEditor(t.slice(4), cur, onChange));
      }
      return;
    }
    const id = 'f_' + typeName + '_' + spec.name;
    if (t === 'bool') {
      box.append(el('label', { class: 'check' },
        el('input', { type: 'checkbox', id: id, checked: !!cur, onchange: e => { obj[spec.name] = e.target.checked; onChange(); } }),
        spec.name));
    } else if (t.slice(0, 5) === 'enum:') {
      const e = ENUMS[t.slice(5)];
      const sel = el('select', { id: id, onchange: ev => { obj[spec.name] = parseInt(ev.target.value, 10); onChange(); } });
      const val = cur === undefined ? 0 : cur;
      Object.keys(e ? e.values : {}).forEach(name => {
        sel.append(el('option', { value: String(e.values[name]), selected: e.values[name] === val }, name + '  (' + e.values[name] + ')'));
      });
      if (e && e.byVal[val] === undefined) sel.append(el('option', { value: String(val), selected: true }, val + ' (not a name this build knows)'));
      box.append(el('label', { class: 'field' }, el('span', null, spec.name), sel));
    } else if (t === 'string') {
      box.append(el('label', { class: 'field' }, el('span', null, spec.name),
        el('input', { type: 'text', id: id, value: cur === undefined ? '' : cur, oninput: e => { obj[spec.name] = e.target.value; onChange(); } })));
    } else if (t === 'bytes') {
      box.append(el('label', { class: 'field' }, el('span', null, spec.name + ' (bytes, read only here)'),
        el('input', { type: 'text', value: cur ? bytesToHex(cur) : '', readonly: 'readonly' })));
    } else {
      box.append(el('label', { class: 'field' }, el('span', null, spec.name + numHint(spec.name)),
        el('input', {
          type: 'number', id: id, value: cur === undefined ? '' : cur,
          oninput: e => { const v = e.target.value === '' ? undefined : Number(e.target.value); obj[spec.name] = v; onChange(); }
        })));
    }
  });
  if (obj.$unknown && obj.$unknown.length) {
    box.append(el('div', { class: 'warnbox' },
      obj.$unknown.length + ' field(s) here are not in this build\u2019s tables. They are held byte for byte and would be written back untouched, but this message is write blocked until you acknowledge that.'));
  }
  return box;
}

function numHint(name) {
  if (/_secs$|_seconds$|_interval$|_time$/.test(name)) return ' (seconds)';
  if (/gpio$/.test(name)) return ' (pin)';
  if (/tx_power/.test(name)) return ' (dBm)';
  if (/bandwidth/.test(name)) return ' (kHz code)';
  return '';
}

/* ==========================  05 CHANNELS  ============================== */
function stationChannels() {
  const s = APP.session;
  const wrap = stationHead('05 :: Channels',
    'The channel set as data. Keys can be generated, pasted, shared as a URL or a code, and every write shows you exactly what changes before it happens.');
  if (!s || !s.channels.filter(Boolean).length) {
    wrap.append(panelWith(emptyState('No channel set', 'Connect a radio or start the simulator from station 01.')));
    return wrap;
  }

  const p = panel('Channel set', s.channels.filter(Boolean).length + ' slots');
  const table = el('table');
  table.append(el('thead', null, el('tr', null, ['#', 'Role', 'Name', 'Key', 'Uplink', 'Downlink', ''].map(h => el('th', null, h)))));
  const tb = el('tbody');
  s.channels.forEach((c, i) => {
    if (!c) return;
    const set = c.settings || {};
    tb.append(el('tr', null,
      el('td', { class: 'num' }, String(c.index === undefined ? i : c.index)),
      el('td', null, el('span', { class: 'tagline ' + (c.role === 1 ? 'ok' : c.role === 2 ? '' : '') }, enumName('ChannelRole', c.role || 0))),
      el('td', null, set.name || (c.role === 1 ? '(primary, default name)' : '-')),
      el('td', { class: 'mono' }, keyDescription(set.psk)),
      el('td', null, set.uplink_enabled ? 'yes' : 'no'),
      el('td', null, set.downlink_enabled ? 'yes' : 'no'),
      el('td', null, el('button', { class: 'btn', onclick: () => { APP.channelDraft = cloneMsg(c); paint(); } }, 'Edit'))
    ));
  });
  table.append(tb);
  p.inner.append(el('div', { class: 'scroll' }, table));
  p.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => backupChannels(s) }, 'Back up channel set'),
    el('button', { class: 'btn', onclick: () => shareDialog(s) }, 'Share URL and code'),
    el('button', { class: 'btn', onclick: () => importDialog(s) }, 'Import from URL')
  ));
  wrap.append(p);

  if (APP.channelDraft) {
    const d = APP.channelDraft;
    const idx = d.index || 0;
    const original = s.channels[idx];
    const ep = panel('Editing channel ' + idx);
    if (!d.settings) d.settings = { $type: 'ChannelSettings' };
    const rerender = () => schedulePaint();

    ep.inner.append(el('label', { class: 'field' }, el('span', null, 'Role'),
      el('select', { onchange: e => { d.role = parseInt(e.target.value, 10); rerender(); } },
        [['0', 'DISABLED'], ['1', 'PRIMARY'], ['2', 'SECONDARY']].map(o => el('option', { value: o[0], selected: String(d.role || 0) === o[0] }, o[1])))));
    ep.inner.append(el('label', { class: 'field' }, el('span', null, 'Name'),
      el('input', { type: 'text', value: d.settings.name || '', maxlength: '11', oninput: e => { d.settings.name = e.target.value; rerender(); } })));
    ep.inner.append(el('label', { class: 'field' }, el('span', null, 'Key'),
      el('input', { type: 'text', id: 'pskedit', value: d.settings.psk ? bytesToB64(d.settings.psk) : '', oninput: e => { try { d.settings.psk = b64ToBytes(e.target.value); } catch (err) {} } })));
    ep.inner.append(el('div', { class: 'row' },
      el('button', { class: 'btn', onclick: () => { d.settings.psk = randomBytes(32); paint(); } }, 'Generate 256 bit key'),
      el('button', { class: 'btn', onclick: () => { d.settings.psk = randomBytes(16); paint(); } }, 'Generate 128 bit key'),
      el('button', { class: 'btn', onclick: () => { d.settings.psk = new Uint8Array([1]); paint(); } }, 'Use the default key'),
      el('button', { class: 'btn', onclick: () => { d.settings.psk = new Uint8Array(0); paint(); } }, 'No encryption'),
      el('span', { class: 'tagline' }, keyDescription(d.settings.psk))));
    ep.inner.append(el('div', { class: 'row', style: 'margin-top:8px' },
      el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: !!d.settings.uplink_enabled, onchange: e => { d.settings.uplink_enabled = e.target.checked; rerender(); } }), 'MQTT uplink'),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: !!d.settings.downlink_enabled, onchange: e => { d.settings.downlink_enabled = e.target.checked; rerender(); } }), 'MQTT downlink')));

    const dt = diffTable(original || { $type: 'Channel' }, d);
    ep.inner.append(el('h4', null, 'What would change'), el('div', { class: 'scroll' }, dt.table));
    const blocked = (original && original.$partial) || d.$partial;
    if (blocked) ep.inner.append(el('div', { class: 'badbox' }, 'This channel holds fields WATCHFIRE could not read, so writing it is blocked. The bytes are safe; the write is not.'));
    ep.inner.append(el('div', { class: 'row', style: 'margin-top:12px' },
      el('button', {
        class: 'btn primary', disabled: blocked || dt.changes === 0,
        onclick: () => confirmWrite('channel ' + idx, dt.changes, async () => {
          await backupChannels(s, true);
          await s.writeChannel(d);
          toast('Wrote channel ' + idx + '. Re-read it to confirm the radio agrees.', 'ok');
          APP.channelDraft = null;
          paint();
        })
      }, dt.changes ? 'Write ' + dt.changes + ' change(s)' : 'No changes'),
      el('button', { class: 'btn', onclick: () => { APP.channelDraft = null; paint(); } }, 'Cancel')));
    wrap.append(ep);
  }
  return wrap;
}

function keyDescription(psk) {
  if (!psk || psk.length === 0) return 'none, traffic is in the clear';
  if (psk.length === 1) return psk[0] === 0 ? 'none' : 'default key, variant ' + psk[0];
  return psk.length * 8 + ' bit, ' + bytesToB64(psk).slice(0, 10) + '\u2026';
}

async function backupChannels(s, quiet) {
  const doc = {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'channel-backup',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    firmware: s.metadata ? s.metadata.firmware_version : null,
    channels: s.channels.filter(Boolean).map(scrub)
  };
  downloadText('watchfire-channels-' + stamp() + '.json', JSON.stringify(doc, null, 2));
  if (!quiet) toast('Channel set backed up.', 'ok');
}

function channelSetUrl(s) {
  const set = {
    $type: 'ChannelSet',
    settings: s.channels.filter(c => c && c.role !== 0).map(c => c.settings),
    lora_config: s.config.get('lora') ? s.config.get('lora').lora : undefined
  };
  return 'https://meshtastic.org/e/#' + bytesToB64(encode('ChannelSet', set), true);
}

function shareDialog(s) {
  const url = channelSetUrl(s);
  const body = el('div');
  body.append(el('p', null, 'This URL carries every enabled channel, keys and all, plus the LoRa settings. Treat it as the key material it is.'));
  body.append(el('pre', { class: 'hex' }, url));
  try {
    const holder = el('div', { style: 'text-align:center;padding:12px' });
    holder.append(qrSvg(url, 240));

let codeplugPick = 'lora';

function stationCodeplug() {
  const s = APP.session;
  const wrap = stationHead('06 :: Codeplug',
    'Device and module configuration as inspectable data. Read it, back it up, diff it, then write it. A section holding a field this build cannot read is shown in full and refused for writing.');
  if (!s || !s.config.size) {
    wrap.append(panelWith(emptyState('No configuration read', 'Connect a radio or start the simulator from station 01.')));
    return wrap;
  }

  const nav = panel('Sections');
  const row = el('div', { class: 'row' });
  Array.from(s.config.keys()).forEach(k => {
    row.append(el('button', {
      class: 'btn' + (codeplugPick === k ? ' primary' : ''),
      onclick: () => { codeplugPick = k; APP.configDraft = null; paint(); }
    }, k));
  });
  Array.from(s.moduleConfig.keys()).forEach(k => {
    row.append(el('button', {
      class: 'btn' + (codeplugPick === 'mod:' + k ? ' primary' : ''),
      onclick: () => { codeplugPick = 'mod:' + k; APP.configDraft = null; paint(); }
    }, 'module: ' + k));
  });
  nav.inner.append(row);
  nav.inner.append(el('div', { class: 'row', style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: () => backupCodeplug(s) }, 'Back up whole codeplug'),
    el('button', { class: 'btn', onclick: () => compareBackupDialog(s) }, 'Compare against a backup'),
    el('button', { class: 'btn', onclick: async () => { try { await s.refreshPasskey(); toast('Session passkey refreshed.', 'ok'); } catch (e) { toast('Could not get a passkey: ' + e.message, 'bad'); } paint(); } },
      'Refresh passkey (' + s.passkeyState + ')')
  ));
  wrap.append(nav);

  const isModule = codeplugPick.slice(0, 4) === 'mod:';
  const key = isModule ? codeplugPick.slice(4) : codeplugPick;
  const live = isModule ? s.moduleConfig.get(key) : s.config.get(key);
  if (!live) { wrap.append(panelWith(emptyState('Not read', 'That section has not come back from the radio.'))); return wrap; }

  const innerType = isModule ? SCHEMA.ModuleConfig.byName[key] : SCHEMA.Config.byName[key];
  const typeName = innerType ? innerType.type.slice(4) : null;

  if (!APP.configDraft || APP.configDraft.$key !== codeplugPick) {
    APP.configDraft = cloneMsg(live);
    APP.configDraft.$key = codeplugPick;
  }
  const draft = APP.configDraft;

  const ep = panel(codeplugPick, typeName || '');
  if (typeName && draft[key]) {
    ep.inner.append(messageEditor(typeName, draft[key], () => schedulePaint()));
  } else {
    ep.inner.append(el('div', { class: 'warnbox' }, 'No editor for this section, so it is shown read only.'));
    ep.inner.append(fieldTree(live));
  }
  wrap.append(ep);

  const dt = diffTable(live, draft);
  const dp = panel('What would change', dt.changes + ' field(s) differ');
  dp.inner.append(el('div', { class: 'scroll' }, dt.table));
  const unknowns = unknownReport(live);
  const blocked = live.$partial || draft.$partial || unknowns.length > 0;
  if (blocked) {
    dp.inner.append(el('div', { class: 'badbox' },
      'Write blocked. This section holds ' + unknowns.length + ' field(s) not in this build\u2019s schema tables (' +
      unknowns.map(u => u.path + ' #' + u.num).join(', ') + '). They are preserved exactly and would go back untouched, but WATCHFIRE will not write a section it cannot fully read.'));
  }
  if (s.passkeyState !== 'held' && !blocked) {
    dp.inner.append(el('div', { class: 'warnbox' }, 'No fresh session passkey is held. One will be requested automatically before the write.'));
  }
  dp.inner.append(el('div', { class: 'row', style: 'margin-top:12px' },
    el('button', {
      class: 'btn primary', disabled: blocked || dt.changes === 0 || isModule,
      onclick: () => confirmWrite(codeplugPick + ' config', dt.changes, async () => {
        await backupCodeplug(s, true);
        const toWrite = cloneMsg(draft);
        delete toWrite.$key;
        await s.writeConfig(toWrite);
        toast('Write sent. Watch station 03 for the ack or the NAK.', 'ok');
        paint();
      })
    }, isModule ? 'Module writes are v1.1' : (dt.changes ? 'Write ' + dt.changes + ' change(s)' : 'No changes')),
    el('button', { class: 'btn', onclick: () => { APP.configDraft = null; paint(); } }, 'Discard edits')
  ));
  wrap.append(dp);
  return wrap;
}

function backupCodeplug(s, quiet) {
  const doc = {
    instrument: 'WATCHFIRE', version: VERSION, kind: 'codeplug-backup',
    taken_utc: absTime(Math.floor(Date.now() / 1000)),
    radio: s.myNodeNum ? nodeIdHex(s.myNodeNum) : null,
    firmware: s.metadata ? s.metadata.firmware_version : null,
    proto_provenance: PROTO_PROVENANCE,
    config: {}, module_config: {}, channels: s.channels.filter(Boolean).map(scrub)
  };
  s.config.forEach((v, k) => { doc.config[k] = scrub(v); });
  s.moduleConfig.forEach((v, k) => { doc.module_config[k] = scrub(v); });
  downloadText('watchfire-codeplug-' + stamp() + '.json', JSON.stringify(doc, null, 2));
  if (!quiet) toast('Codeplug backed up.', 'ok');
  return doc;
}

function compareBackupDialog(s) {
  const file = el('input', { type: 'file', accept: '.json' });
  const out = el('div');
  const body = el('div', null,
    el('p', null, 'Load a codeplug backup taken earlier. WATCHFIRE compares it against what the radio is reporting now, field by field. Nothing is written.'),
    file, out);
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      clear(out);
      let doc;
      try { doc = JSON.parse(rd.result); }
      catch (e) { out.append(el('div', { class: 'badbox' }, 'That file is not JSON.')); return; }
      if (!doc || doc.kind !== 'codeplug-backup') { out.append(el('div', { class: 'badbox' }, 'That is not a WATCHFIRE codeplug backup.')); return; }
      out.append(el('div', { class: 'note' }, 'Backup taken ' + doc.taken_utc + ' from ' + (doc.radio || 'an unnamed radio') + ', firmware ' + (doc.firmware || 'unrecorded') + '.'));
      let total = 0;
      Object.keys(doc.config || {}).forEach(k => {
        const live = s.config.get(k);
        if (!live) return;
        const d = diffTable({ $type: 'x', v: doc.config[k] }, { $type: 'x', v: scrub(live) }, 'in the backup', 'on the radio now');
        if (d.changes) {
          total += d.changes;
          out.append(el('h4', null, k + ': ' + d.changes + ' difference(s)'));
          out.append(el('div', { class: 'scroll' }, d.table));
        }
      });
      if (!total) out.append(el('div', { class: 'okbox' }, 'No differences. The radio matches the backup.'));
    };
    rd.readAsText(f);
  });
  showDialog('Compare against a backup', body, [{ label: 'Close', primary: true }]);
}

/* ==========================================================================
   WATCHFIRE :: station 07, AIRTIME
   The arithmetic that turns this from a control panel into an engineering
   instrument. Every constant below was read from source on 2026-08-11 rather
   than recalled, and each one carries the file it came from.
   ========================================================================== */

/* meshtastic/firmware src/mesh/RadioInterface.h
     #define MESHTASTIC_HEADER_LENGTH 16
     uint16_t preambleLength = 16;   (8 is the LoRa default, Meshtastic uses 16)
   meshtastic/firmware src/mesh/RadioLibInterface.h getPacketConfig()
     implicitHeader = false, crcEnabled = true,
     ldrOptimize = (1 << sf) / bw >= 16   ("auto LDRO", symbol time >= 16 ms)
   meshtastic/protobufs mesh.proto
     Constants.DATA_PAYLOAD_LEN = 233 */
const MESH_HEADER_BYTES = 16;
const MESH_PREAMBLE_SYMBOLS = 16;
const MESH_MAX_DATA_PAYLOAD = 233;

/* meshtastic/firmware src/mesh/RadioInterface.cpp, the RDEF region table.
   duty is the permitted transmit duty cycle as a percentage, power is the
   regional limit in dBm, wide marks the 2.4 GHz wide band regions.
   A region absent from this table is unknown to this station rather than
   guessed at. */
const REGIONS = {
  US: { start: 902.0, end: 928.0, duty: 100, power: 30, wide: false },
  EU_433: { start: 433.0, end: 434.0, duty: 10, power: 10, wide: false },
  EU_868: { start: 869.4, end: 869.65, duty: 10, power: 27, wide: false },
  CN: { start: 470.0, end: 510.0, duty: 100, power: 19, wide: false },
  JP: { start: 920.5, end: 923.5, duty: 100, power: 13, wide: false },
  ANZ: { start: 915.0, end: 928.0, duty: 100, power: 30, wide: false },
  ANZ_433: { start: 433.05, end: 434.79, duty: 100, power: 14, wide: false },
  RU: { start: 868.7, end: 869.2, duty: 100, power: 20, wide: false },
  KR: { start: 920.0, end: 923.0, duty: 100, power: 23, wide: false },
  TW: { start: 920.0, end: 925.0, duty: 100, power: 27, wide: false },
  IN: { start: 865.0, end: 867.0, duty: 100, power: 30, wide: false },
  NZ_865: { start: 864.0, end: 868.0, duty: 100, power: 36, wide: false },
  TH: { start: 920.0, end: 925.0, duty: 10, power: 27, wide: false },
  UA_433: { start: 433.0, end: 434.7, duty: 10, power: 10, wide: false },
  UA_868: { start: 868.0, end: 868.6, duty: 1, power: 14, wide: false },
  MY_433: { start: 433.0, end: 435.0, duty: 100, power: 20, wide: false },
  MY_919: { start: 919.0, end: 924.0, duty: 100, power: 27, wide: false },
  SG_923: { start: 917.0, end: 925.0, duty: 100, power: 20, wide: false },
  PH_433: { start: 433.0, end: 434.7, duty: 100, power: 10, wide: false },
  PH_868: { start: 868.0, end: 869.4, duty: 100, power: 14, wide: false },
  PH_915: { start: 915.0, end: 918.0, duty: 100, power: 24, wide: false },
  KZ_433: { start: 433.075, end: 434.775, duty: 100, power: 10, wide: false },
  KZ_863: { start: 863.0, end: 868.0, duty: 100, power: 30, wide: false },
  NP_865: { start: 865.0, end: 868.0, duty: 100, power: 30, wide: false },
  BR_902: { start: 902.0, end: 907.5, duty: 100, power: 30, wide: false },
  LORA_24: { start: 2400.0, end: 2483.5, duty: 100, power: 10, wide: true },
  UNSET: { start: 902.0, end: 928.0, duty: 100, power: 30, wide: false }
};

/* Symbol time in microseconds, as the radio computes it.
   RadioLib SX126x::calculateTimeOnAir, integer arithmetic kept intact:
     symbolLength_us = (10000 << sf) / (bw * 10) */
function symbolTimeUs(sf, bwKHz) {
  return Math.floor((10000 * Math.pow(2, sf)) / (bwKHz * 10));
}

function ldrOptimizeOn(sf, bwKHz) {
  return (Math.pow(2, sf) / bwKHz) >= 16;
}

/* Time on air in microseconds for a given over-air length.
   Transcribed from RadioLib src/modules/SX126x/SX126x.cpp calculateTimeOnAir,
   which is what meshtastic/firmware calls through SX126xInterface. The integer
   truncation is deliberate: matching the radio matters more than matching the
   textbook. Meshtastic packet config: explicit header, CRC on, preamble 16. */
function timeOnAirUs(sf, bwKHz, crDenominator, overAirBytes) {
  const symUs = symbolTimeUs(sf, bwKHz);
  let sfCoeff1_x4 = 17;      // 4.25 * 4
  let sfCoeff2 = 8;
  if (sf === 5 || sf === 6) { sfCoeff1_x4 = 25; sfCoeff2 = 0; }
  const sfDivisor = ldrOptimizeOn(sf, bwKHz) ? 4 * (sf - 2) : 4 * sf;
  const bitsPerCrc = 16;
  const nSymbolHeader = 20;  // explicit header
  let bitCount = 8 * overAirBytes + bitsPerCrc - 4 * sf + sfCoeff2 + nSymbolHeader;
  if (bitCount < 0) bitCount = 0;
  const nPreCoded = Math.floor((bitCount + (sfDivisor - 1)) / sfDivisor);
  const nSymbol_x4 = (MESH_PREAMBLE_SYMBOLS + 8) * 4 + sfCoeff1_x4 + nPreCoded * crDenominator * 4;
  return Math.floor((symUs * nSymbol_x4) / 4);
}

/* What the radio is actually set to, taken from the live LoRa config when
   there is one. Returns nulls rather than defaults when nothing is known. */
function loraSettings(session) {
  const cfg = session && session.config.get('lora') ? session.config.get('lora').lora : null;
  const regionName = cfg ? enumName('RegionCode', cfg.region || 0) : 'UNSET';
  const region = REGIONS[regionName] || null;
  const wide = region ? region.wide : false;
  let sf, bwKHz, cr, presetName, source;
  if (cfg && cfg.use_preset === false && cfg.spread_factor) {
    sf = cfg.spread_factor;
    bwKHz = cfg.bandwidth || 250;
    cr = cfg.coding_rate || 5;
    presetName = 'manual';
    source = 'the radio, with use_preset off';
  } else {
    presetName = cfg ? enumName('ModemPreset', cfg.modem_preset || 0) : 'LONG_FAST';
    const p = MODEM_PRESETS[presetName] || MODEM_PRESETS.LONG_FAST;
    sf = p.sf; cr = p.cr; bwKHz = wide ? p.wideBwKHz : p.bwKHz;
    source = cfg ? 'the radio' : 'defaults, no radio connected';
  }
  return {
    sf: sf, bwKHz: bwKHz, cr: cr, preset: presetName, regionName: regionName,
    region: region, wide: wide, source: source,
    hopLimit: cfg && cfg.hop_limit !== undefined ? cfg.hop_limit : 3,
    txPower: cfg ? cfg.tx_power : null,
    fromRadio: !!cfg
  };
}

let airtimeRefPayload = 40;

function stationAirtime() {
  const s = APP.session;
  const set = loraSettings(s);
  const wrap = stationHead('07 :: Airtime',
    'What a packet costs the channel. Time on air, effective bitrate, the regional duty cycle budget, and what a hop limit buys and spends. All of it is arithmetic on settings the radio reported, so it needs no traffic to be useful.');

  /* ---- settings in force ---- */
  const p0 = panel('Settings in force', 'read from ' + set.source);
  const kv = el('dl', { class: 'kv' });
  const add = (k, v) => kv.append(el('dt', null, k), el('dd', null, v));
  add('region', set.regionName + (set.region ? '  (' + set.region.start + ' to ' + set.region.end + ' MHz)' : '  (not in this build\u2019s region table)'));
  add('preset', set.preset);
  add('bandwidth', set.bwKHz + ' kHz' + (set.wide ? '  (wide band region)' : ''));
  add('spreading factor', 'SF' + set.sf);
  add('coding rate', '4/' + set.cr);
  add('symbol time', (symbolTimeUs(set.sf, set.bwKHz) / 1000).toFixed(3) + ' ms');
  add('low data rate optimize', ldrOptimizeOn(set.sf, set.bwKHz) ? 'on, symbol time is 16 ms or longer' : 'off');
  add('hop limit', String(set.hopLimit));
  if (set.txPower !== null && set.txPower !== undefined) add('tx power', set.txPower + ' dBm' + (set.region ? ', regional limit ' + set.region.power + ' dBm' : ''));
  p0.inner.append(kv);
  if (!set.fromRadio) p0.inner.append(el('div', { class: 'warnbox' }, 'No radio is connected, so these are stated defaults rather than measurements. Connect one from station 01 and every number below is about your radio instead.'));
  if (set.txPower !== null && set.region && set.txPower > set.region.power) {
    p0.inner.append(el('div', { class: 'badbox' }, 'Configured tx power of ' + set.txPower + ' dBm is above the ' + set.region.power + ' dBm limit this build has recorded for ' + set.regionName + '. Firmware clamps power at the radio, so this is a note about the config, not a claim about what is being radiated.'));
  }
  wrap.append(p0);

  /* ---- time on air ---- */
  const p1 = panel('Time on air', 'payload plus the ' + MESH_HEADER_BYTES + ' byte header');
  const sizes = [1, 8, 16, 32, 48, 64, 96, 128, 160, 200, MESH_MAX_DATA_PAYLOAD];
  const t1 = el('table');
  t1.append(el('thead', null, el('tr', null,
    ['Payload', 'Over the air', 'Time on air', 'Effective rate', 'Per minute at 100 %'].map(h => el('th', null, h)))));
  const b1 = el('tbody');
  sizes.forEach(n => {
    const over = n + MESH_HEADER_BYTES;
    const us = timeOnAirUs(set.sf, set.bwKHz, set.cr, over);
    const bps = (n * 8) / (us / 1e6);
    b1.append(el('tr', null,
      el('td', { class: 'num' }, n + ' B'),
      el('td', { class: 'num' }, over + ' B'),
      el('td', { class: 'num' }, fmtMs(us)),
      el('td', { class: 'num' }, Math.round(bps) + ' bit/s'),
      el('td', { class: 'num' }, Math.floor(60e6 / us) + ' packets')));
  });
  t1.append(b1);
  p1.inner.append(el('div', { class: 'scroll' }, t1));
  p1.inner.append(el('p', { class: 'note' },
    'Effective rate counts your payload only, not the header, the preamble or the coding overhead, because that is the number that tells you how long the channel is busy per useful byte. The last column is an arithmetic ceiling with no duty cycle, no backoff and no contention, so treat it as a bound and never as a plan.'));
  wrap.append(p1);

  /* ---- what your own traffic costs ---- */
  if (s && s.packets.length) {
    const seen = s.packets.filter(e => e.packet && (e.packet.decoded || e.packet.encrypted));
    if (seen.length) {
      let total = 0;
      const rows = seen.map(e => {
        const payloadLen = e.packet.decoded
          ? (e.packet.decoded.payload ? e.packet.decoded.payload.length : 0) + 4
          : (e.packet.encrypted ? e.packet.encrypted.length : 0);
        const us = timeOnAirUs(set.sf, set.bwKHz, set.cr, payloadLen + MESH_HEADER_BYTES);
        total += us;
        return { port: e.port, dir: e.dir, len: payloadLen, us: us };
      });
      const span = Math.max(1, (Date.now() - seen[0].t) / 1000);
      const p2 = panel('What this session has cost the channel', seen.length + ' packets over ' + Math.round(span) + ' s');
      const occupancy = (total / 1e6) / span * 100;
      p2.inner.append(el('div', { class: 'tally' },
        el('div', null, el('b', null, fmtMs(total)), el('span', null, 'total air time')),
        el('div', null, el('b', null, fmtMs(total / rows.length)), el('span', null, 'mean per packet')),
        el('div', { class: occupancy > 10 ? 'warn' : 'ok' }, el('b', null, occupancy.toFixed(2) + ' %'), el('span', null, 'channel occupancy'))));
      p2.inner.append(el('p', { class: 'note' },
        'Computed from the packet lengths in station 03 at the settings above. It counts what this radio heard and sent, which is not the whole channel: anything out of range, or on another channel, or missed while the port was closed, is not in it. Payload length for a decoded packet is the port payload plus a small allowance for the Data wrapper, so treat these as close rather than exact.'));
      const airUtil = latestAirUtil(s);
      if (airUtil !== null) {
        p2.inner.append(el('div', { class: 'note' },
          'The radio itself last reported air utilisation for transmit of ' + airUtil.toFixed(2) + ' %. That is its own measurement over its own window and is the number to trust over the estimate above.'));
      }
      wrap.append(p2);
    }
  }

  /* ---- preset comparison ---- */
  const p3 = panel('Presets compared', 'at a ' + airtimeRefPayload + ' byte payload');
  p3.inner.append(el('label', { class: 'field', style: 'max-width:260px' }, el('span', null, 'Reference payload, bytes'),
    el('input', {
      type: 'number', min: '1', max: String(MESH_MAX_DATA_PAYLOAD), value: String(airtimeRefPayload),
      onchange: e => { airtimeRefPayload = Math.max(1, Math.min(MESH_MAX_DATA_PAYLOAD, parseInt(e.target.value, 10) || 40)); paint(); }
    })));
  const t3 = el('table');
  t3.append(el('thead', null, el('tr', null,
    ['Preset', 'BW', 'SF', 'CR', 'Symbol', 'LDRO', 'Time on air', 'Effective rate', 'Against current'].map(h => el('th', null, h)))));
  const b3 = el('tbody');
  const over = airtimeRefPayload + MESH_HEADER_BYTES;
  const currentUs = timeOnAirUs(set.sf, set.bwKHz, set.cr, over);
  Object.keys(MODEM_PRESETS).forEach(name => {
    const p = MODEM_PRESETS[name];
    const bw = set.wide ? p.wideBwKHz : p.bwKHz;
    const us = timeOnAirUs(p.sf, bw, p.cr, over);
    const ratio = us / currentUs;
    const isCurrent = name === set.preset;
    const tr = el('tr', null,
      el('td', null, isCurrent ? el('span', { class: 'tagline ok' }, name) : name),
      el('td', { class: 'num' }, bw + ' kHz'),
      el('td', { class: 'num' }, 'SF' + p.sf),
      el('td', { class: 'num' }, '4/' + p.cr),
      el('td', { class: 'num' }, (symbolTimeUs(p.sf, bw) / 1000).toFixed(2) + ' ms'),
      el('td', null, ldrOptimizeOn(p.sf, bw) ? 'on' : 'off'),
      el('td', { class: 'num' }, fmtMs(us)),
      el('td', { class: 'num' }, Math.round((airtimeRefPayload * 8) / (us / 1e6)) + ' bit/s'),
      el('td', { class: 'num' }, isCurrent ? 'current' : (ratio >= 1 ? ratio.toFixed(2) + ' x slower' : (1 / ratio).toFixed(2) + ' x faster')));
    b3.append(tr);
  });
  t3.append(b3);
  p3.inner.append(el('div', { class: 'scroll' }, t3));
  p3.inner.append(el('p', { class: 'note' },
    'Range is not in this table and cannot be, because it depends on antennas, terrain and noise. What the table does say is what each preset costs in channel time, which is the half of the trade that is knowable from the bench. Presets absent from the firmware parameter table fall through to LONG_FAST in firmware and are absent here rather than guessed.'));
  wrap.append(p3);

  /* ---- duty cycle ---- */
  const p4 = panel('Duty cycle budget', set.region ? set.regionName + ' allows ' + set.region.duty + ' %' : 'region unknown');
  if (!set.region) {
    p4.inner.append(el('div', { class: 'warnbox' }, 'The radio reports region ' + set.regionName + ', which is not in the region table transcribed for this build. No budget is computed rather than a wrong one being shown.'));
  } else {
    const budgetSecPerHour = 3600 * set.region.duty / 100;
    const usEach = timeOnAirUs(set.sf, set.bwKHz, set.cr, over);
    const perHour = Math.floor(budgetSecPerHour / (usEach / 1e6));
    const spacing = (usEach / 1e6) * (100 / set.region.duty);
    p4.inner.append(el('div', { class: 'tally' },
      el('div', null, el('b', null, set.region.duty + ' %'), el('span', null, 'permitted duty')),
      el('div', null, el('b', null, Math.round(budgetSecPerHour) + ' s'), el('span', null, 'air time per hour')),
      el('div', null, el('b', null, String(perHour)), el('span', null, 'packets per hour')),
      el('div', null, el('b', null, spacing < 1 ? spacing.toFixed(2) + ' s' : Math.round(spacing) + ' s'), el('span', null, 'minimum spacing'))));
    p4.inner.append(el('p', { class: 'note' },
      'At a ' + airtimeRefPayload + ' byte payload, one packet occupies ' + fmtMs(usEach) + '. Sending one every ' + (spacing < 1 ? spacing.toFixed(2) : Math.round(spacing)) + ' s keeps this radio inside ' + set.region.duty + ' %. That is this radio alone. A duty cycle limit is a rule about a transmitter, and a channel is shared, so staying inside it is necessary and not sufficient.'));
    if (set.region.duty === 100) {
      p4.inner.append(el('div', { class: 'note' },
        'This region has no duty cycle restriction in the firmware table, so the budget above is the full hour. The channel still fills up, which is what the hop cost below is about.'));
    }
  }
  wrap.append(p4);

  /* ---- hop cost ---- */
  const p5 = panel('What a hop limit costs', 'hop limit ' + set.hopLimit);
  const relays = s ? Array.from(s.nodes.values()).filter(n => n.num !== s.myNodeNum).length : 0;
  const usEach = timeOnAirUs(set.sf, set.bwKHz, set.cr, over);
  const t5 = el('table');
  t5.append(el('thead', null, el('tr', null, ['Hop limit', 'Transmissions, worst case', 'Channel time', 'Duty used per packet'].map(h => el('th', null, h)))));
  const b5 = el('tbody');
  for (let h = 1; h <= 7; h++) {
    const tx = 1 + h * Math.max(1, Math.min(relays || 3, 6));
    const total = tx * usEach;
    const dutyPct = set.region ? (total / 1e6) / 36 : null;
    const tr = el('tr', null,
      el('td', { class: 'num' }, h === set.hopLimit ? el('span', { class: 'tagline ok' }, String(h)) : String(h)),
      el('td', { class: 'num' }, String(tx)),
      el('td', { class: 'num' }, fmtMs(total)),
      el('td', { class: 'num' }, dutyPct === null ? '-' : dutyPct.toFixed(3) + ' % of an hour'));
    b5.append(tr);
  }
  t5.append(b5);
  p5.inner.append(el('div', { class: 'scroll' }, t5));
  p5.inner.append(el('p', { class: 'note' },
    'This is an upper bound and it is deliberately crude. It assumes every node that hears a packet rebroadcasts it once per hop, using ' +
    (relays ? 'the ' + relays + ' other nodes currently in your roster' : 'an assumed three relaying neighbours, since no roster is loaded') +
