<!DOCTYPE html>
<!-- WATCHFIRE :: watchfire.html :: v1.9.0 -->
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>WATCHFIRE :: a bench for your Meshtastic radio</title>
<meta name="description" content="A local-first single file bench for a Meshtastic radio over Web Serial. Nothing leaves the machine.">
<style>
/* ==========================================================================
   WATCHFIRE :: design tokens
   A watchfire is a chain of signal fires relaying a message across distance,
   which is what a mesh is. Ember on cold slate, with a teal that means
   "understood" and an ember that means "yours". Type is monospace throughout
   because the subject is a wire, and the display face is the same face set
   wide and uppercase rather than a second family, so the whole instrument
   reads as one printed panel.
   ========================================================================== */
:root{
  --ink:#0b0d10; --panel:#12161b; --panel-2:#171c22; --panel-3:#1d242c;
  --line:#242d38; --line-soft:#1b222a;
  --text:#dce3ea; --dim:#94a2b1; --faint:#66727f;
  --ember:#ff9d3d; --ember-soft:#4a3115;
  --signal:#4fc3a1; --signal-soft:#12332b;
  --alarm:#ff6b60; --alarm-soft:#3c1a17;
  --tx:#a898ff;
  --focus:#ffd08a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:3px;
  --pad:clamp(12px,2.2vw,22px);
  --tap:44px;
}
:root[data-theme="day"]{
  --ink:#eceff2; --panel:#ffffff; --panel-2:#f5f7f9; --panel-3:#e9edf1;
  --line:#c6cfd8; --line-soft:#dbe2e8;
  --text:#12171c; --dim:#4d5966; --faint:#6d7a87;
  --ember:#9a4c00; --ember-soft:#ffe6cc;
  --signal:#0a6b53; --signal-soft:#d4efe6;
  --alarm:#a5231a; --alarm-soft:#ffdedb;
  --tx:#4b3ba8; --focus:#7a3d00;
}
:root[data-theme="contrast"]{
  --ink:#000000; --panel:#000000; --panel-2:#0a0a0a; --panel-3:#141414;
  --line:#9aa4ad; --line-soft:#5b646c;
  --text:#ffffff; --dim:#e2e8ee; --faint:#c3ccd4;
  --ember:#ffb454; --ember-soft:#3a2a10;
  --signal:#6ff0c8; --signal-soft:#08312a;
  --alarm:#ff9b93; --alarm-soft:#3d1512;
  --tx:#cdbcff; --focus:#ffe066;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--mono); font-size:14px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--ember);color:var(--ink)}

/* ---- structural chrome ---- */
.app{display:flex;flex-direction:column;min-height:100dvh}

header.masthead{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px var(--pad); border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:26px;height:30px;flex:none}
.brand h1{
  margin:0;font-size:15px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
}
.brand .tag{color:var(--faint);font-size:11px;letter-spacing:.08em;display:block;text-transform:none;letter-spacing:.02em}

.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:100px;
  border:1px solid var(--line);background:var(--panel-3);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill[data-state="ready"]{border-color:var(--signal);color:var(--signal)}
.pill[data-state="ready"] .dot{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.pill[data-state="handshake"],.pill[data-state="opening"]{border-color:var(--ember);color:var(--ember)}
.pill[data-state="handshake"] .dot,.pill[data-state="opening"] .dot{background:var(--ember);animation:blink 1s steps(2) infinite}
.pill[data-state="error"]{border-color:var(--alarm);color:var(--alarm)}
.pill[data-state="error"] .dot{background:var(--alarm)}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.pill .dot{animation:none !important}}

.iconbtn{
  min-height:var(--tap);min-width:var(--tap);padding:6px 12px;background:var(--panel-3);
  border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;
}
.iconbtn:hover{border-color:var(--ember);color:var(--ember)}

.body{display:flex;flex:1;min-height:0}

nav.rail{
  width:186px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  padding:10px 0;display:flex;flex-direction:column;gap:1px;
}
nav.rail .grouплabel{}
.railgroup{padding:14px 16px 6px;font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.stationbtn{
  display:flex;align-items:baseline;gap:9px;width:100%;min-height:var(--tap);
  padding:8px 16px;background:none;border:0;border-left:3px solid transparent;
  cursor:pointer;text-align:left;letter-spacing:.13em;font-size:12px;text-transform:uppercase;color:var(--dim);
}
.stationbtn .num{font-size:10px;color:var(--faint);width:14px;flex:none}
.stationbtn:hover{color:var(--text);background:var(--panel-2)}
.stationbtn[aria-current="true"]{color:var(--ember);border-left-color:var(--ember);background:var(--panel-2)}
.stationbtn[data-stub="1"] .num{color:var(--faint)}
.stationbtn[data-stub="1"]{opacity:.62}

main{flex:1;min-width:0;overflow:auto;padding:var(--pad);}
.station{max-width:1180px}
.station>h2{
  margin:0 0 2px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--ember);
}
.station>p.lede{margin:0 0 18px;color:var(--dim);font-size:12.5px;max-width:74ch;font-family:var(--sans)}

/* ---- panels, tables, controls ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.panel>h3{
  margin:0;padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:flex;gap:10px;align-items:center;
}
.panel>h3 .right{margin-left:auto;color:var(--faint);letter-spacing:.06em;text-transform:none}
.panel .inner{padding:14px}
.grid{display:grid;gap:14px}
@media(min-width:900px){.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12.5px}
.kv dt{color:var(--faint);letter-spacing:.08em}
.kv dd{margin:0;word-break:break-word}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-weight:500;color:var(--faint);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
}
th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button:hover{color:var(--ember)}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
tr[data-stale="1"]{color:var(--faint)}
.num,.mono{font-variant-numeric:tabular-nums}

input[type=text],input[type=number],input[type=search],select,textarea{
  background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;min-height:var(--tap);width:100%;
}
label.field{display:block;margin-bottom:10px}
label.field>span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
label.check{display:flex;align-items:center;gap:9px;min-height:var(--tap);cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--ember)}

.btn{
  min-height:var(--tap);padding:9px 16px;border-radius:var(--r);cursor:pointer;
  background:var(--panel-3);border:1px solid var(--line);letter-spacing:.13em;
  text-transform:uppercase;font-size:11px;
}
.btn:hover:not(:disabled){border-color:var(--ember);color:var(--ember)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1a1206;font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);color:#1a1206}
.btn.danger{border-color:var(--alarm);color:var(--alarm)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.tagline{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:100px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tagline.ok{border-color:var(--signal);color:var(--signal)}
.tagline.warn{border-color:var(--ember);color:var(--ember)}
.tagline.bad{border-color:var(--alarm);color:var(--alarm)}
.tagline.tx{border-color:var(--tx);color:var(--tx)}

.empty{padding:26px 14px;text-align:center;color:var(--faint);font-family:var(--sans);font-size:13px}
.empty strong{display:block;color:var(--dim);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:6px}

pre.hex{
  margin:0;padding:12px;background:var(--ink);border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:auto;font-size:11.5px;line-height:1.55;max-height:280px;white-space:pre;
}
.console{
  background:var(--ink);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:10px 12px;height:230px;overflow:auto;font-size:11.5px;line-height:1.6;
}
.console div{white-space:pre-wrap;word-break:break-word}
.console .t{color:var(--faint);margin-right:8px}

/* ---- THE WIRE: the signature element ----
   Every byte the port has delivered, newest at the right. Teal where a frame
   was found, dim where the byte was firmware log text, ember where the reader
   had to resync. This is the one place the instrument shows you the lane
   itself rather than what it made of it. */
.wire{
  height:66px;background:var(--ink);border:1px solid var(--line-soft);border-radius:var(--r);
  position:relative;overflow:hidden;display:flex;align-items:flex-end;gap:1px;padding:6px;
}
.wire i{display:block;width:3px;flex:none;border-radius:1px;background:var(--faint);opacity:.45}
.wire i.f{background:var(--signal);opacity:1}
.wire i.s{background:var(--faint);opacity:.4}
.wire i.r{background:var(--ember);opacity:1}
.wire i.o{background:var(--alarm);opacity:1}
.wire .idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:10px;letter-spacing:.24em;text-transform:uppercase}
.tally{display:flex;gap:20px;flex-wrap:wrap;padding:12px 14px 0}
.tally div{min-width:78px}
.tally b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tally span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.tally .ok b{color:var(--signal)}
.tally .warn b{color:var(--ember)}
.tally .bad b{color:var(--alarm)}

/* ---- messages ---- */
.thread{display:flex;flex-direction:column;gap:9px;max-height:46vh;overflow:auto;padding:4px}
.msg{border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;background:var(--panel-2);max-width:min(560px,92%)}
.msg.out{align-self:flex-end;border-color:var(--tx)}
.msg .meta{font-size:10px;letter-spacing:.1em;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.msg .text{font-family:var(--sans);font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg .evidence{margin-top:6px;display:flex;gap:7px;flex-wrap:wrap}

/* ---- diff ---- */
.diff{width:100%;font-size:12px}
.diff td{padding:5px 10px}
.diff .from{color:var(--alarm)}
.diff .to{color:var(--signal)}
.diff tr.same{opacity:.45}

/* ---- modal ---- */
dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--r);
  padding:0;max-width:min(720px,94vw);width:100%;
}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ember)}
dialog .dinner{padding:16px;max-height:70vh;overflow:auto}
dialog .dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
dialog p, dialog li{font-family:var(--sans);font-size:13px}

/* ---- toast ---- */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,92vw)}
.toast{border:1px solid var(--line);border-left:3px solid var(--ember);background:var(--panel-2);padding:10px 13px;border-radius:var(--r);font-size:12.5px;font-family:var(--sans)}
.toast.ok{border-left-color:var(--signal)}
.toast.bad{border-left-color:var(--alarm)}

.note{
  font-family:var(--sans);font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);
  padding:2px 0 2px 12px;margin:10px 0;
}
.warnbox{border:1px solid var(--ember);background:var(--ember-soft);padding:11px 13px;border-radius:var(--r);font-family:var(--sans);font-size:13px;margin-bottom:12px}
.badbox{border:1px solid var(--alarm);background:var(--alarm-soft);padding:11px 13px;border-radius:var(--r);font-family:var(--sans);font-size:13px;margin-bottom:12px}
.okbox{border:1px solid var(--signal);background:var(--signal-soft);padding:11px 13px;border-radius:var(--r);font-family:var(--sans);font-size:13px;margin-bottom:12px}

.tree{font-size:12px;line-height:1.7}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line-soft)}
.tree .k{color:var(--ember)}
.tree .v{color:var(--text)}
.tree .ty{color:var(--faint);font-size:10.5px;letter-spacing:.06em}
.tree .unk{color:var(--alarm)}

.scroll{overflow:auto;max-height:60vh}

@media(max-width:860px){
  .body{flex-direction:column}
  nav.rail{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0;gap:0}
  .railgroup{display:none}
  .stationbtn{width:auto;border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 14px}
  .stationbtn[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--ember)}
  .stationbtn .num{display:none}
  main{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---- the printable summary ----
   A print only region rendered into this page. Nothing is opened elsewhere
   and nothing is fetched to produce it. */
#printregion{display:none}
@media print{
  html.printing body>*:not(#printregion){display:none !important}
  #printregion{display:block;font-family:var(--sans);color:#000;background:#fff;padding:0;max-width:none}
  #printregion h1{font-family:var(--mono);font-size:17pt;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4pt;border-bottom:1.5pt solid #000;padding-bottom:4pt}
  #printregion h2{font-family:var(--mono);font-size:11pt;letter-spacing:.16em;text-transform:uppercase;margin:14pt 0 5pt;border-bottom:.5pt solid #666;padding-bottom:2pt;page-break-after:avoid}
  #printregion div,#printregion p{font-size:9.5pt;line-height:1.45;margin:0 0 2pt}
  #printregion .pli{padding-left:12pt;text-indent:-12pt}
  #printregion .pli::before{content:"\2022  "}
  #printregion .pwarn{border:1pt solid #000;padding:5pt;margin:6pt 0;font-weight:700}
  #printregion .pfoot{margin-top:14pt;padding-top:5pt;border-top:.5pt solid #666;font-size:8.5pt;color:#333}
  @page{margin:16mm}
}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   WATCHFIRE :: small shared utilities
   ========================================================================== */

const HEXD = '0123456789abcdef';

function bytesToHex(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += HEXD[u8[i] >> 4] + HEXD[u8[i] & 15];
  return s;
}

function hexToBytes(hex) {
  const clean = String(hex).replace(/[^0-9a-fA-F]/g, '');
  const out = new Uint8Array(clean.length >> 1);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}

function hexDump(u8, width) {
  width = width || 16;
  const lines = [];
  for (let o = 0; o < u8.length; o += width) {
    const slice = u8.subarray(o, o + width);
    let hex = '', ascii = '';
    for (let i = 0; i < width; i++) {
      hex += i < slice.length ? (HEXD[slice[i] >> 4] + HEXD[slice[i] & 15] + ' ') : '   ';
      if (i < slice.length) ascii += (slice[i] >= 32 && slice[i] < 127) ? String.fromCharCode(slice[i]) : '.';
    }
    lines.push(o.toString(16).padStart(4, '0') + '  ' + hex + ' ' + ascii);
  }
  return lines.join('\n');
}

function randomBytes(n) {
  const a = new Uint8Array(n);
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
  return a;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

function bytesToB64(u8, urlSafe) {
  let out = '';
  for (let i = 0; i < u8.length; i += 3) {
    const a = u8[i], b = u8[i + 1], c = u8[i + 2];
    out += B64[a >> 2];
    out += B64[((a & 3) << 4) | ((b === undefined ? 0 : b) >> 4)];
    out += b === undefined ? '=' : B64[((b & 15) << 2) | ((c === undefined ? 0 : c) >> 6)];
    out += c === undefined ? '=' : B64[c & 63];
  }
  return urlSafe ? out.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : out;
}

function b64ToBytes(s) {
  const clean = String(s).replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/]/g, '');
  const out = new Uint8Array(Math.floor(clean.length * 3 / 4));
  let o = 0;
  for (let i = 0; i < clean.length; i += 4) {
    const n = (B64.indexOf(clean[i]) << 18) | (B64.indexOf(clean[i + 1]) << 12) |
      ((clean[i + 2] ? B64.indexOf(clean[i + 2]) : 0) << 6) | (clean[i + 3] ? B64.indexOf(clean[i + 3]) : 0);
    if (o < out.length) out[o++] = (n >> 16) & 0xff;
    if (o < out.length && clean[i + 2]) out[o++] = (n >> 8) & 0xff;
    if (o < out.length && clean[i + 3]) out[o++] = n & 0xff;
  }
  return out.subarray(0, o).slice();
}

function nodeIdHex(num) { return '!' + (num >>> 0).toString(16).padStart(8, '0'); }

function relTime(unixSecs) {
  if (!unixSecs) return 'never';
  const d = Math.floor(Date.now() / 1000) - unixSecs;
  if (d < 0) return 'in the future';
  if (d < 60) return d + ' s ago';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' h ago';
  return Math.floor(d / 86400) + ' d ago';
}

function absTime(unixSecs) {
  if (!unixSecs) return '';
  const d = new Date(unixSecs * 1000);
  return d.toISOString().replace('T', ' ').slice(0, 19) + 'Z';
}

function clockTime(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* Distance and bearing on a sphere. Used by MUSTER for the range column. */
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0088, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const y = Math.sin((lon2 - lon1) * rad) * Math.cos(lat2 * rad);
  const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) - Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lon2 - lon1) * rad);
  return (Math.atan2(y, x) / rad + 360) % 360;
}

function posLatLon(position) {
  if (!position || position.latitude_i === undefined || position.longitude_i === undefined) return null;
  if (position.latitude_i === 0 && position.longitude_i === 0) return null;
  return { lat: position.latitude_i / 1e7, lon: position.longitude_i / 1e7 };
}

/* ==========================================================================
   WATCHFIRE :: protobuf wire codec
   Hand rolled. No library, no build step.
   Wire format reference: protobuf.dev/programming-guides/encoding
   The one property that matters most in this file: unknown fields survive
   a decode/encode round trip byte for byte. A config write must never
   silently drop a field this build has never heard of.
   ========================================================================== */

const WIRE = { VARINT: 0, I64: 1, LEN: 2, I32: 5 };

class Reader {
  constructor(buf, start, end) {
    this.b = buf;
    this.p = start === undefined ? 0 : start;
    this.end = end === undefined ? buf.length : end;
  }
  get eof() { return this.p >= this.end; }
  byte() {
    if (this.p >= this.end) throw new ProtoError('read past end of buffer');
    return this.b[this.p++];
  }
  varint() {
    let lo = 0, hi = 0, shift = 0, byte;
    do {
      byte = this.byte();
      if (shift < 28) lo |= (byte & 0x7f) << shift;
      else if (shift < 32) { lo |= (byte & 0x7f) << shift; hi |= (byte & 0x7f) >>> (32 - shift); }
      else hi |= (byte & 0x7f) << (shift - 32);
      shift += 7;
      if (shift > 70) throw new ProtoError('varint longer than 10 bytes');
    } while (byte & 0x80);
    lo = lo >>> 0; hi = hi >>> 0;
    if (hi === 0) return lo;
    const v = hi * 4294967296 + lo;
    return Number.isSafeInteger(v) ? v : { hi: hi, lo: lo };
  }
  skipVarint() { let b; do { b = this.byte(); } while (b & 0x80); }
  u32() {
    if (this.p + 4 > this.end) throw new ProtoError('read past end of buffer');
    const b = this.b, p = this.p; this.p += 4;
    return (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0;
  }
  i32() { const v = this.u32(); return v | 0; }
  f32() {
    const v = this.u32();
    f32buf[0] = v;
    return f32view[0];
  }
  f64() {
    const lo = this.u32(), hi = this.u32();
    f32buf[0] = lo; f32buf[1] = hi;
    return f64view[0];
  }
  bytes(n) {
    if (this.p + n > this.end) throw new ProtoError('length delimited field overruns buffer');
    const out = this.b.subarray(this.p, this.p + n);
    this.p += n;
    return out;
  }
  skipWire(wire) {
    if (wire === WIRE.VARINT) this.skipVarint();
    else if (wire === WIRE.I64) this.bytes(8);
    else if (wire === WIRE.LEN) this.bytes(this.varint());
    else if (wire === WIRE.I32) this.bytes(4);
    else throw new ProtoError('unknown wire type ' + wire);
  }
}

const f32buf = new Uint32Array(2);
const f32view = new Float32Array(f32buf.buffer);
const f64view = new Float64Array(f32buf.buffer);

class ProtoError extends Error {}

class Writer {
  constructor() { this.chunks = []; this.len = 0; }
  raw(u8) { this.chunks.push(u8); this.len += u8.length; return this; }
  byte(v) { return this.raw(new Uint8Array([v & 0xff])); }
  varint(v) {
    if (v < 0) {
      // negative int32/int64 values encode as 10 byte two's complement varints
      const out = [];
      let lo = v >>> 0, hi = Math.floor(v / 4294967296) >>> 0;
      for (let i = 0; i < 9; i++) {
        let b = lo & 0x7f;
        lo = ((lo >>> 7) | (hi << 25)) >>> 0;
        hi = hi >>> 7;
        out.push(b | 0x80);
      }
      out.push(0x01);
      return this.raw(new Uint8Array(out));
    }
    const out = [];
    while (v > 127) { out.push((v & 0x7f) | 0x80); v = Math.floor(v / 128); }
    out.push(v & 0x7f);
    return this.raw(new Uint8Array(out));
  }
  tag(num, wire) { return this.varint(num * 8 + wire); }
  u32(v) {
    const a = new Uint8Array(4);
    a[0] = v & 0xff; a[1] = (v >>> 8) & 0xff; a[2] = (v >>> 16) & 0xff; a[3] = (v >>> 24) & 0xff;
    return this.raw(a);
  }
  f32(v) { f32view[0] = v; return this.u32(f32buf[0]); }
  f64(v) { f64view[0] = v; this.u32(f32buf[0]); return this.u32(f32buf[1]); }
  lenPrefixed(u8) { this.varint(u8.length); return this.raw(u8); }
  finish() {
    const out = new Uint8Array(this.len);
    let o = 0;
    for (const c of this.chunks) { out.set(c, o); o += c.length; }
    return out;
  }
}

/* --------------------------------------------------------------------------
   Schema registry.
   A message is a list of fields: [number, name, type, opts]
   type strings:
     bool int32 uint32 sint32 int64 uint64 sint64
     fixed32 sfixed32 float fixed64 sfixed64 double
     string bytes
     enum:EnumName   msg:MessageName
   opts: { rep: true (repeated), packed: true, oneof: 'name' }
   -------------------------------------------------------------------------- */

const SCHEMA = Object.create(null);
const ENUMS = Object.create(null);

function defMsg(name, fields) {
  const byNum = Object.create(null);
  const byName = Object.create(null);
  for (const f of fields) {
    const spec = { num: f[0], name: f[1], type: f[2], opts: f[3] || {} };
    byNum[spec.num] = spec;
    byName[spec.name] = spec;
  }
  SCHEMA[name] = { name: name, fields: fields, byNum: byNum, byName: byName };
  return SCHEMA[name];
}

function defEnum(name, pairs) {
  const byVal = Object.create(null), byName = Object.create(null);
  for (const k in pairs) { byVal[pairs[k]] = k; byName[k] = pairs[k]; }
  ENUMS[name] = { name: name, byVal: byVal, byName: byName, values: pairs };
  return ENUMS[name];
}

function enumName(enumType, value) {
  const e = ENUMS[enumType];
  if (!e) return String(value);
  const n = e.byVal[value];
  return n === undefined ? String(value) + ' (unnamed)' : n;
}

function wireFor(type) {
  switch (type) {
    case 'bool': case 'int32': case 'uint32': case 'sint32':
    case 'int64': case 'uint64': case 'sint64': return WIRE.VARINT;
    case 'fixed32': case 'sfixed32': case 'float': return WIRE.I32;
    case 'fixed64': case 'sfixed64': case 'double': return WIRE.I64;
    case 'string': case 'bytes': return WIRE.LEN;
    default:
      if (type.startsWith('enum:')) return WIRE.VARINT;
      if (type.startsWith('msg:')) return WIRE.LEN;
      throw new ProtoError('no wire type for ' + type);
  }
}

function zigzagDecode(v) { return (v >>> 1) ^ -(v & 1); }
function zigzagEncode(v) { return v < 0 ? (-v * 2 - 1) : v * 2; }

/* Decoded message shape:
   { ...fields, $unknown: [ {num, wire, raw:Uint8Array} ], $partial: bool, $type: name }
   $partial is true when this message, or anything nested inside it, contained
   a field this build does not understand. Anything $partial is write blocked. */

function decode(typeName, buf, start, end) {
  const schema = SCHEMA[typeName];
  if (!schema) throw new ProtoError('no schema for ' + typeName);
  const r = new Reader(buf, start, end);
  const out = { $type: typeName, $unknown: [], $partial: false };
  while (!r.eof) {
    const tagStart = r.p;
    const tag = r.varint();
    const num = Math.floor(tag / 8), wire = tag & 7;
    if (num === 0) throw new ProtoError('field number 0 is not legal');
    const spec = schema.byNum[num];
    if (!spec || wireFor(spec.type) !== wire && !(spec.opts.packed && wire === WIRE.LEN)) {
      // Unknown field, or a field whose wire type does not match what we expect.
      // Either way we do not understand it, so we keep the exact bytes and flag it.
      r.skipWire(wire);
      out.$unknown.push({ num: num, wire: wire, raw: buf.subarray(tagStart, r.p) });
      out.$partial = true;
      continue;
    }
    const rep = !!spec.opts.rep;
    if (rep && spec.opts.packed && wire === WIRE.LEN && !spec.type.startsWith('msg:') && spec.type !== 'string' && spec.type !== 'bytes') {
      const len = r.varint();
      const sub = new Reader(buf, r.p, r.p + len);
      r.p += len;
      const arr = out[spec.name] || (out[spec.name] = []);
      while (!sub.eof) arr.push(readValue(sub, spec, buf, out));
      continue;
    }
    const v = readValue(r, spec, buf, out);
    if (rep) (out[spec.name] || (out[spec.name] = [])).push(v);
    else {
      out[spec.name] = v;
      if (spec.opts.oneof) out['$' + spec.opts.oneof] = spec.name;
    }
  }
  return out;
}

function readValue(r, spec, buf, parent) {
  const t = spec.type;
  switch (t) {
    case 'bool': return r.varint() !== 0;
    case 'uint32': return r.varint() >>> 0;
    case 'int32': { const v = r.varint(); return typeof v === 'object' ? (v.lo | 0) : (v | 0); }
    case 'sint32': return zigzagDecode(r.varint());
    case 'uint64': case 'int64': return r.varint();
    case 'sint64': return zigzagDecode(r.varint());
    case 'fixed32': return r.u32();
    case 'sfixed32': return r.i32();
    case 'float': return r.f32();
    case 'fixed64': case 'sfixed64': return r.f64ish ? r.f64ish() : (r.bytes(8), 0);
    case 'double': return r.f64();
    case 'string': return utf8Decode(r.bytes(r.varint()));
    case 'bytes': return r.bytes(r.varint()).slice();
    default:
      if (t.startsWith('enum:')) { const v = r.varint(); return typeof v === 'object' ? 0 : v; }
      if (t.startsWith('msg:')) {
        const len = r.varint();
        const sub = decode(t.slice(4), buf, r.p, r.p + len);
        r.p += len;
        if (sub.$partial) parent.$partial = true;
        return sub;
      }
      throw new ProtoError('cannot read type ' + t);
  }
}

function encode(typeName, obj) {
  const schema = SCHEMA[typeName];
  if (!schema) throw new ProtoError('no schema for ' + typeName);
  // Collect every emittable entry keyed by field number so known and unknown
  // fields interleave in canonical field order on the way out.
  const entries = [];
  for (const f of schema.fields) {
    const spec = schema.byNum[f[0]];
    const v = obj[spec.name];
    if (v === undefined || v === null) continue;
    if (spec.opts.oneof && obj['$' + spec.opts.oneof] && obj['$' + spec.opts.oneof] !== spec.name) continue;
    entries.push({ num: spec.num, write: (w) => writeField(w, spec, v) });
  }
  for (const u of (obj.$unknown || [])) {
    entries.push({ num: u.num, write: (w) => w.raw(u.raw) });
  }
  entries.sort((a, b) => a.num - b.num);
  const w = new Writer();
  for (const e of entries) e.write(w);
  return w.finish();
}

function writeField(w, spec, v) {
  const t = spec.type;
  if (spec.opts.rep) {
    const arr = Array.isArray(v) ? v : [v];
    if (spec.opts.packed && !t.startsWith('msg:') && t !== 'string' && t !== 'bytes') {
      const inner = new Writer();
      for (const item of arr) writeScalar(inner, t, item);
      const bytes = inner.finish();
      if (bytes.length === 0) return;
      w.tag(spec.num, WIRE.LEN); w.lenPrefixed(bytes);
      return;
    }
    for (const item of arr) { w.tag(spec.num, wireFor(t)); writeScalar(w, t, item); }
    return;
  }
  w.tag(spec.num, wireFor(t));
  writeScalar(w, t, v);
}

function writeScalar(w, t, v) {
  switch (t) {
    case 'bool': return w.varint(v ? 1 : 0);
    case 'uint32': return w.varint(v >>> 0);
    case 'int32': return w.varint(v | 0);
    case 'sint32': case 'sint64': return w.varint(zigzagEncode(v));
    case 'uint64': case 'int64': return w.varint(v);
    case 'fixed32': return w.u32(v >>> 0);
    case 'sfixed32': return w.u32(v | 0);
    case 'float': return w.f32(v);
    case 'double': return w.f64(v);
    case 'fixed64': case 'sfixed64': return w.f64(v);
    case 'string': return w.lenPrefixed(utf8Encode(v));
    case 'bytes': return w.lenPrefixed(v instanceof Uint8Array ? v : new Uint8Array(v));
    default:
      if (t.startsWith('enum:')) return w.varint(v | 0);
      if (t.startsWith('msg:')) return w.lenPrefixed(encode(t.slice(4), v));
      throw new ProtoError('cannot write type ' + t);
  }
}

function utf8Encode(s) {
  if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(s);
  const out = [];
  for (let i = 0; i < s.length; i++) {
    let c = s.codePointAt(i);
    if (c > 0xffff) i++;
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}

function utf8Decode(u8) {
  if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8', { fatal: false }).decode(u8);
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return s;
}

/* Walk a decoded message and report every unknown field found, with the path
   to it. This is what the write gate and the field tree inspector both use. */
function unknownReport(obj, path, acc) {
  acc = acc || [];
  path = path || (obj && obj.$type) || '';
  if (!obj || typeof obj !== 'object') return acc;
  for (const u of (obj.$unknown || [])) {
    acc.push({ path: path, num: u.num, wire: u.wire, bytes: u.raw.length });
  }
  for (const k in obj) {
    if (k.charAt(0) === '$') continue;
    const v = obj[k];
    if (Array.isArray(v)) v.forEach((item, i) => { if (item && item.$type) unknownReport(item, path + '.' + k + '[' + i + ']', acc); });
    else if (v && v.$type) unknownReport(v, path + '.' + k, acc);
  }
  return acc;
}

/* ==========================================================================
   WATCHFIRE :: serial framing
   Reference: meshtastic/python meshtastic/stream_interface.py (read 2026-08-11)
     START1 = 0x94, START2 = 0xC3, MAX_TO_FROM_RADIO_SIZE = 512
     header = [START1, START2, len >> 8, len & 0xFF]
   The stream is not pure. Firmware debug log text is interleaved as plain
   ASCII on the same line. Every byte that is not part of a valid frame is
   kept and routed to the debug lane, never discarded.
   ========================================================================== */

const START1 = 0x94;
const START2 = 0xc3;
const MAX_TO_FROM_RADIO_SIZE = 512;
/* Sent before the first packet to wake a sleeping device. 32 bytes of START2
   specifically, not START1, so that the device stays hunting for START1 and
   resyncs cleanly. Taken from stream_interface.py connect(). */
const WAKE_BYTES = new Uint8Array(32).fill(START2);

function frameEncode(payload) {
  if (payload.length > MAX_TO_FROM_RADIO_SIZE) {
    throw new Error('payload of ' + payload.length + ' bytes exceeds the 512 byte limit');
  }
  const out = new Uint8Array(4 + payload.length);
  out[0] = START1;
  out[1] = START2;
  out[2] = (payload.length >> 8) & 0xff;
  out[3] = payload.length & 0xff;
  out.set(payload, 4);
  return out;
}

/* A state machine, not a parser over a whole buffer, because bytes arrive in
   whatever chunk sizes the USB stack feels like. Frames split across chunks,
   magic bytes appearing inside payload data, and log lines interrupting a
   header are all normal traffic here, not error cases. */
class Deframer {
  constructor(opts) {
    opts = opts || {};
    this.onFrame = opts.onFrame || function () {};
    this.onStray = opts.onStray || function () {};
    this.buf = new Uint8Array(0);
    this.stats = { frames: 0, bytesIn: 0, strayBytes: 0, oversize: 0, resyncs: 0 };
  }

  reset() {
    this.buf = new Uint8Array(0);
  }

  push(chunk) {
    if (!chunk || chunk.length === 0) return;
    this.stats.bytesIn += chunk.length;
    const merged = new Uint8Array(this.buf.length + chunk.length);
    merged.set(this.buf, 0);
    merged.set(chunk, this.buf.length);
    this.buf = merged;
    this.run();
  }

  run() {
    let p = 0;
    const b = this.buf;
    let strayStart = -1;

    const flushStray = (end) => {
      if (strayStart >= 0 && end > strayStart) {
        const s = b.subarray(strayStart, end);
        this.stats.strayBytes += s.length;
        this.onStray(s.slice());
      }
      strayStart = -1;
    };

    while (p < b.length) {
      if (b[p] !== START1) {
        if (strayStart < 0) strayStart = p;
        p++;
        continue;
      }
      // Possible frame start. We need at least the 4 byte header to judge it.
      if (p + 1 >= b.length) break;              // hold, might be START1 at a chunk edge
      if (b[p + 1] !== START2) {
        // START1 not followed by START2 is just a byte in the log stream.
        if (strayStart < 0) strayStart = p;
        p++;
        this.stats.resyncs++;
        continue;
      }
      if (p + 3 >= b.length) break;              // hold for the length bytes
      const len = (b[p + 2] << 8) | b[p + 3];
      if (len > MAX_TO_FROM_RADIO_SIZE) {
        // A length field this large cannot be a real frame. Treat the magic as
        // coincidence in the log stream and resync one byte on.
        this.stats.oversize++;
        this.stats.resyncs++;
        if (strayStart < 0) strayStart = p;
        p++;
        continue;
      }
      if (p + 4 + len > b.length) break;          // hold for the body
      flushStray(p);
      const payload = b.subarray(p + 4, p + 4 + len).slice();
      this.stats.frames++;
      p += 4 + len;
      this.onFrame(payload);
    }

    flushStray(p);
    this.buf = b.subarray(p).slice();
  }
}

/* ==========================================================================
   WATCHFIRE :: QR encoder
   Byte mode, error correction level L, versions 1 to 10. Written here because
   a channel key must never be handed to a web service to be drawn.
   Reference: ISO/IEC 18004 structure, implemented from the specification.
   ========================================================================== */

/* Data codewords and block layout for error correction level L. */
const QR_L = {
  1:  { data: 19,  ec: 7,  blocks: [[1, 19]] },
  2:  { data: 34,  ec: 10, blocks: [[1, 34]] },
  3:  { data: 55,  ec: 15, blocks: [[1, 55]] },
  4:  { data: 80,  ec: 20, blocks: [[1, 80]] },
  5:  { data: 108, ec: 26, blocks: [[1, 108]] },
  6:  { data: 136, ec: 18, blocks: [[2, 68]] },
  7:  { data: 156, ec: 20, blocks: [[2, 78]] },
  8:  { data: 194, ec: 24, blocks: [[2, 97]] },
  9:  { data: 232, ec: 30, blocks: [[2, 116]] },
  10: { data: 274, ec: 18, blocks: [[2, 68], [2, 69]] }
};

const QR_ALIGN = {
  1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
  6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
};

/* GF(256) with the QR primitive polynomial 0x11d */
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(function () {
  let x = 1;
  for (let i = 0; i < 255; i++) { GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();
function gfMul(a, b) { return (a === 0 || b === 0) ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]]; }

function rsGenerator(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i++) {
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j++) {
      next[j] ^= poly[j];                        // times x
      next[j + 1] ^= gfMul(poly[j], GF_EXP[i]);  // times the root
    }
    poly = next;
  }
  return poly;
}

function rsEncode(data, ecLen) {
  const gen = rsGenerator(ecLen);
  const res = new Array(ecLen).fill(0);
  for (let i = 0; i < data.length; i++) {
    const factor = data[i] ^ res[0];
    res.shift(); res.push(0);
    if (factor !== 0) for (let j = 0; j < gen.length - 1; j++) res[j] ^= gfMul(gen[j + 1], factor);
  }
  return res;
}

function qrCapacity(version) {
  const countBits = version < 10 ? 8 : 16;
  return Math.floor((QR_L[version].data * 8 - 4 - countBits) / 8);
}

function qrEncode(text) {
  const bytes = utf8Encode(text);
  let version = 0;
  for (let v = 1; v <= 10; v++) if (qrCapacity(v) >= bytes.length) { version = v; break; }
  if (!version) throw new Error('too much data for a version 10 code at level L (' + bytes.length + ' bytes)');

  const spec = QR_L[version];
  const bits = [];
  const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  put(4, 4);                                      // byte mode
  put(bytes.length, version < 10 ? 8 : 16);
  for (const b of bytes) put(b, 8);
  const capacityBits = spec.data * 8;
  for (let i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const pads = [0xec, 0x11];
  let pi = 0;
  while (bits.length < capacityBits) { put(pads[pi++ % 2], 8); }

  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    codewords.push(v);
  }

  /* split into blocks, compute ec, interleave */
  const dataBlocks = [], ecBlocks = [];
  let offset = 0;
  spec.blocks.forEach(([count, size]) => {
    for (let b = 0; b < count; b++) {
      const chunk = codewords.slice(offset, offset + size);
      offset += size;
      dataBlocks.push(chunk);
      ecBlocks.push(rsEncode(chunk, spec.ec));
    }
  });
  const finalCw = [];
  const maxData = Math.max.apply(null, dataBlocks.map(b => b.length));
  for (let i = 0; i < maxData; i++) dataBlocks.forEach(b => { if (i < b.length) finalCw.push(b[i]); });
  for (let i = 0; i < spec.ec; i++) ecBlocks.forEach(b => finalCw.push(b[i]));

  /* matrix */
  const size = version * 4 + 17;
  const mod = [], reserved = [];
  for (let r = 0; r < size; r++) { mod.push(new Array(size).fill(0)); reserved.push(new Array(size).fill(false)); }

  const setF = (r, c, v) => { mod[r][c] = v; reserved[r][c] = true; };

  const finder = (r0, c0) => {
    for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
      const rr = r0 + r, cc = c0 + c;
      if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
      const on = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
        (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      setF(rr, cc, on ? 1 : 0);
    }
  };
  finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

  for (let i = 8; i < size - 8; i++) { setF(6, i, i % 2 === 0 ? 1 : 0); setF(i, 6, i % 2 === 0 ? 1 : 0); }

  const centers = QR_ALIGN[version];
  centers.forEach(r0 => centers.forEach(c0 => {
    if ((r0 <= 8 && c0 <= 8) || (r0 <= 8 && c0 >= size - 9) || (r0 >= size - 9 && c0 <= 8)) return;
    for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) {
      const on = Math.max(Math.abs(r), Math.abs(c)) !== 1;
      setF(r0 + r, c0 + c, on ? 1 : 0);
    }
  }));

  setF(size - 8, 8, 1);                                     // the always dark module
  for (let i = 0; i < 9; i++) { if (!reserved[8][i]) setF(8, i, 0); if (!reserved[i][8]) setF(i, 8, 0); }
  for (let i = 0; i < 8; i++) { if (!reserved[8][size - 1 - i]) setF(8, size - 1 - i, 0); if (!reserved[size - 1 - i][8]) setF(size - 1 - i, 8, 0); }

  if (version >= 7) {
    let rem = version;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >> 11) * 0x1f25);
    const vbits = ((version << 12) | rem) >>> 0;
    for (let i = 0; i < 18; i++) {
      const bit = (vbits >> i) & 1;
      setF(Math.floor(i / 3), size - 11 + (i % 3), bit);
      setF(size - 11 + (i % 3), Math.floor(i / 3), bit);
    }
  }

  /* data placement, upward then downward in two module wide columns */
  const place = (maskFn) => {
    const m = mod.map(row => row.slice());
    let bitIdx = 0, dir = -1, row = size - 1;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      while (true) {
        for (let c = 0; c < 2; c++) {
          const cc = col - c;
          if (!reserved[row][cc]) {
            let bit = 0;
            if (bitIdx < finalCw.length * 8) bit = (finalCw[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
            bitIdx++;
            if (maskFn(row, cc)) bit ^= 1;
            m[row][cc] = bit;
          }
        }
        row += dir;
        if (row < 0 || row >= size) { row -= dir; dir = -dir; break; }
      }
    }
    return m;
  };

  const masks = [
    (r, c) => (r + c) % 2 === 0,
    (r) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
    (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0
  ];

  let best = null, bestScore = Infinity;
  for (let mk = 0; mk < 8; mk++) {
    const m = place(masks[mk]);
    applyFormat(m, mk, size, reserved);
    const sc = penalty(m, size);
    if (sc < bestScore) { bestScore = sc; best = m; }
  }
  return { size: size, modules: best, version: version };
}

function applyFormat(m, mask, size) {
  const fmtData = (0x01 << 3) | mask;                        // level L is 01
  let rem = fmtData;
  for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >> 9) * 0x537);
  const bitsVal = ((fmtData << 10) | rem) ^ 0x5412;
  for (let i = 0; i < 15; i++) {
    const bit = (bitsVal >> i) & 1;
    if (i < 6) m[i][8] = bit;
    else if (i < 8) m[i + 1][8] = bit;
    else if (i === 8) m[8][7] = bit;
    else m[8][14 - i] = bit;
    if (i < 8) m[8][size - 1 - i] = bit;
    else m[size - 15 + i][8] = bit;
  }
  m[size - 8][8] = 1;
}

function penalty(m, size) {
  let score = 0;
  for (let r = 0; r < size; r++) {
    let run = 1;
    for (let c = 1; c < size; c++) {
      if (m[r][c] === m[r][c - 1]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
      else run = 1;
    }
  }
  for (let c = 0; c < size; c++) {
    let run = 1;
    for (let r = 1; r < size; r++) {
      if (m[r][c] === m[r - 1][c]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
      else run = 1;
    }
  }
  for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++) {
    const v = m[r][c];
    if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
  }
  let dark = 0;
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += m[r][c];
  const pct = dark * 100 / (size * size);
  score += Math.floor(Math.abs(pct - 50) / 5) * 10;
  return score;
}

/* Draw a QR as an inline SVG element sized to its container. */
function qrSvg(text, pxSize) {
  const q = qrEncode(text);
  const quiet = 4, total = q.size + quiet * 2;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + total + ' ' + total);
  svg.setAttribute('width', pxSize || 220);
  svg.setAttribute('height', pxSize || 220);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Channel share code');
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('width', total); bg.setAttribute('height', total); bg.setAttribute('fill', '#ffffff');
  svg.appendChild(bg);
  let d = '';
  for (let r = 0; r < q.size; r++) for (let c = 0; c < q.size; c++) {
    if (q.modules[r][c]) d += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
  }
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', '#000000');
  svg.appendChild(path);
  return svg;
}

/* ==========================================================================
   WATCHFIRE :: transports
   Two implementations behind one interface, so every station above this line
   cannot tell whether it is talking to a radio or to the simulator.
     open()  -> Promise
     write(Uint8Array) -> Promise
     close() -> Promise
     onData(Uint8Array), onClose(reason)
   ========================================================================== */

class SerialTransport {
  constructor(port, baud) {
    this.port = port;
    this.baud = baud || 115200;
    this.kind = 'serial';
    this.onData = function () {};
    this.onClose = function () {};
    this._reader = null;
    this._writer = null;
    this._reading = false;
  }

  static get supported() {
    return typeof navigator !== 'undefined' && !!navigator.serial;
  }

  async open() {
    await this.port.open({ baudRate: this.baud, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none' });
    this._writer = this.port.writable.getWriter();
    this._reader = this.port.readable.getReader();
    this._reading = true;
    this._pump();
  }

  async _pump() {
    try {
      while (this._reading) {
        const { value, done } = await this._reader.read();
        if (done) break;
        if (value && value.length) this.onData(value);
      }
    } catch (err) {
      if (this._reading) this.onClose('read error: ' + (err && err.message ? err.message : err));
      return;
    }
    if (this._reading) this.onClose('port closed by the device');
  }

  async write(bytes) {
    if (!this._writer) throw new Error('port is not open');
    await this._writer.write(bytes);
  }

  async close() {
    this._reading = false;
    try { if (this._reader) { await this._reader.cancel(); this._reader.releaseLock(); } } catch (e) {}
    try { if (this._writer) { this._writer.releaseLock(); } } catch (e) {}
    try { await this.port.close(); } catch (e) {}
    this._reader = null; this._writer = null;
  }
}

/* --------------------------------------------------------------------------
   The synthetic radio.
   It speaks the real framing and the real protobufs, so it exercises the whole
   stack below the UI. Fault modes are switchable because the failures that
   matter (a frame cut in half, a log flood mid header, an expired passkey)
   are exactly the ones you cannot ask a working radio to produce on demand.
   -------------------------------------------------------------------------- */
class SimTransport {
  constructor(opts) {
    opts = opts || {};
    this.kind = 'sim';
    this.onData = function () {};
    this.onClose = function () {};
    this.faults = Object.assign({
      splitFrames: true,      // deliver frames in ragged chunks
      debugChatter: true,     // interleave firmware log text
      malformedRun: false,    // occasional bogus magic and oversize lengths
      passkeyExpires: false,  // admin session passkey goes stale after one use
      dropHeartbeat: false    // stop answering, so the watchdog has to notice
    }, opts.faults || {});
    this.myNum = 0x7a3c1104;
    this.timers = [];
    this.open_ = false;
    this.passkey = null;
    this.passkeyUsed = 0;
    this.editOpen = false;
    this.framed = opts.framed !== false;   // BLE hands over whole messages
    this.onMessage = function () {};
    this.onLogLine = function () {};
    this.deframer = new Deframer({ onFrame: (f) => this._onToRadio(f), onStray: () => {} });
    this.outQ = [];
    this.pumping = false;
    this.nodes = this._seedNodes();
    this.channels = this._seedChannels();
    this.config = this._seedConfig();
    this.moduleConfig = this._seedModuleConfig();
    this.packetSeq = 1;
  }

  _seedNodes() {
    const now = Math.floor(Date.now() / 1000);
    const mk = (num, id, long, short, hw, role, snr, hops, lat, lon, batt, ago, precision) => ({
      $type: 'NodeInfo', num: num,
      user: { $type: 'User', id: id, long_name: long, short_name: short, hw_model: hw, role: role },
      position: lat === null ? undefined : {
        $type: 'Position', latitude_i: Math.round(lat * 1e7), longitude_i: Math.round(lon * 1e7),
        altitude: 240, time: now - ago, location_source: 2, precision_bits: precision || 32
      },
      snr: snr, last_heard: now - ago, hops_away: hops, channel: 0,
      device_metrics: { $type: 'DeviceMetrics', battery_level: batt, voltage: 3.7 + batt / 1000, channel_utilization: 4.2, air_util_tx: 1.1, uptime_seconds: 86400 + ago }
    });
    return [
      mk(this.myNum, '!7a3c1104', 'Green Shoe Base', 'GSB', 43, 0, 0, 0, 39.6528, -78.7625, 100, 2),
      mk(0x4411aa02, '!4411aa02', 'Ridge Repeater', 'RDGE', 9, 2, 6.5, 1, 39.7100, -78.8300, 92, 61),
      mk(0x91ff2201, '!91ff2201', 'Trailhead Tracker', 'THT', 50, 5, -8.25, 2, 39.6010, -78.9002, 47, 640, 16),
      mk(0x0a5c7733, '!0a5c7733', 'Shop Sensor', 'SHOP', 44, 6, 11.0, 1, null, null, 100, 180),
      mk(0x33bc0912, '!33bc0912', 'Wills Mtn Node', 'WMTN', 16, 0, -14.75, 3, 39.6790, -78.7990, 63, 4200)
    ];
  }

  _seedChannels() {
    const ch = [];
    ch.push({ $type: 'Channel', index: 0, role: 1, settings: { $type: 'ChannelSettings', psk: new Uint8Array([1]), name: '', id: 0x1a2b3c4d, uplink_enabled: false, downlink_enabled: false } });
    ch.push({ $type: 'Channel', index: 1, role: 2, settings: { $type: 'ChannelSettings', psk: new Uint8Array([0x2b, 0x7e, 0x15, 0x16, 0x28, 0xae, 0xd2, 0xa6, 0xab, 0xf7, 0x15, 0x88, 0x09, 0xcf, 0x4f, 0x3c]), name: 'garage', id: 0x5f6e7d8c, uplink_enabled: false, downlink_enabled: false } });
    for (let i = 2; i < 8; i++) ch.push({ $type: 'Channel', index: i, role: 0, settings: { $type: 'ChannelSettings', psk: new Uint8Array(0), name: '' } });
    return ch;
  }

  _seedConfig() {
    return [
      { $type: 'Config', $payload_variant: 'device', device: { $type: 'DeviceConfig', role: 0, node_info_broadcast_secs: 10800, rebroadcast_mode: 0, tzdef: 'EST5EDT,M3.2.0,M11.1.0' } },
      { $type: 'Config', $payload_variant: 'position', position: { $type: 'PositionConfig', position_broadcast_secs: 900, position_broadcast_smart_enabled: true, gps_mode: 1, position_flags: 811 } },
      { $type: 'Config', $payload_variant: 'power', power: { $type: 'PowerConfig', wait_bluetooth_secs: 60, min_wake_secs: 10 } },
      { $type: 'Config', $payload_variant: 'network', network: { $type: 'NetworkConfig', wifi_enabled: false, ntp_server: 'meshtastic.pool.ntp.org' } },
      { $type: 'Config', $payload_variant: 'display', display: { $type: 'DisplayConfig', screen_on_secs: 600, units: 1 } },
      { $type: 'Config', $payload_variant: 'lora', lora: { $type: 'LoRaConfig', use_preset: true, modem_preset: 0, region: 1, hop_limit: 3, tx_enabled: true, tx_power: 27, sx126x_rx_boosted_gain: true } },
      { $type: 'Config', $payload_variant: 'bluetooth', bluetooth: { $type: 'BluetoothConfig', enabled: true, mode: 0 } },
      { $type: 'Config', $payload_variant: 'security', security: { $type: 'SecurityConfig', public_key: new Uint8Array(32).fill(7), serial_enabled: true } },
      { $type: 'Config', $payload_variant: 'device_ui', device_ui: { $type: 'DeviceUIConfig', version: 1, screen_brightness: 153, screen_timeout: 30, theme: 0, language: 0, compass_mode: 0 } }
    ];
  }

  _seedModuleConfig() {
    return [
      { $type: 'ModuleConfig', $payload_variant: 'mqtt', mqtt: { $type: 'MQTTConfig', enabled: false, address: 'mqtt.meshtastic.org', root: 'msh' } },
      { $type: 'ModuleConfig', $payload_variant: 'serial', serial: { $type: 'SerialConfig', enabled: false, baud: 0 } },
      { $type: 'ModuleConfig', $payload_variant: 'telemetry', telemetry: { $type: 'TelemetryConfig', device_update_interval: 1800, environment_measurement_enabled: true, environment_update_interval: 1800 } },
      { $type: 'ModuleConfig', $payload_variant: 'neighbor_info', neighbor_info: { $type: 'NeighborInfoConfig', enabled: true, update_interval: 7200 } },
      /* The seven sections a real T-Lora Pager reported on 2026-08-11 that this
         build had no tables for. They are here so the case that produced the
         partially understood panel is exercised every time the suite runs. */
      { $type: 'ModuleConfig', $payload_variant: 'external_notification', external_notification: { $type: 'ExternalNotificationConfig', enabled: true, output_ms: 1000, output_vibra: 4, alert_message_vibra: true, nag_timeout: 0 } },
      { $type: 'ModuleConfig', $payload_variant: 'canned_message', canned_message: { $type: 'CannedMessageConfig', rotary1_enabled: false, updown1_enabled: true, send_bell: false } },
      { $type: 'ModuleConfig', $payload_variant: 'audio', audio: { $type: 'AudioConfig', codec2_enabled: false, bitrate: 0 } },
      { $type: 'ModuleConfig', $payload_variant: 'remote_hardware', remote_hardware: { $type: 'RemoteHardwareConfig', enabled: false } },
      { $type: 'ModuleConfig', $payload_variant: 'ambient_lighting', ambient_lighting: { $type: 'AmbientLightingConfig', led_state: true, current: 10, red: 255, green: 120, blue: 0 } },
      { $type: 'ModuleConfig', $payload_variant: 'detection_sensor', detection_sensor: { $type: 'DetectionSensorConfig', enabled: false, minimum_broadcast_secs: 45, detection_trigger_type: 1 } },
      { $type: 'ModuleConfig', $payload_variant: 'paxcounter', paxcounter: { $type: 'PaxcounterConfig', enabled: false, paxcounter_update_interval: 300 } }
    ];
  }

  async open() {
    this.open_ = true;
    this._log('INFO  | Booted, WATCHFIRE simulator, no radio attached');
    this._every(9000, () => this._ambient());
    this._every(31000, () => this._telemetryBeacon());
  }

  async close() {
    this.open_ = false;
    this.timers.forEach(clearInterval);
    this.timers = [];
  }

  _every(ms, fn) { this.timers.push(setInterval(() => { if (this.open_) fn(); }, ms)); }

  async write(bytes) {
    if (!this.open_) throw new Error('simulator is not open');
    if (this.framed) this.deframer.push(bytes);
    else this._onToRadio(bytes);          // GATT already gave the boundary
  }

  /* ---- outbound side ---- */
  /* A real wire is one ordered lane. Everything queues here and drains in
     order, in ragged chunks, so frames land across chunk boundaries the way
     they do on USB but never interleave with each other. */
  _emit(u8) {
    if (!this.open_) return;
    this.outQ.push(u8);
    this._pump();
  }

  _pump() {
    if (this.pumping) return;
    this.pumping = true;
    const step = () => {
      if (!this.open_ || !this.outQ.length) { this.pumping = false; return; }
      const cur = this.outQ[0];
      const n = this.faults.splitFrames ? Math.min(cur.length, 1 + Math.floor(Math.random() * 7)) : cur.length;
      this.onData(cur.subarray(0, n).slice());
      if (n >= cur.length) this.outQ.shift(); else this.outQ[0] = cur.subarray(n);
      setTimeout(step, this.faults.splitFrames ? 1 : 0);
    };
    step();
  }

  _log(text) {
    if (!this.faults.debugChatter) return;
    /* Over a wire the log shares the lane with framed packets. Over BLE it
       has its own characteristic, so it goes out a different door. */
    if (!this.framed) { this.onLogLine(text); return; }
    this._emit(utf8Encode(text + '\n'));
  }

  _send(fromRadio) {
    fromRadio.$type = 'FromRadio';
    if (fromRadio.id === undefined) fromRadio.id = (this.packetSeq++) >>> 0;
    const body = encode('FromRadio', fromRadio);
    if (!this.framed) { this.onMessage(body); return; }
    let framed = frameEncode(body);
    if (this.faults.malformedRun && Math.random() < 0.15) {
      const garbage = new Uint8Array([START1, 0x00, 0x41, 0x42, START1, START2, 0xff, 0xf0]);
      const both = new Uint8Array(garbage.length + framed.length);
      both.set(garbage, 0); both.set(framed, garbage.length);
      framed = both;
    }
    this._emit(framed);
  }

  /* ---- inbound side ---- */
  _onToRadio(payload) {
    let msg;
    try { msg = decode('ToRadio', payload); }
    catch (e) { this._log('WARN  | undecodable ToRadio, ' + e.message); return; }

    if (msg.want_config_id !== undefined) return this._sendConfigBurst(msg.want_config_id);
    if (msg.heartbeat) { if (!this.faults.dropHeartbeat) this._log('DEBUG | Heartbeat received'); return; }
    if (msg.disconnect) { this._log('INFO  | Client disconnected'); return; }
    if (msg.packet) return this._onMeshPacket(msg.packet);
  }

  _sendConfigBurst(nonce) {
    this._log('INFO  | Client wants config, nonce ' + nonce);
    this._send({ my_info: { $type: 'MyNodeInfo', my_node_num: this.myNum, reboot_count: 12, min_app_version: 30200, pio_env: 'heltec-v3', nodedb_count: this.nodes.length }, $payload_variant: 'my_info' });
    this._send({ metadata: { $type: 'DeviceMetadata', firmware_version: '2.7.4.simulated', device_state_version: 24, canShutdown: true, hasWifi: true, hasBluetooth: true, role: 0, hw_model: 103, hasPKC: true }, $payload_variant: 'metadata' });
    for (const n of this.nodes) this._send({ node_info: n, $payload_variant: 'node_info' });
    for (const c of this.channels) this._send({ channel: c, $payload_variant: 'channel' });
    for (const c of this.config) this._send({ config: c, $payload_variant: 'config' });
    for (const m of this.moduleConfig) this._send({ moduleConfig: m, $payload_variant: 'moduleConfig' });
    this._send({ deviceuiConfig: { $type: 'DeviceUIConfig', version: 1, screen_brightness: 153, screen_timeout: 30, theme: 0, language: 0, is_clockface_analog: true }, $payload_variant: 'deviceuiConfig' });
    this._send({ config_complete_id: nonce, $payload_variant: 'config_complete_id' });
    this._log('INFO  | Config sent');
  }

  _onMeshPacket(p) {
    const d = p.decoded;
    if (!d) return;
    if (d.portnum === ENUMS.PortNum.byName.ADMIN_APP) return this._onAdmin(p, d);
    if (d.portnum === ENUMS.PortNum.byName.TEXT_MESSAGE_APP) {
      this._send({ queueStatus: { $type: 'QueueStatus', res: 0, free: 15, maxlen: 16, mesh_packet_id: p.id }, $payload_variant: 'queueStatus' });
      if (p.want_ack) {
        setTimeout(() => this._routingAck(p), 900);
      }
      // A neighbour answers a broadcast now and then, so DISPATCH has traffic.
      if (p.to === BROADCAST_NUM && Math.random() < 0.7) {
        setTimeout(() => this._inboundText(0x4411aa02, this.myNum, 'copy that, ' + (Math.random() < 0.5 ? 'clear here' : 'wind picking up')), 3500);
      }
      return;
    }
    if (d.portnum === ENUMS.PortNum.byName.TRACEROUTE_APP) {
      setTimeout(() => this._tracerouteReply(p), 1200);
    }
  }

  _routingAck(p) {
    const routing = { $type: 'Routing', error_reason: 0, $variant: 'error_reason' };
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: p.to === BROADCAST_NUM ? 0x4411aa02 : p.to, to: this.myNum,
        id: (this.packetSeq++) >>> 0, rx_time: Math.floor(Date.now() / 1000), rx_snr: 6.25, rx_rssi: -84,
        hop_limit: 3, hop_start: 3, priority: 120,
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.ROUTING_APP, payload: encode('Routing', routing), request_id: p.id },
        $payload_variant: 'decoded'
      }
    });
  }

  _tracerouteReply(p) {
    /* SNR here is on the RouteDiscovery scale of dB times four, and -128 is the
       sentinel firmware uses for a hop that reported none. One leg carries it
       deliberately so the reader is exercised. */
    const far = p.to === 0x33bc0912;
    const rd = far
      ? { $type: 'RouteDiscovery', route: [0x4411aa02, 0x91ff2201], snr_towards: [26, 6, -128], route_back: [0x4411aa02], snr_back: [18, 22] }
      : { $type: 'RouteDiscovery', route: [], snr_towards: [26], route_back: [], snr_back: [22] };
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: p.to, to: this.myNum, id: (this.packetSeq++) >>> 0,
        rx_time: Math.floor(Date.now() / 1000), rx_snr: 5.5, rx_rssi: -90, hop_limit: 3, hop_start: 3,
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.TRACEROUTE_APP, payload: encode('RouteDiscovery', rd), request_id: p.id },
        $payload_variant: 'decoded'
      }
    });
  }

  _onAdmin(p, d) {
    let admin;
    try { admin = decode('AdminMessage', d.payload); }
    catch (e) { this._log('WARN  | bad admin message'); return; }

    const needsKey = admin.set_config || admin.set_module_config || admin.set_channel || admin.set_owner || admin.commit_edit_settings || admin.begin_edit_settings;
    if (needsKey) {
      const given = admin.session_passkey ? bytesToHex(admin.session_passkey) : '';
      const held = this.passkey ? bytesToHex(this.passkey) : '';
      const expired = this.faults.passkeyExpires && this.passkeyUsed >= 1;
      if (!held || given !== held || expired) {
        this._log('WARN  | Admin rejected, bad session key');
        this._routingError(p, ENUMS.RoutingError.byName.ADMIN_BAD_SESSION_KEY);
        return;
      }
      this.passkeyUsed++;
    }

    const reply = (obj) => {
      obj.$type = 'AdminMessage';
      this.passkey = this.passkey || randomBytes(8);
      obj.session_passkey = this.passkey;
      this.passkeyUsed = 0;
      this._send({
        $payload_variant: 'packet',
        packet: {
          $type: 'MeshPacket', from: this.myNum, to: this.myNum, id: (this.packetSeq++) >>> 0,
          rx_time: Math.floor(Date.now() / 1000), channel: 0,
          decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.ADMIN_APP, payload: encode('AdminMessage', obj), request_id: p.id },
          $payload_variant: 'decoded'
        }
      });
    };

    if (admin.get_device_metadata_request !== undefined) {
      return reply({ get_device_metadata_response: { $type: 'DeviceMetadata', firmware_version: '2.7.4.simulated', hw_model: 43, role: 0, hasPKC: true }, $payload_variant: 'get_device_metadata_response' });
    }
    if (admin.get_config_request !== undefined) {
      const idx = admin.get_config_request;
      const found = this.config[idx] || this.config[0];
      return reply({ get_config_response: found, $payload_variant: 'get_config_response' });
    }
    if (admin.begin_edit_settings !== undefined) { this.editOpen = true; this._log('INFO  | Edit transaction open'); return; }
    if (admin.commit_edit_settings !== undefined) { this.editOpen = false; this._log('INFO  | Settings committed'); return; }
    if (admin.set_config) {
      const variant = admin.set_config.$payload_variant;
      const slot = this.config.findIndex(c => c.$payload_variant === variant);
      if (slot >= 0) this.config[slot] = admin.set_config;
      this._log('INFO  | Wrote ' + variant + ' config');
      return;
    }
    if (admin.set_channel) {
      const ch = admin.set_channel;
      this.channels[ch.index] = ch;
      this._log('INFO  | Wrote channel ' + ch.index);
      return;
    }
  }

  _routingError(p, code) {
    const routing = { $type: 'Routing', error_reason: code, $variant: 'error_reason' };
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: this.myNum, to: this.myNum, id: (this.packetSeq++) >>> 0,
        rx_time: Math.floor(Date.now() / 1000),
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.ROUTING_APP, payload: encode('Routing', routing), request_id: p.id },
        $payload_variant: 'decoded'
      }
    });
  }

  _inboundText(from, to, text) {
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: from, to: to, id: (this.packetSeq++) >>> 0,
        rx_time: Math.floor(Date.now() / 1000), rx_snr: 6.75, rx_rssi: -88, hop_limit: 3, hop_start: 3, channel: 0,
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.TEXT_MESSAGE_APP, payload: utf8Encode(text) },
        $payload_variant: 'decoded'
      }
    });
  }

  _neighborReport(owner, neighbours) {
    const ni = {
      $type: 'NeighborInfo', node_id: owner, last_sent_by_id: owner, node_broadcast_interval_secs: 7200,
      neighbors: neighbours.map(n => ({ $type: 'Neighbor', node_id: n[0], snr: n[1], last_rx_time: Math.floor(Date.now() / 1000) - n[2], node_broadcast_interval_secs: 7200 }))
    };
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: owner, to: BROADCAST_NUM, id: (this.packetSeq++) >>> 0,
        rx_time: Math.floor(Date.now() / 1000), rx_snr: 7.25, rx_rssi: -84, channel: 0, hop_limit: 2, hop_start: 3,
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.NEIGHBORINFO_APP, payload: encode('NeighborInfo', ni) },
        $payload_variant: 'decoded'
      }
    });
  }

  /* Every node that reports neighbours, in one go, so the graph has something
     to draw without waiting for the ambient scheduler to get round to it. */
  neighborSweep() {
    this._neighborReport(0x4411aa02, [[this.myNum, 6.5, 40], [0x91ff2201, -3.25, 120], [0x33bc0912, -14.0, 900]]);
    this._neighborReport(0x91ff2201, [[0x4411aa02, -2.5, 90], [0x0a5c7733, 9.75, 200]]);
    this._neighborReport(0x0a5c7733, [[0x91ff2201, 10.25, 210], [this.myNum, 11.0, 60]]);
    this._log('INFO  | Neighbour info broadcast');
  }

  _ambient() {
    const r = Math.random();
    if (r < 0.35) {
      const n = this.nodes[1 + Math.floor(Math.random() * (this.nodes.length - 1))];
      n.last_heard = Math.floor(Date.now() / 1000);
      n.snr = Math.round((Math.random() * 22 - 15) * 4) / 4;
      this._send({ node_info: n, $payload_variant: 'node_info' });
    } else if (r < 0.6) {
      this._inboundText(0x91ff2201, BROADCAST_NUM, ['at the trailhead', 'battery at 47', 'moving to the ridge', 'nothing to report'][Math.floor(Math.random() * 4)]);
    } else if (r < 0.7) {
      this._neighborReport(0x4411aa02, [[this.myNum, 6.5, 40], [0x91ff2201, -3.25, 120]]);
    } else if (r < 0.75) {
      this._log('DEBUG | [Router] Sending packet, hop_limit=3');
    } else if (r < 0.9) {
      // A packet on a channel we do not hold the key for.
      this._send({
        $payload_variant: 'packet',
        packet: {
          $type: 'MeshPacket', from: 0x77aa1200, to: BROADCAST_NUM, id: (this.packetSeq++) >>> 0,
          rx_time: Math.floor(Date.now() / 1000), rx_snr: -12.5, rx_rssi: -119, channel: 5,
          encrypted: randomBytes(24), $payload_variant: 'encrypted'
        }
      });
    }
  }

  /* Send a run of telemetry with rx_time and Telemetry.time spread backwards
     over a window, the way a store and forward node dumps a backlog. Real
     packets through the real path, so the charts have something to show
     without waiting an hour for it. */
  _telemetryBurst(minutes, step) {
    minutes = minutes || 60;
    step = step || 5;
    const now = Math.floor(Date.now() / 1000);
    const count = Math.floor(minutes / step);
    for (let i = count; i >= 1; i--) {
      const when = now - i * step * 60;
      const phase = (count - i) / count;
      this._deviceTelemetry(0x4411aa02, when, {
        battery_level: Math.max(4, Math.round(96 - phase * 38)),
        voltage: 4.12 - phase * 0.55,
        channel_utilization: 3 + Math.sin(phase * 7) * 2.4 + phase * 4,
        air_util_tx: 0.8 + Math.sin(phase * 4) * 0.5 + phase * 1.2,
        uptime_seconds: 100000 + (count - i) * step * 60
      });
      this._environmentTelemetry(0x0a5c7733, when, {
        temperature: 18.5 + Math.sin(phase * 6.3) * 6.2,
        relative_humidity: 52 + Math.cos(phase * 5.1) * 14,
        barometric_pressure: 1012.4 - phase * 3.1,
        lux: Math.max(0, 420 + Math.sin(phase * 3.1) * 380)
      });
    }
    this._log('INFO  | Store and forward backlog delivered, ' + (count * 2) + ' readings');
  }

  _deviceTelemetry(from, when, metrics) {
    const t = { $type: 'Telemetry', time: when, $variant: 'device_metrics', device_metrics: Object.assign({ $type: 'DeviceMetrics' }, metrics) };
    this._telemetryPacket(from, when, t);
  }

  _environmentTelemetry(from, when, metrics) {
    const t = { $type: 'Telemetry', time: when, $variant: 'environment_metrics', environment_metrics: Object.assign({ $type: 'EnvironmentMetrics' }, metrics) };
    this._telemetryPacket(from, when, t);
  }

  _telemetryPacket(from, when, t) {
    this._send({
      $payload_variant: 'packet',
      packet: {
        $type: 'MeshPacket', from: from, to: BROADCAST_NUM, id: (this.packetSeq++) >>> 0,
        rx_time: when, rx_snr: 8.5, rx_rssi: -80, channel: 0, hop_limit: 2, hop_start: 3,
        decoded: { $type: 'Data', portnum: ENUMS.PortNum.byName.TELEMETRY_APP, payload: encode('Telemetry', t) },
        $payload_variant: 'decoded'
      }
    });
  }

  _telemetryBeacon() {
    const now = Math.floor(Date.now() / 1000);
    this.envPhase = (this.envPhase || 0) + 0.35;
    this._deviceTelemetry(0x4411aa02, now, {
      battery_level: 88 + Math.floor(Math.random() * 8),
      voltage: 4.02 + Math.random() * 0.1,
      channel_utilization: Math.round((4 + Math.sin(this.envPhase) * 3 + Math.random()) * 100) / 100,
      air_util_tx: Math.round((1.2 + Math.sin(this.envPhase * 0.7) * 0.8 + Math.random() * 0.3) * 100) / 100,
      uptime_seconds: 90000 + Math.floor(this.envPhase * 600)
    });
    this._environmentTelemetry(0x0a5c7733, now, {
      temperature: Math.round((19 + Math.sin(this.envPhase * 0.6) * 5.5 + Math.random() * 0.4) * 100) / 100,
      relative_humidity: Math.round((54 + Math.cos(this.envPhase * 0.5) * 12) * 10) / 10,
      barometric_pressure: Math.round((1011 + Math.sin(this.envPhase * 0.2) * 4) * 10) / 10,
      lux: Math.max(0, Math.round(400 + Math.sin(this.envPhase * 0.4) * 350))
    });
  }
}

/* Replay a captured stream at its recorded timing. LOGBOOK writes these. */
class ReplayTransport {
  constructor(capture, speed) {
    this.kind = 'replay';
    /* One way. There is nothing on the other end to answer a config request,
       so the session must not send one and must not clear what the recording
       has already told it. */
    this.oneWay = true;
    this.capture = capture;
    this.speed = speed || 1;
    this.onData = function () {};
    this.onClose = function () {};
    this.timer = null;
  }
  async open() {
    this.events = (this.capture.events || []).filter(e => e.dir === 'in');
  }
  /* Playback begins only once the session has finished wiring itself up,
     otherwise the first frames arrive before anything is listening. */
  start() {
    const events = this.events || [];
    let i = 0;
    const t0 = events.length ? events[0].t : 0;
    const startedAt = Date.now();
    const tick = () => {
      while (i < events.length && (Date.now() - startedAt) * this.speed >= (events[i].t - t0)) {
        this.onData(hexToBytes(events[i].hex));
        i++;
      }
      if (i >= events.length) { clearInterval(this.timer); this.timer = null; this.onClose('replay finished'); }
    };
    this.timer = setInterval(tick, 15);
    tick();
  }
  async write() { /* a replay does not listen */ }
  async close() { if (this.timer) clearInterval(this.timer); this.timer = null; }
}

/* ==========================================================================
   WATCHFIRE :: Bluetooth Low Energy transport
   Confirmed working from a file:// page against a LILYGO T-Lora Pager on
   2026-08-11, so this lives inside the no server rule like everything else.

   BLE is not the serial protocol wearing a different coat. There is no
   0x94 0xC3 framing, because GATT already supplies the message boundary:
   one write is one ToRadio, one read is one FromRadio, and an empty read
   means the queue is drained. The deframer is therefore bypassed rather
   than fed invented headers, and station 01 says plainly that this
   transport has no lane to watch.

   UUIDs read from meshtastic/firmware src/BluetoothCommon.h, 2026-08-11.
   ========================================================================== */

const BLE_SERVICE = '6ba1b218-15a8-461f-9fa8-5dcae273eafd';
const BLE_TORADIO = 'f75c76d2-129e-4dad-a1dd-7866124401e7';
const BLE_FROMRADIO = '2c55e69e-4993-11ed-b878-0242ac120002';
const BLE_FROMNUM = 'ed9da18c-a800-4f66-a670-aa7547e34453';
const BLE_LOGRADIO = '5a3d6e49-06e6-4423-9944-e9de8cdf9547';
const BLE_LOGRADIO_LEGACY = '6c6fd238-78fa-436b-aacf-15c5be1ef2e2';

/* An idle BLE client gets dropped. Observed at 35.8 s on a Pager that was
   connected but had never sent anything, and firmware is explicit that a
   ToRadio is what keeps the radio awake for its client. A real session sends
   want_config_id immediately so it should never be idle, but the margin is
   cheap and the failure is a silent disconnect, so the BLE heartbeat runs far
   inside that window rather than at the 300 s the serial link uses. */
const BLE_HEARTBEAT_MS = 15000;

/* gatt.connect() never times out on its own. If the radio is not advertising,
   out of range, or still tearing down the previous connection, the promise
   simply never settles, the link sits in "opening" forever, and because the
   attempt never fails no retry after it ever runs. One stuck attempt kills the
   whole backoff chain, so every connect is raced against a clock. */
const BLE_CONNECT_TIMEOUT_MS = 12000;

class BleTransport {
  constructor(device, opts) {
    opts = opts || {};
    this.kind = 'ble';
    /* GATT hands over whole messages, so nothing here is framed. */
    this.framed = false;
    this.device = device;
    /* The log characteristic is chatty. A busy ESP32 will notify a line at a
       time, up to 512 bytes each, while the drain loop is also reading. On a
       connection negotiated for low power that is enough traffic to miss the
       six second supervision window and lose the link, so it is off unless
       asked for. Real clients treat it as a debug option too. */
    this.enableLog = !!opts.enableLog;
    /* A timeline of what the link did, so a premature close can be read
       rather than guessed at. This is the whole point of the panel in
       station 01. */
    this.events = [];
    this.openedAt = 0;
    this.lastWriteAt = 0;
    this.lastReadAt = 0;
    this.onData = function () {};
    this.onMessage = function () {};
    this.onLog = function () {};
    this.onClose = function () {};
    this.server = null;
    this.chars = {};
    this.stats = { reads: 0, writes: 0, notifies: 0, messages: 0, empties: 0, logLines: 0 };
    this._queue = Promise.resolve();
    this._draining = false;
    this._again = false;
    this._open = false;
  }

  static get supported() {
    return typeof navigator !== 'undefined' && !!navigator.bluetooth;
  }

  static async request(opts) {
    if (!BleTransport.supported) throw new Error('this browser does not expose navigator.bluetooth');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BLE_SERVICE] }],
      optionalServices: [BLE_SERVICE]
    });
    return new BleTransport(device, opts);
  }

  _detach() {
    try { if (this._onDrop) this.device.removeEventListener('gattserverdisconnected', this._onDrop); } catch (e) {}
  }

  async _connectWithTimeout(ms) {
    /* A GATT left half open by a previous attempt makes the next connect hang,
       so it is cleared before asking again rather than hoped about. */
    try { if (this.device.gatt.connected) this.device.gatt.disconnect(); } catch (e) {}
    let timer = null;
    const clock = new Promise((resolve, reject) => {
      timer = setTimeout(() => {
        this._note('timeout', 'no answer after ' + (ms / 1000) + ' s, cancelling');
        /* Cancel the pending connection. Left running it will interfere with
           every attempt after it. */
        try { this.device.gatt.disconnect(); } catch (e) {}
        reject(new Error('the radio did not answer inside ' + (ms / 1000) + ' s and the attempt was cancelled. After a disconnect a radio needs a moment to start advertising again, so this is normal on the first retry and a real problem if it keeps happening.'));
      }, ms);
    });
    try {
      return await Promise.race([this.device.gatt.connect(), clock]);
    } finally {
      clearTimeout(timer);
    }
  }

  _note(kind, detail) {
    const at = this.openedAt ? Date.now() - this.openedAt : 0;
    this.events.push({ at: at, kind: kind, detail: detail || '' });
    if (this.events.length > 240) this.events.shift();
  }

  /* Chrome rejects concurrent GATT operations, so every one of them goes
     through a single lane. Same property the serial wire has for free. */
  _gatt(fn) {
    const run = this._queue.then(fn, fn);
    this._queue = run.then(() => {}, () => {});
    return run;
  }

  async open() {
    this.openedAt = Date.now();
    this._onDrop = () => {
      if (!this._open) return;
      this._open = false;
      const sinceWrite = this.lastWriteAt ? Math.round((Date.now() - this.lastWriteAt) / 1000) : null;
      const sinceRead = this.lastReadAt ? Math.round((Date.now() - this.lastReadAt) / 1000) : null;
      const elapsed = Math.round((Date.now() - this.openedAt) / 1000);
      this._note('drop', elapsed + ' s after connect, ' +
        (sinceWrite === null ? 'nothing ever written' : sinceWrite + ' s since the last write') + ', ' +
        (sinceRead === null ? 'nothing ever read' : sinceRead + ' s since the last read'));
