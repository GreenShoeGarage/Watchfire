    try { const d = await fn(); say(group, name, true, d); }
    catch (e) { say(group, name, false, e && e.message ? e.message : String(e)); }
  };
  const eq = (a, b, what) => { if (a !== b) throw new Error((what || 'values differ') + ': ' + a + ' vs ' + b); };
  const ok = (c, what) => { if (!c) throw new Error(what || 'assertion failed'); };
  const sameBytes = (a, b, what) => {
    if (a.length !== b.length) throw new Error((what || 'length') + ' ' + a.length + ' vs ' + b.length);
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) throw new Error((what || 'byte') + ' differs at ' + i);
  };

  /* ---------- codec ---------- */
  t('codec', 'varint round trip across the boundaries', () => {
    const vals = [0, 1, 127, 128, 255, 16383, 16384, 2097151, 268435455, 268435456, 4294967295];
    vals.forEach(v => {
      const b = encode('Heartbeat', { $type: 'Heartbeat', nonce: v });
      eq(decode('Heartbeat', b).nonce, v, 'nonce ' + v);
    });
    return vals.length + ' values';
  });

  t('codec', 'negative int32 survives', () => {
    const b = encode('MeshPacket', { $type: 'MeshPacket', rx_rssi: -128 });
    eq(decode('MeshPacket', b).rx_rssi, -128);
    const c = encode('MeshPacket', { $type: 'MeshPacket', rx_rssi: -1 });
    eq(decode('MeshPacket', c).rx_rssi, -1);
    return 'two values';
  });

  t('codec', 'zigzag sint32 survives', () => {
    [0, -1, 1, -2147483648, 2147483647].forEach(v => {
      const b = encode('Position', { $type: 'Position', altitude_hae: v });
      eq(decode('Position', b).altitude_hae, v, 'altitude_hae ' + v);
    });
    return '5 values';
  });

  t('codec', 'float and sfixed32 survive', () => {
    const b = encode('MeshPacket', { $type: 'MeshPacket', rx_snr: -7.25 });
    eq(decode('MeshPacket', b).rx_snr, -7.25);
    const p = encode('Position', { $type: 'Position', latitude_i: -396528000, longitude_i: -787625000 });
    const d = decode('Position', p);
    eq(d.latitude_i, -396528000); eq(d.longitude_i, -787625000);
    return 'snr and coordinates';
  });

  t('codec', 'packed repeated fields survive', () => {
    const rd = { $type: 'RouteDiscovery', route: [0x1234, 0x5678, 0x9abc], snr_towards: [-8, 12, 0] };
    const d = decode('RouteDiscovery', encode('RouteDiscovery', rd));
    eq(d.route.join(','), '4660,22136,39612');
    eq(d.snr_towards.join(','), '-8,12,0');
    return '3 elements each';
  });

  t('codec', 'strings survive including multibyte', () => {
    const s = 'Wills Mtn \u00e9\u00e8 \u65e5\u672c \u00b0C';
    const d = decode('User', encode('User', { $type: 'User', long_name: s, short_name: 'WM' }));
    eq(d.long_name, s);
    return d.long_name.length + ' chars';
  });

  t('codec', 'every schema table round trips its own defaults', () => {
    let n = 0;
    for (const name in SCHEMA) {
      const obj = { $type: name };
      const back = decode(name, encode(name, obj));
      eq(back.$type, name);
      n++;
    }
    return n + ' message types';
  });

  t('codec', 'unknown fields are preserved byte for byte', () => {
    const w = new Writer();
    w.tag(1, 0); w.varint(1);
    w.tag(8, 0); w.varint(3);
    w.tag(200, 0); w.varint(12345);
    w.tag(201, 2); w.lenPrefixed(utf8Encode('a field from the future'));
    const lora = w.finish();
    const o = new Writer(); o.tag(6, 2); o.lenPrefixed(lora);
    const original = o.finish();
    const cfg = decode('Config', original);
    ok(cfg.$partial, 'parent must be flagged partial');
    ok(cfg.lora.$partial, 'inner must be flagged partial');
    eq(unknownReport(cfg).length, 2, 'unknown field count');
    sameBytes(encode('Config', cfg), original, 're-encode');
    return '2 unknown fields, byte exact';
  });

  t('codec', 'a wire type that disagrees with the schema is kept, not coerced', () => {
    const w = new Writer();
    w.tag(9, 2); w.lenPrefixed(utf8Encode('not a varint'));   // hop_limit as a string
    const b = w.finish();
    const p = decode('MeshPacket', b);
    ok(p.$partial, 'must be flagged partial');
    ok(p.hop_limit === undefined, 'must not have invented a hop_limit');

    ok(!b.sections.capture, 'the raw capture stays out unless it is asked for');
    /* the bundle must survive a JSON round trip, which is the only thing it is for */
    const back = JSON.parse(JSON.stringify(b));
    eq(back.sections.roster.nodes.length, s.nodes.size, 'roster survives serialisation');
    ok(typeof back.sections.channels.channels[0].settings.psk.$bytes === 'string', 'byte fields serialise as hex rather than as an object of digits');
    await s.disconnect();
    return Object.keys(b.sections).length + ' sections';
  });

  await ta('logbook', 'the printable summary states plainly when no radio was involved', async () => {
    const sim = new SimTransport({ faults: { splitFrames: false, debugChatter: false } });
    const s = new RadioSession();
    APP.transport = sim;
    await s.connect(sim);
    const deadline = Date.now() + 8000;
    while (s.state !== 'ready' && Date.now() < deadline) await sleep(40);
    s.addNote('kept note');
    s.strikeNote(s.notes[0].id);
    const md = summaryMarkdown(s);
    ok(md.indexOf('WATCHFIRE session summary') >= 0, 'it has a title');
    ok(md.indexOf('did not involve a physical radio') >= 0, 'a simulated session must say so at the top');
    ok(md.indexOf('(struck) kept note') >= 0, 'a struck note appears marked rather than vanishing');
    ok(md.indexOf('not a survey of the mesh') >= 0, 'and it closes with what it is not');
    ok(md.indexOf('Roster, ' + s.nodes.size + ' nodes') >= 0, 'the roster is summarised');
    await s.disconnect();
    return md.split('\n').length + ' lines of summary';
  });

  /* ---------- geometry ---------- */
  t('geometry', 'range and bearing agree with a known pair', () => {
    const km = haversineKm(39.6528, -78.7625, 39.7100, -78.8300);
    ok(km > 8 && km < 9.5, 'Cumberland to the ridge should be about 9 km, got ' + km.toFixed(2));
    const b = bearingDeg(39.6528, -78.7625, 39.7100, -78.8300);
    ok(b > 300 && b < 340, 'bearing should be north west, got ' + b.toFixed(1));
    eq(posLatLon({ latitude_i: 0, longitude_i: 0 }), null, 'a null island fix must count as no fix');
    return km.toFixed(2) + ' km at ' + b.toFixed(0) + ' degrees';
  });

  t('geometry', 'position precision decodes as the cell firmware quantised to', () => {
    /* firmware masks with UINT32_MAX << (32 - bits) and reports the cell centre,
       so the half cell is 2 ** (31 - bits) in units of 1e-7 degrees */
    eq(positionUncertainty(32, 40), null, 'full precision has no uncertainty cell');
    eq(positionUncertainty(undefined, 40), null, 'a node that stated nothing claims nothing');
    const u16 = positionUncertainty(16, 0);
    eq(u16.halfDeg, Math.pow(2, 15) / 1e7, '16 bits gives a half cell of 2^15 in 1e-7 degrees');
    ok(u16.northM > 350 && u16.northM < 400, '16 bits is a few hundred metres, got ' + u16.northM.toFixed(0));
    const u12 = positionUncertainty(12, 0);
    ok(u12.northM > u16.northM * 15, 'fewer bits must mean a much larger cell');
    const atLat = positionUncertainty(16, 60);
    ok(atLat.eastM < u16.eastM, 'the east west cell narrows with latitude');
    eq(Math.round(atLat.northM), Math.round(u16.northM), 'the north south cell does not');
    return '16 bits is about ' + u16.northM.toFixed(0) + ' m either way';
  });

  t('geometry', 'the plot places a node at the range and bearing in the table', () => {
    const cx = 100, cy = 100, mPerPx = 100;   // 100 m per pixel
    const north = plotPoint(1, 0, mPerPx, cx, cy);
    eq(Math.round(north.x), 100, 'due north stays on the centre line');
    eq(Math.round(north.y), 90, 'and plots above the centre');
    const east = plotPoint(1, 90, mPerPx, cx, cy);
    eq(Math.round(east.x), 110, 'due east plots to the right');
    eq(Math.round(east.y), 100, 'and stays level');
    const south = plotPoint(2, 180, mPerPx, cx, cy);
    eq(Math.round(south.y), 120, 'twice the range is twice the distance from the centre');
    const zero = plotPoint(0, 0, mPerPx, cx, cy);
    eq(Math.round(zero.x), 100); eq(Math.round(zero.y), 100, 'zero range sits on the reference');
    return 'polar placement agrees with the figures';
  });

  t('geometry', 'scale ranges and cardinal names round the way a person would write them', () => {
    eq(niceRange(0.7), 1, 'just under a kilometre rounds up to one');
    eq(niceRange(3.2), 5, 'three and a bit becomes five');
    eq(niceRange(12), 20, 'twelve becomes twenty');
    ok(niceRange(0.03) <= 0.1, 'a very short range stays small, got ' + niceRange(0.03));
    eq(bearingCardinal(0), 'N'); eq(bearingCardinal(90), 'E');
    eq(bearingCardinal(180), 'S'); eq(bearingCardinal(315), 'NW');
    eq(bearingCardinal(359), 'N', 'the compass wraps');
    eq(bearingCardinal(-45), 'NW', 'and handles a negative bearing');
    return 'scale steps and 16 point compass';
  });

  await ta('geometry', 'range and bearing are measured from the chosen reference only', async () => {
    const sim = new SimTransport({ faults: { splitFrames: false, debugChatter: false } });
    const s = new RadioSession();
    await s.connect(sim);
    const deadline = Date.now() + 8000;
    while (s.state !== 'ready' && Date.now() < deadline) await sleep(40);
    const me = posLatLon(s.nodes.get(s.myNodeNum).position);
    const rows = bearingRows(s, me);
    const self = rows.filter(r => r.num === s.myNodeNum)[0];
    ok(self.isRef, 'the reference node must know it is the reference');
    eq(Math.round(self.rangeKm * 1000), 0, 'and be at zero range from itself');
    const shop = rows.filter(r => r.num === 0x0a5c7733)[0];
    eq(shop.rangeKm, null, 'a node with no position gets no range rather than a zero');
    eq(shop.pos, null, 'and no coordinates');
    const ridge = rows.filter(r => r.num === 0x4411aa02)[0];
    ok(ridge.rangeKm > 8 && ridge.rangeKm < 10, 'the ridge should be about 9 km, got ' + ridge.rangeKm.toFixed(2));
    ok(ridge.bearing > 300 && ridge.bearing < 340, 'to the north west, got ' + ridge.bearing.toFixed(0));
    const tracker = rows.filter(r => r.num === 0x91ff2201)[0];
    ok(tracker.uncertainty, 'the tracker coarsens its position and that must be carried');
    eq(tracker.uncertainty.bits, 16, 'at 16 bits');
    /* measuring from a different reference must move everything */
    const fromRidge = bearingRows(s, posLatLon(s.nodes.get(0x4411aa02).position));
    const meFromRidge = fromRidge.filter(r => r.num === s.myNodeNum)[0];
    ok(Math.abs(meFromRidge.rangeKm - ridge.rangeKm) < 0.001, 'range is symmetric between the two nodes');
    ok(Math.abs(((meFromRidge.bearing + 180) % 360) - ridge.bearing) < 1, 'and the reciprocal bearing is the reverse');
    await s.disconnect();
    return 'ridge at ' + ridge.rangeKm.toFixed(2) + ' km, ' + ridge.bearing.toFixed(0) + ' degrees';
  });

  t('geometry', 'node ids format the way the firmware writes them', () => {
    eq(nodeIdHex(0x7a3c1104), '!7a3c1104');
    eq(nodeIdHex(0x0000000a), '!0000000a');
    return 'padded to eight digits';
  });

  return { pass: pass, fail: fail, results: results };
}

function runSelfTestDialog() {
  const body = el('div');
  const summary = el('div', { class: 'note' }, 'running\u2026');
  const list = el('div');
  body.append(summary, list);
  showDialog('Self test', body, [{ label: 'Close', primary: true }]);
  let lastGroup = null;
  runSelfTest((r) => {
    if (r.group !== lastGroup) { list.append(el('h4', null, r.group)); lastGroup = r.group; }
    list.append(el('div', { class: 'row', style: 'gap:8px;align-items:baseline' },
      el('span', { class: 'tagline ' + (r.ok ? 'ok' : 'bad') }, r.ok ? 'pass' : 'FAIL'),
      el('span', null, r.name),
      el('span', { style: 'color:var(--faint);font-size:11px' }, r.detail)));
  }).then(res => {
    clear(summary);
    summary.append(el('div', { class: res.fail ? 'badbox' : 'okbox' },
      res.pass + ' assertions green, ' + res.fail + ' failed, ' + (res.pass + res.fail) + ' total.'));
    if (!res.fail) toast('Self test: ' + res.pass + ' green.', 'ok');
    else toast('Self test: ' + res.fail + ' failed.', 'bad');
  });
}

/* ==========================================================================
   WATCHFIRE :: boot
   ========================================================================== */

/* The PWA layer is additive and never load bearing. From file:// there is no
   service worker at all and the instrument is complete without one. */
function installPwaLayer() {
  try {
    const icon = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
      '<rect width="192" height="192" fill="#0b0d10"/>' +
      '<path d="M96 26c19 31 8 45-2 59-10 15-17 26-8 42 4 6 1 14-5 16-10 4-19-7-19-21 0-5-5-7-8-3-8 10-12 23-12 37 0 32 26 58 58 58s58-26 58-58c0-34-19-49-32-69-12-19-15-44-30-61z" fill="#ff9d3d"/>' +
      '<path d="M96 214c-17 0-30-14-30-31 0-19 16-26 23-44 10 15 36 25 36 44 0 17-12 31-29 31z" fill="#0b0d10" opacity=".55"/></svg>');
    const manifest = {
      name: 'WATCHFIRE', short_name: 'Watchfire',
      description: 'A local first bench for a Meshtastic radio.',
      start_url: '.', display: 'standalone', background_color: '#0b0d10', theme_color: '#ff9d3d',
      icons: [{ src: icon, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    const ico = document.createElement('link');
    ico.rel = 'icon'; ico.href = icon;
    document.head.appendChild(ico);
    const meta = document.createElement('meta');
    meta.name = 'theme-color'; meta.content = '#ff9d3d';
    document.head.appendChild(meta);

    if ((location.protocol === 'http:' || location.protocol === 'https:') && navigator.serviceWorker) {
      navigator.serviceWorker.register('./watchfire-sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', () => {
            if (w.state === 'installed' && navigator.serviceWorker.controller) {
              toast('A newer WATCHFIRE is cached. Reload to use it.');
            }
          });
        });
      }).catch(() => { /* no sibling worker on disk, which is the normal case */ });
    }
  } catch (e) { /* the instrument does not depend on any of this */ }
}

function boot() {
  setTheme('night');
  renderShell();
  installPwaLayer();
  if (!SerialTransport.supported) {
    setStatus('idle', 'simulator only here');
  }
  debugLog('WATCHFIRE ' + VERSION + ' ready, protobuf tables from ' + PROTO_PROVENANCE);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
